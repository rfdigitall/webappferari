/* IMPOSTAZIONI — R3 #1: prezzo al km per il calcolo trasferta    */
/* ============================================================ */
function ImpostazioniPage({ impostazioni, setImpostazioni }) {
  const [prezzoKm, setPrezzoKm] = useState((impostazioni.prezzo_km || '0.45').toString().replace('.', ','));
  const [salvando, setSalvando] = useState(false);
  const [salvato, setSalvato] = useState(false);

  const salva = async () => {
    const valore = parseFloat((prezzoKm || '0').replace(',', '.'));
    if (isNaN(valore) || valore < 0) {
      mostraToast('Inserisci un prezzo al km valido.');
      return;
    }
    setSalvando(true);
    const { error } = await sb.from('impostazioni')
      .upsert({ chiave: 'prezzo_km', valore: String(valore) });
    setSalvando(false);
    if (error) {
      mostraToast('Errore nel salvare: ' + error.message);
      return;
    }
    setImpostazioni(prev => ({ ...prev, prezzo_km: String(valore) }));
    setSalvato(true);
    setTimeout(() => setSalvato(false), 2000);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
      <div className="app-card p-5 max-w-md">
        <p className="text-sm font-semibold text-slate-900 mb-1">Trasferta</p>
        <p className="text-xs text-slate-400 mb-4">Usato per calcolare in automatico il costo del viaggio nei preventivi, in base ai km percorsi.</p>
        <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo al km (€)</label>
        <div className="flex items-center gap-2">
          <input
            type="text"
            inputMode="decimal"
            value={prezzoKm}
            onChange={(e) => setPrezzoKm(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && salva()}
            placeholder="0,45"
            className="w-32 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
          <button
            onClick={salva}
            disabled={salvando}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60"
          >
            {salvando ? 'Salvo...' : salvato ? '✓ Salvato' : 'Salva'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================ */
/* PAGINA CATALOGO PRODOTTI — finiture premium, organizzate       */
/* ============================================================ */

function CatalogoPage({ prodotti, setProdotti, prodottiLoading }) {
  const [activeCat, setActiveCat] = useState(categorieCatalogo[0]);
  const [activeSub, setActiveSub] = useState('Tutte');
  const [activeFornitoreFiltro, setActiveFornitoreFiltro] = useState('Tutti');
  const [queryRicerca, setQueryRicerca] = useState('');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newFornitore, setNewFornitore] = useState('');
  const [newSub, setNewSub] = useState('');
  const [newTier, setNewTier] = useState('Standard');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [newCodice, setNewCodice] = useState('');
  const [newDescrizione, setNewDescrizione] = useState('');
  const [newLunghezza, setNewLunghezza] = useState('');
  const [newProfondita, setNewProfondita] = useState('');
  const [newAltezza, setNewAltezza] = useState('');
  const [newSchedaUrl, setNewSchedaUrl] = useState('');
  const [newFotoFile, setNewFotoFile] = useState(null);
  const [salvandoNuovo, setSalvandoNuovo] = useState(false);
  const [erroreNuovo, setErroreNuovo] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editPrezzo, setEditPrezzo] = useState('');
  const [caricandoFotoId, setCaricandoFotoId] = useState(null);

  const prodottiCategoria = prodotti.filter(p => p.categoria === activeCat && (activeFornitoreFiltro === 'Tutti' || p.fornitore === activeFornitoreFiltro));
  const sottocategorie = ['Tutte', ...new Set(prodottiCategoria.map(p => p.sottocategoria).filter(Boolean))];
  const filtered = prodottiCategoria.filter(p => activeSub === 'Tutte' || p.sottocategoria === activeSub);

  // ricerca: cerca in TUTTO il catalogo (ignora categoria/sottocategoria/fornitore),
  // così Denis trova subito il pezzo per nome senza dover prima entrare nella categoria giusta
  const ricercaAttiva = queryRicerca.trim().length > 0;
  const risultatiRicerca = ricercaAttiva
    ? (() => {
        const q = queryRicerca.trim().toLowerCase();
        return prodotti.filter(p =>
          (p.nome || '').toLowerCase().includes(q) ||
          (p.codice || '').toLowerCase().includes(q) ||
          (p.descrizione || '').toLowerCase().includes(q) ||
          (p.sottocategoria || '').toLowerCase().includes(q)
        );
      })()
    : [];

  // vista a cartelle: dentro una categoria mostriamo prima le sue sottocategorie
  // (come cartelle), non subito la lista intera di prodotti — solo quando la
  // categoria ha davvero più di una sottocategoria, altrimenti è inutile
  const mostraCartelle = !ricercaAttiva && activeSub === 'Tutte' && sottocategorie.length > 1;
  const conteggioSottocategorie = sottocategorie
    .filter(s => s !== 'Tutte')
    .map(sub => ({ nome: sub, count: prodottiCategoria.filter(p => p.sottocategoria === sub).length }));
  const prodottiDaMostrare = ricercaAttiva ? risultatiRicerca : filtered;
  // Bagno/Deghi resta il catalogo visivo a griglia con foto (per il cliente);
  // il resto (materiale tecnico) è una lista compatta, meno scroll, più "da negozio"
  const prodottiTecnici = prodottiDaMostrare.filter(p => p.categoria !== 'Bagno');
  const prodottiBagno = prodottiDaMostrare.filter(p => p.categoria === 'Bagno');

  const fornitoreForm = newFornitore || fornitoreDiCategoria(activeCat) || FORNITORI_CATALOGO[0];
  const sottocategorieStruttura = CATALOGO_STRUTTURA[fornitoreForm]?.[activeCat] || [];

  const addProdotto = async () => {
    if (!newNome.trim()) return;
    const lunghezza = parseFloat((newLunghezza || '').replace(',', '.'));
    const profondita = parseFloat((newProfondita || '').replace(',', '.'));
    const altezza = parseFloat((newAltezza || '').replace(',', '.'));
    if (!lunghezza || !profondita || !altezza) {
      setErroreNuovo('Inserisci tutte le misure: lunghezza, profondità e altezza.');
      return;
    }
    setSalvandoNuovo(true);
    setErroreNuovo('');
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    const payload = {
      nome: newNome.trim(), categoria: activeCat, sottocategoria: newSub.trim() || 'Generico',
      tier: newTier, prezzo, fornitore: fornitoreForm, codice: newCodice.trim(),
      descrizione: newDescrizione.trim(), misuraLunghezza: lunghezza, misuraProfondita: profondita,
      misuraAltezza: altezza, schedaTecnicaUrl: newSchedaUrl.trim(),
    };
    const { data, error } = await sb.from('prodotti').insert(prodottoToRow(payload)).select().single();
    if (error) {
      setSalvandoNuovo(false);
      setErroreNuovo('Errore nel salvare il prodotto: ' + error.message);
      return;
    }
    const nuovoProdotto = prodottoFromRow(data);
    setProdotti(prev => [nuovoProdotto, ...prev]);
    if (newFotoFile) await cambiaFotoProdotto(nuovoProdotto, newFotoFile);
    setSalvandoNuovo(false);
    setNewNome('');
    setNewFornitore('');
    setNewSub('');
    setNewTier('Standard');
    setNewPrezzo('');
    setNewCodice('');
    setNewDescrizione('');
    setNewLunghezza('');
    setNewProfondita('');
    setNewAltezza('');
    setNewSchedaUrl('');
    setNewFotoFile(null);
    setShowNewForm(false);
  };

  const deleteProdotto = async (id) => {
    const { error } = await sb.from('prodotti').delete().eq('id', id);
    if (error) {
      mostraToast('Errore nell’eliminare il prodotto: ' + error.message);
      return;
    }
    setProdotti(prodotti.filter(p => p.id !== id));
  };

  const startEditProdotto = (p) => {
    setEditingId(p.id);
    setEditNome(p.nome);
    setEditPrezzo(String(p.prezzo).replace('.', ','));
  };

  const aggiornaZonaProdotto = async (id, zona) => {
    const { error } = await sb.from('prodotti').update({ zona: zona || null }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare la zona: ' + error.message);
      return;
    }
    setProdotti(prodotti.map(p => p.id === id ? { ...p, zona } : p));
  };

  const confirmEditProdotto = async (id) => {
    const nome = editNome.trim();
    const prezzo = parseFloat(editPrezzo.replace(',', '.'));
    setEditingId(null);
    if (!nome || isNaN(prezzo) || prezzo <= 0) return;
    const { error } = await sb.from('prodotti').update({ nome, prezzo }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare le modifiche: ' + error.message);
      return;
    }
    setProdotti(prodotti.map(p => p.id === id ? { ...p, nome, prezzo } : p));
  };

  const cambiaFotoProdotto = async (p, file) => {
    if (!file) return;
    setCaricandoFotoId(p.id);
    try {
      const blob = await comprimiImmagine(file);
      const path = `${p.id}-${Date.now()}.jpg`;
      const { error: uploadError } = await sb.storage.from('prodotti-foto').upload(path, blob, { contentType: 'image/jpeg' });
      if (uploadError) throw uploadError;
      const { error: dbError } = await sb.from('prodotti').update({ foto_path: path }).eq('id', p.id);
      if (dbError) throw dbError;
      const vecchioPath = p.fotoPath;
      const fotoUrl = sb.storage.from('prodotti-foto').getPublicUrl(path).data.publicUrl;
      setProdotti(prev => prev.map(x => x.id === p.id ? { ...x, fotoPath: path, fotoUrl } : x));
      if (vecchioPath) sb.storage.from('prodotti-foto').remove([vecchioPath]).catch(() => {});
    } catch (err) {
      mostraToast('Errore nel caricare la foto: ' + err.message);
    }
    setCaricandoFotoId(null);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 flex-1 flex flex-col min-h-0">

      {/* ricerca diretta per nome/codice — cerca in tutto il catalogo, salta la navigazione */}
      <div className="flex items-center gap-2.5">
        <div className="relative flex-1">
          <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input
            type="text"
            value={queryRicerca}
            onChange={(e) => setQueryRicerca(e.target.value)}
            placeholder="Cerca un prodotto per nome o codice..."
            className="w-full pl-9 pr-9 py-2.5 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
          {ricercaAttiva && (
            <button
              type="button"
              onClick={() => setQueryRicerca('')}
              className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500"
            >
              <X className="w-4 h-4" />
            </button>
          )}
        </div>
        {!ricercaAttiva && (
          <button
            onClick={() => setShowNewForm(!showNewForm)}
            className="shrink-0 flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            <span className="hidden sm:inline">Nuovo prodotto</span>
          </button>
        )}
      </div>

      {!ricercaAttiva && (
        <>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex gap-1.5 bg-white border border-slate-200 rounded-xl p-1 overflow-x-auto">
              {[...new Set([...categorieCatalogo, ...prodotti.map(p => p.categoria).filter(Boolean)])].map((cat) => (
                <button
                  key={cat}
                  onClick={() => { setActiveCat(cat); setActiveSub('Tutte'); }}
                  className={`px-3.5 py-2.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${
                    activeCat === cat ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-900'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {/* filtro fornitore — es. "solo Deghi" quando mostri i bagni al cliente,
              "solo Tecnomat" quando fai un ordine */}
          <div className="flex flex-wrap gap-1.5">
            {['Tutti', ...FORNITORI_CATALOGO].map(f => (
              <button
                key={f}
                onClick={() => { setActiveFornitoreFiltro(f); setActiveSub('Tutte'); }}
                className={`px-3.5 py-2.5 rounded-full text-xs font-semibold transition-colors ${
                  activeFornitoreFiltro === f ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-100'
                }`}
              >
                {f}
              </button>
            ))}
          </div>

          {/* dentro una categoria: prima le sottocategorie come cartelle, si entra
              per vedere solo i prodotti di quella — non più tutta la lista insieme */}
          {activeSub !== 'Tutte' && (
            <button
              onClick={() => setActiveSub('Tutte')}
              className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 -mb-1"
            >
              <ArrowLeft className="w-3.5 h-3.5" />
              Tutte le sottocategorie di {activeCat}
            </button>
          )}

          {mostraCartelle && (
            <div className="app-card overflow-hidden divide-y divide-slate-50">
              {conteggioSottocategorie.map(({ nome, count }) => (
                <button
                  key={nome}
                  onClick={() => setActiveSub(nome)}
                  className="w-full flex items-center justify-between gap-3 px-4 py-3.5 text-left hover:bg-slate-50 active:bg-slate-100 transition-colors"
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center shrink-0">
                      <ShoppingBag className="w-4 h-4 text-blue-600" />
                    </div>
                    <p className="text-[13.5px] font-semibold text-slate-900 truncate">{nome}</p>
                  </div>
                  <div className="flex items-center gap-2.5 shrink-0">
                    <span className="text-[11px] text-slate-400 font-medium whitespace-nowrap">{count} prodott{count === 1 ? 'o' : 'i'}</span>
                    <ChevronRight className="w-4 h-4 text-slate-300" />
                  </div>
                </button>
              ))}
            </div>
          )}
        </>
      )}

      {showNewForm && (
        <div className="app-card p-4 space-y-3">
          <p className="text-xs font-semibold text-slate-500">Nuovo prodotto in "{activeCat}"</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome prodotto</label>
              <input
                type="text"
                value={newNome}
                onChange={(e) => setNewNome(e.target.value)}
                placeholder="Es. Caldaia Vaillant 28kW"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Fornitore</label>
              <select
                value={fornitoreForm}
                onChange={(e) => { setNewFornitore(e.target.value); setNewSub(''); }}
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              >
                {FORNITORI_CATALOGO.map(f => <option key={f} value={f}>{f}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Sottocategoria</label>
              {sottocategorieStruttura.length > 0 ? (
                <select
                  value={newSub}
                  onChange={(e) => setNewSub(e.target.value)}
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                >
                  <option value="">Scegli...</option>
                  {sottocategorieStruttura.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={newSub}
                  onChange={(e) => setNewSub(e.target.value)}
                  placeholder="Es. Filo muro"
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              )}
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Qualità</label>
              <select
                value={newTier}
                onChange={(e) => setNewTier(e.target.value)}
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              >
                <option>Standard</option>
                <option>Premium</option>
                <option>Lusso</option>
              </select>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Codice articolo</label>
              <input
                type="text"
                value={newCodice}
                onChange={(e) => setNewCodice(e.target.value)}
                placeholder="Es. 3100915"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
              <input
                type="text"
                inputMode="decimal"
                value={newPrezzo}
                onChange={(e) => setNewPrezzo(e.target.value)}
                placeholder="0,00"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Lunghezza cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newLunghezza}
                onChange={(e) => setNewLunghezza(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Profondità cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newProfondita}
                onChange={(e) => setNewProfondita(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Altezza cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newAltezza}
                onChange={(e) => setNewAltezza(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-medium text-slate-500 mb-1">Descrizione</label>
            <textarea
              value={newDescrizione}
              onChange={(e) => setNewDescrizione(e.target.value)}
              rows={2}
              placeholder="Dettagli utili per il cliente o per l'ordine"
              className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 resize-none"
            />
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Foto</label>
              <label className="flex items-center gap-2 w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-slate-500">
                <ImagePlus className="w-4 h-4 shrink-0" />
                <span className="truncate">{newFotoFile ? newFotoFile.name : 'Scatta o carica una foto'}</span>
                <input
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => setNewFotoFile(e.target.files[0] || null)}
                />
              </label>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Link scheda tecnica (opzionale)</label>
              <input
                type="text"
                value={newSchedaUrl}
                onChange={(e) => setNewSchedaUrl(e.target.value)}
                placeholder="https://..."
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div className="flex items-center gap-2 justify-end pt-1">
            {erroreNuovo && <p className="text-[11px] text-red-500 mr-auto">{erroreNuovo}</p>}
            <button onClick={() => setShowNewForm(false)} className="px-3 py-2 text-slate-400 hover:text-slate-600">
              <X className="w-4 h-4" />
            </button>
            <button onClick={addProdotto} disabled={salvandoNuovo} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60">
              {salvandoNuovo ? 'Salvo...' : 'Aggiungi'}
            </button>
          </div>
        </div>
      )}

      {ricercaAttiva && (
        <p className="text-xs font-semibold text-slate-500">
          {risultatiRicerca.length} risultat{risultatiRicerca.length === 1 ? 'o' : 'i'} per "{queryRicerca.trim()}"
        </p>
      )}

      {!mostraCartelle && (
        <>
          {/* lista compatta — materiale tecnico, una riga per prodotto: meno scroll,
              più "da negozio". Tocca il nome per modificare nome/prezzo/zona */}
          {prodottiTecnici.length > 0 && (
            <div className="app-card overflow-hidden divide-y divide-slate-50">
              {prodottiTecnici.map((p) => {
                const misure = (p.misuraLunghezza || p.misuraProfondita || p.misuraAltezza)
                  ? `${p.misuraLunghezza || '–'}×${p.misuraProfondita || '–'}×${p.misuraAltezza || '–'} cm`
                  : null;
                const sottotitolo = [
                  ricercaAttiva ? p.sottocategoria : null,
                  p.fornitore, p.codice, misure,
                ].filter(Boolean).join(' · ');
                return (
                  <div key={p.id} className="pl-3.5 pr-4 py-3.5 border-l-[3px] border-blue-400">
                    {editingId === p.id ? (
                      <div className="space-y-1.5">
                        <div className="flex items-center gap-2">
                          <label className="relative shrink-0 w-9 h-9 rounded-md bg-slate-50 border border-slate-200 flex items-center justify-center overflow-hidden cursor-pointer">
                            {p.fotoUrl ? <img src={p.fotoUrl} alt="" className="w-full h-full object-cover" /> : <ImagePlus className="w-4 h-4 text-slate-300" />}
                            {caricandoFotoId === p.id && (
                              <div className="absolute inset-0 bg-white/80 flex items-center justify-center text-[7px] font-semibold text-slate-500 text-center">...</div>
                            )}
                            <input
                              type="file"
                              accept="image/*"
                              className="hidden"
                              disabled={caricandoFotoId === p.id}
                              onChange={(e) => { if (e.target.files[0]) cambiaFotoProdotto(p, e.target.files[0]); e.target.value = ''; }}
                            />
                          </label>
                          <input
                            autoFocus
                            type="text"
                            value={editNome}
                            onChange={(e) => setEditNome(e.target.value)}
                            className="flex-1 px-2 py-1 text-[13px] font-semibold bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                          />
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="text-slate-400 text-xs">€</span>
                          <input
                            type="text"
                            inputMode="decimal"
                            value={editPrezzo}
                            onChange={(e) => setEditPrezzo(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && confirmEditProdotto(p.id)}
                            className="w-20 px-2 py-1 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"

// notifiche in-app al posto di alert() nativo — un popup del browser mostra
// la barra degli indirizzi/i bottoni del sistema e rompe subito l'illusione
// di app vera; questo resta dentro lo stile dell'app
function mostraToast(messaggio, tipo = 'errore') {
  window.dispatchEvent(new CustomEvent('ferari-toast', { detail: { messaggio, tipo } }));
}

function ToastHost() {
  const [toast, setToast] = useState(null);
  useEffect(() => {
    let timer;
    const onToast = (e) => {
      setToast(e.detail);
      clearTimeout(timer);
      timer = setTimeout(() => setToast(null), 4500);
    };
    window.addEventListener('ferari-toast', onToast);
    return () => { window.removeEventListener('ferari-toast', onToast); clearTimeout(timer); };
  }, []);
  if (!toast) return null;
  return (
    <div className="fixed inset-x-0 z-[100] px-4 flex justify-center bottom-[calc(5.5rem+env(safe-area-inset-bottom))] lg:bottom-6 pointer-events-none">
      <div className={`pointer-events-auto w-full max-w-sm rounded-xl shadow-xl px-4 py-3 text-sm font-medium text-white flex items-start gap-3 ${toast.tipo === 'errore' ? 'bg-red-600' : 'bg-slate-900'}`}>
        <span className="flex-1 leading-snug">{toast.messaggio}</span>
        <button onClick={() => setToast(null)} className="shrink-0 opacity-80 hover:opacity-100">
          <X className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

// esegue una query Supabase e, se fallisce (es. token non ancora rinnovato
// all'avvio dell'app), ritenta un paio di volte con una breve pausa prima di
// arrendersi — vedi commento sopra il caricamento della sessione in App()
async function fetchConRetry(queryFn, tentativi = 3, attesaMs = 700) {
  let risultato = await queryFn();
  for (let i = 1; i < tentativi && risultato.error; i++) {
    await new Promise(r => setTimeout(r, attesaMs * i));
    risultato = await queryFn();
  }
  return risultato;
}

function App() {
  // sessione Supabase: undefined = verifica in corso, null = non loggato,
  // oggetto = loggato. Supabase la ricorda da solo tra un riavvio e l'altro.
  const [session, setSession] = useState(undefined);
  // true quando l'utente arriva dal link "Password dimenticata?" nell'email:
  // mostra la schermata per scegliere la nuova password invece della dashboard
  const [modalitaRecupero, setModalitaRecupero] = useState(false);
  // ricorda l'ultima pagina visitata, così un refresh non riporta sempre alla dashboard
  const [currentPage, setCurrentPage] = useState(() => {
    const salvata = localStorage.getItem('ferari_currentPage');
    return salvata && pageConfig[salvata] ? salvata : 'dashboard';
  });
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const codaOffline = useCodaOffline();

  useEffect(() => {
    localStorage.setItem('ferari_currentPage', currentPage);
  }, [currentPage]);

  // ogni sezione aggiunge una voce alla cronologia (vedi goToPage più sotto):
  // così su Android il tasto/gesto "indietro" del telefono torna alla
  // sezione precedente invece di uscire subito dall'app
  useEffect(() => {
    const onPopState = (e) => {
      if (mobileNavOpen) { setMobileNavOpen(false); return; }
      const paginaPrecedente = e.state && e.state.ferariPage;
      if (paginaPrecedente && pageConfig[paginaPrecedente]) {
        setCurrentPage(paginaPrecedente);
        const main = document.querySelector('main.app-scroll');
        if (main) main.scrollTop = 0;
      }
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, [mobileNavOpen]);

  // aggiornamento automatico PWA — controlla se online c'è una versione più
  // recente di questa (confronta APP_VERSION), sia quando l'app torna in
  // primo piano sia ogni tot minuti mentre resta aperta. Se sì, avvisa invece
  // di lasciare Denis bloccato sulla copia vecchia in cache del telefono.
  const [versioneNuovaDisponibile, setVersioneNuovaDisponibile] = useState(false);
  useEffect(() => {
    const controllaVersione = async () => {
      try {
        const res = await fetch(window.location.pathname, { cache: 'no-store' });
        const testo = await res.text();
        const match = testo.match(/APP_VERSION\s*=\s*'([^']+)'/);
        if (match && match[1] !== APP_VERSION) setVersioneNuovaDisponibile(true);
      } catch (err) {
        // offline o rete instabile — non è un errore da segnalare, si riprova dopo
      }
    };
    controllaVersione();
    const onVisibilita = () => { if (document.visibilityState === 'visible') controllaVersione(); };
    document.addEventListener('visibilitychange', onVisibilita);
    const intervallo = setInterval(controllaVersione, 10 * 60 * 1000);
    return () => { document.removeEventListener('visibilitychange', onVisibilita); clearInterval(intervallo); };
  }, []);

  // stato centrale: tutta l'app legge e scrive da qui
  const [clienti, setClienti] = useState([]);
  const [clientiLoading, setClientiLoading] = useState(true);
  const [materiali, setMateriali] = useState([]);
  const [materialiLoading, setMaterialiLoading] = useState(true);
  const [prodotti, setProdotti] = useState([]);
  const [prodottiLoading, setProdottiLoading] = useState(true);
  const [vociLavoro, setVociLavoro] = useState([]);
  const [vociLavoroLoading, setVociLavoroLoading] = useState(true);
  const [impostazioni, setImpostazioni] = useState({ prezzo_km: '0.45' });
  const [preventivi, setPreventivi] = useState([]);
  const [preventiviLoading, setPreventiviLoading] = useState(true);
  const [presetClienteId, setPresetClienteId] = useState(null);
  const [presetDettaglioId, setPresetDettaglioId] = useState(null);

  // BUG INTERMITTENTE risolto: all'avvio (soprattutto a freddo, dopo che
  // l'app è rimasta chiusa un po') sb.auth.getSession() può restituire una
  // sessione il cui token è scaduto — il rinnovo automatico di Supabase parte
  // in background ma non è ancora finito. Le richieste dati partono comunque
  // (la sessione "c'è"), falliscono con 401, e restano vuote per sempre
  // perché session?.user?.id non cambia quando il token si rinnova (stesso
  // utente), quindi gli useEffect di caricamento non si riattivano da soli.
  // fetchConRetry ritenta la stessa richiesta un paio di volte con una breve
  // pausa, dando al rinnovo il tempo di completarsi prima di arrendersi.
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    // BUG CRITICO risolto: Supabase riprova a rinnovare la sessione da solo,
    // soprattutto quando l'app torna in primo piano (esattamente quando Denis
    // tocca lo schermo dopo essere stato "via" un attimo sul cantiere). Se sul
    // campo il segnale è debole, quel rinnovo può fallire e arrivare qui con
    // una sessione vuota anche se l'utente NON ha fatto logout — prima la
    // accettavamo alla cieca e buttavamo giù tutta la schermata (preventivo
    // in corso compreso, mai salvato). Ora un "vuoto" conta solo se è un vero
    // SIGNED_OUT esplicito; per qualunque altro evento, teniamo la sessione
    // che avevamo finché non ne arriva una valida.
    const { data: subscription } = sb.auth.onAuthStateChange((event, nuovaSessione) => {
      if (event === 'PASSWORD_RECOVERY') setModalitaRecupero(true);
      if (event === 'SIGNED_OUT') {
        setSession(null);
        return;
      }
      if (nuovaSessione) {
        setSession(nuovaSessione);
      }
      // else: rinnovo fallito/momentaneo senza un vero logout — non tocchiamo
      // la sessione attuale, così il lavoro in corso non va perso
    });
    return () => subscription.subscription.unsubscribe();
  }, []);

  // clienti: caricati da Supabase dopo il login, così restano salvati anche
  // dopo aver chiuso e riaperto l'app
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setClientiLoading(true);
    fetchConRetry(() => sb.from('clienti').select('*').order('creato_il', { ascending: false })).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i clienti da Supabase:', error);
        setClientiLoading(false);
        return;
      }
      setClienti(data.map(clienteFromRow));
      setClientiLoading(false);
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  // preventivi: stesso pattern dei clienti
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setPreventiviLoading(true);
    fetchConRetry(() => sb.from('preventivi').select('*').order('creato_il', { ascending: false })).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i preventivi da Supabase:', error);
        setPreventiviLoading(false);
        return;
      }
      setPreventivi(data.map(preventivoFromRow));
      setPreventiviLoading(false);
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  // materiali: stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setMaterialiLoading(true);
    fetchConRetry(() => sb.from('materiali').select('*').order('nome', { ascending: true })).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i materiali da Supabase:', error);
        setMaterialiLoading(false);
        return;
      }
      setMateriali(data.map(materialeFromRow));
      setMaterialiLoading(false);
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  // prodotti (catalogo): stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setProdottiLoading(true);
    fetchConRetry(() => sb.from('prodotti').select('*').order('nome', { ascending: true })).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare il catalogo da Supabase:', error);
        setProdottiLoading(false);
        return;
      }
      setProdotti(data.map(prodottoFromRow));
      setProdottiLoading(false);
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  // voci di lavoro riutilizzabili (R2 #7): stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setVociLavoroLoading(true);
    fetchConRetry(() => sb.from('voci_lavoro').select('*').order('nome', { ascending: true })).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare le voci di lavoro da Supabase:', error);
        setVociLavoroLoading(false);
        return;
      }
      setVociLavoro(data.map(voceLavoroFromRow));
      setVociLavoroLoading(false);
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  // impostazioni generali (R3 #1: prezzo al km) — chiave/valore, stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    fetchConRetry(() => sb.from('impostazioni').select('*')).then(({ data, error }) => {
      if (annullato || error || !data) return;
      const mappa = {};
      data.forEach(r => { mappa[r.chiave] = r.valore; });
      setImpostazioni(prev => ({ ...prev, ...mappa }));
    });
    return () => { annullato = true; };
  }, [session?.user?.id]);

  if (session === undefined) {
    return (
      <div className="min-h-[100svh] bg-[#10133a] flex items-center justify-center">
        <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-16 h-16 rounded-2xl opacity-80" />
      </div>
    );
  }

  if (modalitaRecupero) {
    return <ImpostaNuovaPasswordPage onCompletato={() => setModalitaRecupero(false)} />;
  }

  if (!session) {
    return <LoginPage />;
  }

  const { title, subtitle } = pageConfig[currentPage];

  const handleNuovoPreventivo = (clienteId) => {
    setPresetClienteId(clienteId);
    setCurrentPage('preventivi');
  };

  const handleApriPreventivo = (preventivoId) => {
    setPresetDettaglioId(preventivoId);
    setCurrentPage('preventivi');
  };

  const goToPage = (page) => {
    // ogni sezione aggiunge una voce alla cronologia: così su Android il
    // tasto/gesto "indietro" del telefono torna alla sezione precedente
    // invece di uscire subito dall'app (comportamento atteso da chi usa
    // Android tutti i giorni, diverso da come si comporta un sito normale)
    if (page !== currentPage) {
      window.history.pushState({ ferariPage: page }, '', '');
    }
    setCurrentPage(page);
    setMobileNavOpen(false);
    const main = document.querySelector('main.app-scroll');
    if (main) main.scrollTop = 0;
  };

  return (
    <div className="h-app-viewport flex bg-[#eef1f5] lg:bg-slate-50 overflow-hidden min-h-0 max-h-full">
      <ToastHost />
      <Sidebar
        currentPage={currentPage}
        setCurrentPage={goToPage}
        onLogout={() => sb.auth.signOut()}
        mobileOpen={mobileNavOpen}
        onMobileClose={() => setMobileNavOpen(false)}
      />

      <div className="flex-1 flex flex-col min-w-0 min-h-0 max-h-full overflow-hidden">
        <TopBar title={title} subtitle={subtitle} onMenuClick={() => setMobileNavOpen(true)} />

        {versioneNuovaDisponibile && (
          <div className="px-4 py-2 text-xs font-semibold flex items-center justify-between gap-2 shrink-0 bg-emerald-50 text-emerald-700">
            <span>È disponibile una versione più recente dell'app.</span>
            <button
              onClick={() => window.location.reload()}
              className="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-md"
            >
              Aggiorna ora
            </button>
          </div>
        )}

        {(!codaOffline.online || codaOffline.count > 0) && (
          <div className={`px-4 py-2 text-xs font-semibold flex items-center justify-between gap-2 shrink-0 ${!codaOffline.online ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}`}>
            <span>
              {!codaOffline.online
                ? 'Sei offline — le modifiche restano sul telefono e si caricano da sole alla riconnessione.'
                : `${codaOffline.count} element${codaOffline.count === 1 ? 'o' : 'i'} in attesa di sincronizzazione.`}
            </span>
            {codaOffline.online && codaOffline.count > 0 && (
              <button
                onClick={codaOffline.sincronizzaOra}
                disabled={codaOffline.sincronizzando}
                className="shrink-0 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-md disabled:opacity-60"
              >
                {codaOffline.sincronizzando ? 'Sincronizzo...' : 'Sincronizza ora'}
              </button>
            )}
          </div>
        )}

        <main className="flex-1 min-h-0 overflow-y-auto app-scroll pb-4 lg:pb-0">
          <div key={currentPage} className="app-page">
        {currentPage === 'dashboard' && (
          <DashboardPage preventivi={preventivi} clienti={clienti} onVediTutti={() => setCurrentPage('preventivi')} />
        )}
        {currentPage === 'preventivi' && (
          <PreventiviPage
            clienti={clienti}
            setClienti={setClienti}
            clientiLoading={clientiLoading}
            preventivi={preventivi}
            setPreventivi={setPreventivi}
            preventiviLoading={preventiviLoading}
            materiali={materiali}
            setMateriali={setMateriali}
            prodotti={prodotti}
            vociLavoro={vociLavoro}
            setVociLavoro={setVociLavoro}
            prezzoKm={impostazioni.prezzo_km}
            presetClienteId={presetClienteId}
            onConsumePreset={() => setPresetClienteId(null)}
            presetDettaglioId={presetDettaglioId}
            onConsumePresetDettaglio={() => setPresetDettaglioId(null)}
          />
        )}
        {currentPage === 'clienti' && (
          <ClientiPage
            clienti={clienti}
            setClienti={setClienti}
            clientiLoading={clientiLoading}
            preventivi={preventivi}
            onNuovoPreventivo={handleNuovoPreventivo}
            onApriPreventivo={handleApriPreventivo}
          />
        )}
        {currentPage === 'materiali' && <MaterialiPage materiali={materiali} setMateriali={setMateriali} materialiLoading={materialiLoading} />}
        {currentPage === 'catalogo' && <CatalogoPage prodotti={prodotti} setProdotti={setProdotti} prodottiLoading={prodottiLoading} />}
        {currentPage === 'impostazioni' && <ImpostazioniPage impostazioni={impostazioni} setImpostazioni={setImpostazioni} />}
        {currentPage === 'squadra' && <SquadraPage preventivi={preventivi} clienti={clienti} />}
          </div>
        </main>

        <MobileBottomNav currentPage={currentPage} setCurrentPage={goToPage} />
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
