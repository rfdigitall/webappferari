function ClientiPage({ clienti, setClienti, clientiLoading, preventivi, onNuovoPreventivo, onApriPreventivo }) {
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newIndirizzo, setNewIndirizzo] = useState('');
  const [newTelefono, setNewTelefono] = useState('');
  const [newEmail, setNewEmail] = useState(''); // R4 #7: mancavano al nuovo cliente
  const [newCodiceFiscale, setNewCodiceFiscale] = useState('');
  const [newIndirizzoResidenza, setNewIndirizzoResidenza] = useState(''); // R4 #8
  const [newGps, setNewGps] = useState(null); // { gpsLat, gpsLng, gpsMapsUrl }
  const [noteInput, setNoteInput] = useState('');
  const [salvandoCliente, setSalvandoCliente] = useState(false);
  const [erroreCliente, setErroreCliente] = useState('');
  const [fotoCliente, setFotoCliente] = useState([]);
  const [editandoInfo, setEditandoInfo] = useState(false);
  const [editIndirizzo, setEditIndirizzo] = useState('');
  const [editIndirizzoResidenza, setEditIndirizzoResidenza] = useState(''); // R4 #8
  const [editTelefono, setEditTelefono] = useState('');
  const [editEmail, setEditEmail] = useState('');
  const [editCodiceFiscale, setEditCodiceFiscale] = useState('');
  const [salvandoInfo, setSalvandoInfo] = useState(false);
  const [erroreInfo, setErroreInfo] = useState('');
  const [documenti, setDocumenti] = useState([]);
  const [caricandoDocumento, setCaricandoDocumento] = useState(false);
  const [erroreDocumento, setErroreDocumento] = useState('');
  const [sostituendoFotoId, setSostituendoFotoId] = useState(null);
  const [newExtraOpen, setNewExtraOpen] = useState(false);

  const selected = clienti.find(c => c.id === selectedId);

  // tutte le foto cantiere di questo cliente, da qualsiasi preventivo
  React.useEffect(() => {
    if (!selectedId) { setFotoCliente([]); return; }
    let annullato = false;
    sb.from('foto').select('*').eq('cliente_id', selectedId).order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setFotoCliente(data.map(fotoFromRow));
    });
    return () => { annullato = true; };
  }, [selectedId]);

  // P16: documenti e certificati allegati al cliente
  React.useEffect(() => {
    if (!selectedId) { setDocumenti([]); return; }
    let annullato = false;
    sb.from('documenti').select('*').eq('cliente_id', selectedId).order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setDocumenti(data.map(documentoFromRow));
    });
    return () => { annullato = true; };
  }, [selectedId]);

  const caricaDocumento = async (file) => {
    if (!file || !selected) return;
    setCaricandoDocumento(true);
    setErroreDocumento('');
    try {
      if (!navigator.onLine) throw new Error('offline');
      const path = `${selected.id}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await sb.storage.from('documenti-cliente').upload(path, file);
      if (uploadError) throw uploadError;
      const { data, error } = await sb.from('documenti')
        .insert(documentoToRow({ clienteId: selected.id, nome: file.name, storagePath: path }))
        .select().single();
      if (error) throw error;
      setDocumenti(prev => [documentoFromRow(data), ...prev]);
    } catch (err) {
      // niente rete: il file resta in coda e si carica da solo dopo,
      // così non si perde il lavoro fatto sul cantiere
      try {
        await accodaOffline('documento', { blob: file, nome: file.name, clienteId: selected.id });
        setDocumenti(prev => [{ id: 'offline-' + Date.now(), nome: file.name, url: null, pending: true }, ...prev]);
      } catch (e2) {
        setErroreDocumento('Errore nel caricare il documento: ' + err.message);
      }
    }
    setCaricandoDocumento(false);
  };

  const eliminaDocumento = async (doc) => {
    setDocumenti(prev => prev.filter(d => d.id !== doc.id));
    if (doc.pending) return;
    if (doc.storagePath) sb.storage.from('documenti-cliente').remove([doc.storagePath]).catch(() => {});
    sb.from('documenti').delete().eq('id', doc.id).then(({ error }) => {
      if (error) console.error('Errore nel rimuovere il documento:', error);
    });
  };

  // R2 #3: dalla scheda cliente si può sostituire o eliminare una foto già
  // caricata, non solo aggiungerne di nuove
  const sostituisciFotoCliente = async (f, file) => {
    if (!file) return;
    setSostituendoFotoId(f.id);
    try {
      const blob = await comprimiImmagine(file, 1280, 0.6);
      const path = `${f.clienteId}/${Date.now()}-${f.tipo}.jpg`;
      const { error: uploadError } = await sb.storage.from('cantiere-foto').upload(path, blob, { contentType: 'image/jpeg' });
      if (uploadError) throw uploadError;
      const { error: dbError } = await sb.from('foto').update({ storage_path: path }).eq('id', f.id);
      if (dbError) throw dbError;
      const vecchioPath = f.storagePath;
      const nuovoUrl = sb.storage.from('cantiere-foto').getPublicUrl(path).data.publicUrl;
      setFotoCliente(prev => prev.map(x => x.id === f.id ? { ...x, storagePath: path, url: nuovoUrl } : x));
      if (vecchioPath) sb.storage.from('cantiere-foto').remove([vecchioPath]).catch(() => {});
    } catch (err) {
      mostraToast('Errore nel sostituire la foto: ' + err.message);
    }
    setSostituendoFotoId(null);
  };

  const eliminaFotoCliente = async (f) => {
    setFotoCliente(prev => prev.filter(x => x.id !== f.id));
    if (f.storagePath) sb.storage.from('cantiere-foto').remove([f.storagePath]).catch(() => {});
    const { error } = await sb.from('foto').delete().eq('id', f.id);
    if (error) mostraToast('Errore nel rimuovere la foto: ' + error.message);
  };

  // R3: elimina cliente — bloccato se ha preventivi collegati, per non
  // orfanizzare dati reali per sbaglio (va prima eliminato ogni preventivo)
  const eliminaCliente = async (cliente) => {
    const preventiviCliente = preventivi.filter(p => p.clienteId === cliente.id);
    if (preventiviCliente.length > 0) {
      mostraToast(`Elimina prima i ${preventiviCliente.length} preventivi di questo cliente.`);
      return;
    }
    if (!window.confirm(`Eliminare definitivamente il cliente "${cliente.nome}"? L'azione non si può annullare.`)) return;
    const fotoDaRimuovere = fotoCliente.map(f => f.storagePath).filter(Boolean);
    if (fotoDaRimuovere.length) sb.storage.from('cantiere-foto').remove(fotoDaRimuovere).catch(() => {});
    const documentiDaRimuovere = documenti.map(d => d.storagePath).filter(Boolean);
    if (documentiDaRimuovere.length) sb.storage.from('documenti-cliente').remove(documentiDaRimuovere).catch(() => {});
    const { error } = await sb.from('clienti').delete().eq('id', cliente.id);
    if (error) { mostraToast('Errore nell’eliminare il cliente: ' + error.message); return; }
    setClienti(prev => prev.filter(c => c.id !== cliente.id));
    setSelectedId(null);
  };

  const filtered = clienti
    .filter(c => c.nome.toLowerCase().includes(search.toLowerCase()) || c.indirizzo.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.nome.localeCompare(b.nome));

  const addCliente = async () => {
    if (!newNome.trim()) return;
    setSalvandoCliente(true);
    setErroreCliente('');
    const payload = {
      nome: newNome.trim(),
      indirizzo: newIndirizzo.trim() || 'Indirizzo da definire',
      indirizzoResidenza: newIndirizzoResidenza.trim(),
      telefono: newTelefono.trim(),
      email: newEmail.trim(),
      codiceFiscale: newCodiceFiscale.trim(),
      ...(newGps || {}),
    };
    const { data, error } = await sb.from('clienti').insert(clienteToRow(payload)).select().single();
    setSalvandoCliente(false);
    if (error) {
      setErroreCliente('Errore nel salvare il cliente: ' + error.message);
      return;
    }
    const nuovo = clienteFromRow(data);
    setClienti([nuovo, ...clienti]);
    setNewNome('');
    setNewIndirizzo('');
    setNewIndirizzoResidenza('');
    setNewTelefono('');
    setNewEmail('');
    setNewCodiceFiscale('');
    setNewGps(null);
    setShowNewForm(false);
    // + Nuovo cliente → subito preventivo (niente "scegli per chi")
    onNuovoPreventivo(nuovo.id);
  };

  const aggiornaGpsCliente = async (gps) => {
    if (!selected) return;
    const { error } = await sb.from('clienti').update(clienteToRow(gps)).eq('id', selected.id);
    if (error) {
      mostraToast('Errore nel salvare la posizione: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, ...gps } : c));
  };

  const startEditInfo = (c) => {
    setEditIndirizzo(c.indirizzo || '');
    setEditIndirizzoResidenza(c.indirizzoResidenza || '');
    setEditTelefono(c.telefono || '');
    setEditEmail(c.email || '');
    setEditCodiceFiscale(c.codiceFiscale || '');
    setErroreInfo('');
    setEditandoInfo(true);
  };

  const salvaInfoCliente = async () => {
    if (!selected) return;
    setSalvandoInfo(true);
    setErroreInfo('');
    const payload = {
      indirizzo: editIndirizzo.trim() || 'Indirizzo da definire',
      indirizzoResidenza: editIndirizzoResidenza.trim(),
      telefono: editTelefono.trim(),
      email: editEmail.trim(),
      codiceFiscale: editCodiceFiscale.trim(),
    };
    const { error } = await sb.from('clienti').update(clienteToRow(payload)).eq('id', selected.id);
    setSalvandoInfo(false);
    if (error) {
      setErroreInfo('Errore nel salvare: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, ...payload } : c));
    setEditandoInfo(false);
  };

  const addNota = async () => {
    if (!noteInput.trim() || !selected) return;
    const d = new Date();
    const data = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
    const nuoveNote = [...selected.note, { text: noteInput.trim(), data }];
    const { error } = await sb.from('clienti').update({ note: nuoveNote }).eq('id', selected.id);
    if (error) {
      mostraToast('Errore nel salvare la nota: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, note: nuoveNote } : c));
    setNoteInput('');
  };

  const storicoCliente = preventivi.filter(p => p.clienteId === selectedId);

  /* ---- vista dettaglio cliente (solo da icona "i" — il tap normale apre il preventivo) ---- */
  if (selected) {
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <button
          onClick={() => setSelectedId(null)}
          className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900"
        >
          <ArrowLeft className="w-3.5 h-3.5" />
          Torna ai clienti
        </button>

        <div className="app-card p-6">
          <div className="flex items-start justify-between flex-wrap gap-4">
            <div className="flex items-start gap-3 min-w-0 w-full sm:w-auto">
              <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-bold text-base sm:text-lg shrink-0">
                {inizialiNome(selected.nome)}
              </div>
              <div className="min-w-0 flex-1">
                <h2 className="text-lg font-semibold text-slate-900 tracking-tight truncate">{selected.nome}</h2>
                <p className="text-xs sm:text-sm text-slate-500 mt-1 flex items-start gap-1.5">
                  <span className="text-slate-400 shrink-0">Cantiere</span>
                  <span className="min-w-0 break-words">{selected.indirizzo}</span>
                </p>
                {selected.indirizzoResidenza && (
                  <p className="text-xs sm:text-sm text-slate-500 mt-1 flex items-start gap-1.5">
                    <span className="text-slate-400 shrink-0">Residenza</span>
                    <span className="min-w-0 break-words">{selected.indirizzoResidenza}</span>
                  </p>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => eliminaCliente(selected)}
                className="flex items-center justify-center w-9 h-9 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors shrink-0"
                aria-label="Elimina cliente"
              >
                <Trash2 className="w-4 h-4" />
              </button>
              <button
                onClick={() => startEditInfo(selected)}
                className="flex items-center gap-1.5 border border-slate-200 text-slate-500 hover:bg-slate-50 text-sm font-semibold px-3.5 py-2.5 rounded-lg transition-colors"
              >
                <Pencil className="w-3.5 h-3.5" />
                Modifica
              </button>
              <button
                onClick={() => onNuovoPreventivo(selected.id)}
                className="flex items-center gap-1.5 bg-neutral-950 hover:bg-neutral-800 text-white text-sm font-semibold px-4 py-2.5 rounded-2xl transition-colors active:scale-[0.98]"
              >
                <Plus className="w-4 h-4" />
                Nuovo Preventivo
              </button>
            </div>
          </div>

          {editandoInfo ? (
            <div className="mt-5 pt-5 border-t border-slate-100 space-y-3">
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Indirizzo cantiere</label>
                <IndirizzoAutocomplete
                  value={editIndirizzo}
                  onChange={setEditIndirizzo}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Indirizzo residenza (opzionale, se diverso dal cantiere)</label>
                <IndirizzoAutocomplete
                  value={editIndirizzoResidenza}
                  onChange={setEditIndirizzoResidenza}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Telefono</label>
                <input
                  type="tel"
                  value={editTelefono}
                  onChange={(e) => setEditTelefono(e.target.value)}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Email</label>
                <input
                  type="email"
                  value={editEmail}
                  onChange={(e) => setEditEmail(e.target.value)}
                  placeholder="nome@esempio.it"
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Codice fiscale</label>
                <input
                  type="text"
                  value={editCodiceFiscale}
                  onChange={(e) => setEditCodiceFiscale(e.target.value.toUpperCase())}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 font-mono"
                />
              </div>
              {erroreInfo && <p className="text-[11px] text-red-500">{erroreInfo}</p>}
              <div className="flex gap-2">
                <button
                  onClick={salvaInfoCliente}
                  disabled={salvandoInfo}
                  className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors disabled:opacity-60"
                >
                  {salvandoInfo ? 'Salvo...' : 'Salva'}
                </button>
                <button
                  onClick={() => setEditandoInfo(false)}
                  className="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-700"
                >
                  Annulla
                </button>
              </div>
            </div>
          ) : (selected.email || selected.codiceFiscale) && (
            <div className="mt-5 pt-5 border-t border-slate-100 grid grid-cols-2 gap-3">
              {selected.email && (
                <div>
                  <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Email</p>
                  <p className="text-sm text-slate-700 mt-0.5 truncate">{selected.email}</p>
                </div>
              )}
              {selected.codiceFiscale && (
                <div>
                  <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Codice fiscale</p>
                  <p className="text-sm text-slate-700 mt-0.5 font-mono">{selected.codiceFiscale}</p>
                </div>
              )}
            </div>
          )}

          {selected.telefono && (
            <div className="flex gap-2.5 mt-5">
              <a href={`tel:${selected.telefono.replace(/\s/g, '')}`} className="flex items-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <Phone className="w-3.5 h-3.5" />
                Chiama
              </a>
              <a href={`https://wa.me/${selected.telefono.replace(/[^\d+]/g, '').replace('+', '')}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <MessageCircle className="w-3.5 h-3.5" />
                WhatsApp
              </a>
            </div>
          )}

          <div className="mt-5 pt-5 border-t border-slate-100">
            <GpsCapture gpsMapsUrl={selected.gpsMapsUrl} onCapture={aggiornaGpsCliente} />
          </div>
        </div>

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-bold text-slate-900">Preventivi</h3>
            <p className="text-xs text-slate-400 mt-0.5">{storicoCliente.length} {storicoCliente.length === 1 ? 'documento' : 'documenti'}</p>
          </div>
          {storicoCliente.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">Nessun preventivo ancora per questo cliente.</p>
          ) : (
            <div className="divide-y divide-slate-50">
              {storicoCliente.map(p => (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => onApriPreventivo(p.id)}
                  className="w-full px-5 py-3.5 flex items-center justify-between hover:bg-slate-50/60 transition-colors text-left"
                >
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 shrink-0">
                      <FileText className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-900">{p.id}</p>
                      <p className="text-xs text-slate-400 font-mono">{p.data}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>{p.stato}</span>
                    <span className="text-sm font-semibold text-slate-900 w-20 text-right">{fmtEuro(p.importo)}</span>
                    <ChevronRight className="w-4 h-4 text-slate-300 shrink-0" />
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {fotoCliente.length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <h3 className="text-sm font-semibold text-slate-900">Foto cantiere</h3>
              <p className="text-xs text-slate-400 mt-0.5">{fotoCliente.length} {fotoCliente.length === 1 ? 'foto' : 'foto'}, da tutti i preventivi</p>
            </div>
            <div className="p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
              {fotoCliente.map(f => (
                <div key={f.id} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200 group">
                  <img src={f.url} alt="" className="w-full h-full object-cover" />
                  <span className={`absolute bottom-0 left-0 right-0 text-[9px] font-bold text-center py-0.5 text-white ${f.tipo === 'prima' ? 'bg-amber-500/90' : 'bg-emerald-500/90'}`}>
                    {f.tipo === 'prima' ? 'PRIMA' : 'DOPO'}
                  </span>
                  {sostituendoFotoId === f.id && (
                    <div className="absolute inset-0 bg-white/80 flex items-center justify-center text-[9px] font-semibold text-slate-500 text-center px-1">
                      Carico...
                    </div>
                  )}
                  <div className="absolute inset-0 bg-black/0 lg:group-hover:bg-black/40 transition-colors flex items-center justify-center gap-1.5 opacity-100 lg:opacity-0 lg:group-hover:opacity-100">
                    <label className="w-6 h-6 rounded-full bg-white/90 text-slate-500 hover:text-blue-600 flex items-center justify-center cursor-pointer">
                      <ImagePlus className="w-3 h-3" />
                      <input
                        type="file"
                        accept="image/*"
                        className="hidden"
                        disabled={sostituendoFotoId === f.id}
                        onChange={(e) => { if (e.target.files[0]) sostituisciFotoCliente(f, e.target.files[0]); e.target.value = ''; }}
                      />
                    </label>
                    <button
                      type="button"
                      onClick={() => eliminaFotoCliente(f)}
                      className="w-6 h-6 rounded-full bg-white/90 text-slate-500 hover:text-red-500 flex items-center justify-center"
                    >
                      <Trash2 className="w-3 h-3" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
              <h3 className="text-sm font-semibold text-slate-900">Documenti e certificati</h3>
              <p className="text-xs text-slate-400 mt-0.5">{documenti.length} {documenti.length === 1 ? 'file' : 'file'}</p>
            </div>
            <label className={`flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-lg cursor-pointer transition-colors ${caricandoDocumento ? 'bg-slate-100 text-slate-400' : 'bg-slate-900 hover:bg-slate-800 text-white'}`}>
              {caricandoDocumento ? 'Carico...' : '+ Allega file'}
              <input
                type="file"
                className="hidden"
                disabled={caricandoDocumento}
                onChange={(e) => { if (e.target.files[0]) caricaDocumento(e.target.files[0]); e.target.value = ''; }}
              />
            </label>
          </div>
          {erroreDocumento && <p className="px-5 pt-3 text-[11px] text-red-500">{erroreDocumento}</p>}
          {documenti.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">Nessun documento allegato.</p>
          ) : (
            <div className="divide-y divide-slate-50">
              {documenti.map(doc => (
                <div key={doc.id} className="px-5 py-3 flex items-center justify-between gap-3">
                  {doc.pending ? (
                    <span className="text-sm text-slate-400 truncate flex items-center gap-1.5">
                      {doc.nome}
                      <span className="text-[10px] font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded-full shrink-0">in attesa</span>
                    </span>
                  ) : (
                    <a href={doc.url} target="_blank" rel="noopener noreferrer" className="text-sm text-blue-600 hover:text-blue-800 truncate">
                      {doc.nome}
                    </a>
                  )}
                  <button onClick={() => eliminaDocumento(doc)} className="text-slate-300 hover:text-red-500 shrink-0">
                    <Trash2 className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-semibold text-slate-900">Note e comunicazioni</h3>
          </div>
          <div className="px-5 py-4 space-y-2">
            {selected.note.length === 0 && (
              <p className="text-xs text-slate-400 text-center py-3">Nessuna nota ancora.</p>
            )}
            {[...selected.note].reverse().map((n, i) => (
              <div key={i} className="bg-slate-50 border border-slate-100 rounded-lg px-3.5 py-2.5">
                <p className="text-sm text-slate-700">{n.text}</p>
                <p className="text-[11px] text-slate-400 mt-1 font-mono">{n.data}</p>
              </div>
            ))}
          </div>
          <div className="px-5 pb-4 flex gap-2">
            <input
              type="text"
              value={noteInput}
              onChange={(e) => setNoteInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addNota()}
              placeholder="Aggiungi una nota su questo cliente..."
              className="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
            <button onClick={addNota} className="w-10 h-10 rounded-lg bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center shrink-0">
              <Plus className="w-4 h-4" />
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---- lista clienti: anagrafica completa (preventivi si fanno da Preventivi) ---- */
  return (
    <div className="pvw min-h-full">
      <div className="sticky top-0 z-20 border-b border-[var(--ferari-line)] bg-white/80 backdrop-blur-md">
        <div className="max-w-xl mx-auto px-4 sm:px-5 pt-4 pb-3">
          <div className="flex items-end justify-between gap-3">
            <div>
              <h1 className="text-[32px] font-bold tracking-[-0.03em] text-[var(--ferari-ink)] leading-none">Clienti</h1>
              <p className="text-[13px] text-[var(--ferari-muted)] mt-1.5 font-medium">{filtered.length} in anagrafica</p>
            </div>
            <button
              type="button"
              onClick={() => { setShowNewForm(true); setNewExtraOpen(false); }}
              className="app-ripple shrink-0 inline-flex items-center gap-1.5 h-10 px-3.5 rounded-full bg-[var(--ferari-ink)] text-white text-[13px] font-semibold active:scale-[0.97] transition-transform"
            >
              <Plus className="w-4 h-4" />
              Nuovo
            </button>
          </div>
          <div className="mt-3.5 flex items-center gap-2.5 h-12 px-4 rounded-[18px] bg-white border border-[var(--ferari-line)]">
            <Search className="w-4 h-4 text-[var(--ferari-muted)] shrink-0" />
            <input
              type="search"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Cerca nome, città o telefono"
              autoComplete="off"
              className="flex-1 bg-transparent border-0 outline-none text-[15px] font-medium text-[var(--ferari-ink)] placeholder:text-[var(--ferari-muted)]"
            />
            {search ? (
              <button type="button" onClick={() => setSearch('')} className="p-1 rounded-full hover:bg-[var(--ferari-soft)] transition-colors" aria-label="Pulisci">
                <X className="w-3.5 h-3.5 text-[var(--ferari-muted)]" />
              </button>
            ) : null}
          </div>
        </div>
      </div>

      <div className="max-w-xl mx-auto px-3 sm:px-4 pt-3 pb-28">
        <div className="pvw-card overflow-hidden">
          {filtered.map((c, idx) => (
            <div
              key={c.id}
              className={`flex items-center gap-1 ${idx > 0 ? 'border-t border-[#ECEEF5]' : ''}`}
            >
              <button
                type="button"
                onClick={() => setSelectedId(c.id)}
                className="app-ripple group flex-1 min-w-0 flex items-center gap-3 px-3.5 py-3.5 text-left hover:bg-[var(--ferari-soft)] active:bg-[#EEF0FB] transition-colors"
              >
                <div className="w-10 h-10 rounded-full bg-[var(--ferari-ink)] text-white text-[12px] font-semibold flex items-center justify-center shrink-0 tracking-tight">
                  {inizialiNome(c.nome)}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[15px] font-semibold text-[var(--ferari-ink)] tracking-tight truncate">{c.nome}</p>
                  <p className="text-[12px] text-[var(--ferari-muted)] truncate mt-0.5 font-medium">{c.indirizzo || 'Indirizzo da definire'}</p>
                </div>
                <ChevronRight className="w-4 h-4 text-[#D8DAE8] shrink-0" />
              </button>
            </div>
          ))}
          {filtered.length === 0 && (
            <div className="px-6 py-16 text-center">
              <p className="text-[15px] font-semibold text-neutral-950">
                {clientiLoading ? 'Caricamento…' : (search ? 'Nessun risultato' : 'Nessun cliente')}
              </p>
              {!clientiLoading && !search && (
                <button
                  type="button"
                  onClick={() => setShowNewForm(true)}
                  className="mt-4 text-[13px] font-semibold text-neutral-950 underline underline-offset-4 decoration-neutral-300"
                >
                  Aggiungi il primo
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Drawer nuovo cliente — solo essenziale */}
      {showNewForm && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
          <button
            type="button"
            className="absolute inset-0 bg-neutral-950/40 backdrop-blur-sm"
            aria-label="Chiudi"
            onClick={() => setShowNewForm(false)}
          />
          <div className="ui-sheet-enter relative w-full sm:max-w-md mx-0 sm:mx-4 mb-0 sm:mb-0 rounded-t-3xl sm:rounded-3xl border border-white/20 bg-white/95 backdrop-blur-md shadow-2xl shadow-neutral-950/20 p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
            <div className="w-10 h-1 rounded-full bg-neutral-200 mx-auto mb-4 sm:hidden" />
            <div className="flex items-start justify-between gap-3 mb-4">
              <div>
                <h2 className="text-lg font-semibold tracking-tight text-neutral-950">Nuovo cliente</h2>
                <p className="text-[13px] text-neutral-500 mt-0.5 font-medium">Poi apriamo il preventivo subito</p>
              </div>
              <button
                type="button"
                onClick={() => setShowNewForm(false)}
                className="w-8 h-8 rounded-full bg-neutral-100 text-neutral-500 hover:bg-neutral-200 flex items-center justify-center transition-colors"
              >
                <X className="w-4 h-4" />
              </button>
            </div>
            <label className="block">
              <span className="text-[11px] font-semibold uppercase tracking-wider text-neutral-400">Nome</span>
              <input
                type="text"
                value={newNome}
                onChange={(e) => setNewNome(e.target.value)}
                placeholder="Nome e cognome"
                autoFocus
                className="mt-1.5 w-full h-12 px-4 rounded-2xl bg-neutral-950/[0.04] border border-slate-200/80 text-[15px] font-medium text-neutral-950 outline-none focus:bg-white focus:border-neutral-400 focus:ring-4 focus:ring-neutral-950/5 transition-all"
              />
            </label>
            {!newExtraOpen ? (
              <button
                type="button"
                onClick={() => setNewExtraOpen(true)}
                className="mt-3 text-[13px] font-semibold text-neutral-500 hover:text-neutral-950 transition-colors"
              >
                + Indirizzo e telefono
              </button>
            ) : (
              <div className="mt-3 space-y-3">
                <label className="block">
                  <span className="text-[11px] font-semibold uppercase tracking-wider text-neutral-400">Indirizzo</span>
                  <IndirizzoAutocomplete
                    value={newIndirizzo}
                    onChange={setNewIndirizzo}
                    placeholder="Cantiere"
                    className="mt-1.5 w-full h-12 px-4 rounded-2xl bg-neutral-950/[0.04] border border-slate-200/80 text-[15px] font-medium text-neutral-950 outline-none focus:bg-white focus:border-neutral-400 focus:ring-4 focus:ring-neutral-950/5 transition-all"
                  />
                </label>
                <label className="block">
                  <span className="text-[11px] font-semibold uppercase tracking-wider text-neutral-400">Telefono</span>
                  <input
                    type="tel"
                    value={newTelefono}
                    onChange={(e) => setNewTelefono(e.target.value)}
                    placeholder="Opzionale"
                    className="mt-1.5 w-full h-12 px-4 rounded-2xl bg-neutral-950/[0.04] border border-slate-200/80 text-[15px] font-medium text-neutral-950 outline-none focus:bg-white focus:border-neutral-400 focus:ring-4 focus:ring-neutral-950/5 transition-all"
                  />
                </label>
              </div>
            )}
            {erroreCliente && <p className="text-[12px] text-red-500 mt-3 font-medium">{erroreCliente}</p>}
            <button
              type="button"
              onClick={addCliente}
              disabled={salvandoCliente || !newNome.trim()}
              className="app-ripple mt-5 w-full h-12 rounded-2xl bg-neutral-950 text-white text-[15px] font-semibold shadow-lg shadow-neutral-950/15 disabled:opacity-40 active:scale-[0.985] transition-transform"
            >
              {salvandoCliente ? 'Salvo…' : 'Genera preventivo'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* Bottone per rilevare la posizione GPS del cliente — utile per indirizzi
   in zone rurali dove il testo dell'indirizzo non basta a trovare il posto */
// R2 #8: autocomplete indirizzo — usa Nominatim/OpenStreetMap (gratuito, senza
// chiave API). Alternativa a Google Places, che ha un costo oltre la soglia
// gratuita e richiede una chiave Google Cloud: da confermare con RF prima di
// eventualmente passare a quello.
function IndirizzoAutocomplete({ value, onChange, placeholder, className }) {
  const [suggerimenti, setSuggerimenti] = useState([]);
  const [mostraSuggerimenti, setMostraSuggerimenti] = useState(false);
  const [cercando, setCercando] = useState(false);
  const debounceRef = useRef(null);

  const cerca = (testo) => {
    onChange(testo);
    clearTimeout(debounceRef.current);
    if (testo.trim().length < 4) {
      setSuggerimenti([]);
      return;
    }
    debounceRef.current = setTimeout(async () => {
      setCercando(true);
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=it&q=${encodeURIComponent(testo)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
        const data = await res.json();
        setSuggerimenti(Array.isArray(data) ? data : []);
        setMostraSuggerimenti(true);
      } catch (err) {
        setSuggerimenti([]);
      }
      setCercando(false);
    }, 500);
  };

  // indirizzo corto (via + numero + città) invece del display_name intero di
  // Nominatim, che incatena anche unione dei comuni/provincia/regione — pieno
  // di dettagli che sul preventivo reale nessuno scrive e che mandavano in
  // overflow la colonna CANTIERE nel PDF
  const indirizzoCorto = (s) => {
    const a = s.address || {};
    const via = a.road || a.pedestrian || a.residential || '';
    const citta = a.city || a.town || a.village || a.hamlet || a.county || '';
    if (!via) return s.display_name;
    const strada = a.house_number ? `${via} ${a.house_number}` : via;
    return citta ? `${strada}, ${citta}` : strada;
  };

  return (
    <div className="relative">
      <input
        type="text"
        value={value}
        onChange={(e) => cerca(e.target.value)}
        onFocus={() => suggerimenti.length > 0 && setMostraSuggerimenti(true)}
        onBlur={() => setTimeout(() => setMostraSuggerimenti(false), 150)}
        placeholder={placeholder}
        className={className}
      />
      {cercando && (
        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400">...</span>
      )}
      {mostraSuggerimenti && suggerimenti.length > 0 && (
        <div className="absolute z-20 top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-52 overflow-y-auto">
          {suggerimenti.map((s) => (
            <button
              key={s.place_id}
              type="button"
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => { onChange(indirizzoCorto(s)); setSuggerimenti([]); setMostraSuggerimenti(false); }}
              className="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 border-b border-slate-50 last:border-0"
            >
              {s.display_name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function GpsCapture({ gpsMapsUrl, onCapture }) {
  const [loading, setLoading] = useState(false);
  const [errore, setErrore] = useState('');

  const prendiPosizione = () => {
    if (!navigator.geolocation) {
      setErrore('Geolocalizzazione non supportata su questo dispositivo.');
      return;
    }
    setLoading(true);
    setErrore('');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        onCapture({ gpsLat: lat, gpsLng: lng, gpsMapsUrl: `https://www.google.com/maps?q=${lat},${lng}` });
        setLoading(false);
      },
      () => {
        setErrore('Impossibile rilevare la posizione. Controlla i permessi GPS del browser.');
        setLoading(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  return (
    <div>
      <label className="block text-xs font-medium text-slate-500 mb-1">Posizione GPS (opzionale)</label>
      <div className="flex items-center gap-2 flex-wrap">
        <button
          type="button"
          onClick={prendiPosizione}
          disabled={loading}
          className="flex items-center gap-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors disabled:opacity-60"
        >
          <MapPin className="w-3.5 h-3.5" />
          {loading ? 'Rilevo posizione...' : gpsMapsUrl ? 'Aggiorna posizione' : 'Prendi posizione'}
        </button>
        {gpsMapsUrl && (
          <a href={gpsMapsUrl} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-blue-600 hover:text-blue-700">
            Apri in Maps
          </a>
        )}
      </div>
      {errore && <p className="text-[11px] text-red-500 mt-1.5">{errore}</p>}
    </div>
  );
}

/* ============================================================
   GOOGLE CALENDAR — pulsante isolato e opzionale (Fase 7). Se il
   Client ID non è configurato, questo componente non renderizza
   nulla: nessun impatto sul resto dell'app.
   ============================================================ */
function GoogleCalendarButton({ titolo, luogo, descrizione }) {
  const oraDefault = () => {
    const d = new Date();
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    return d;
  };
  const [aperto, setAperto] = useState(false);
  const [data, setData] = useState(() => oraDefault().toISOString().slice(0, 10));
  const [ora, setOra] = useState(() => oraDefault().toISOString().slice(11, 16));
  const [salvando, setSalvando] = useState(false);
  const [esito, setEsito] = useState(null); // { tipo: 'ok'|'err', testo }

  if (!googleCalendarDisponibile()) return null;

  const conferma = async () => {
    setSalvando(true);
    setEsito(null);
    try {
      await creaEventoGoogleCalendar({
        titolo, luogo, descrizione,
        dataOraInizio: `${data}T${ora}:00`,
      });
      setEsito({ tipo: 'ok', testo: 'Aggiunto al tuo Google Calendar.' });
      setAperto(false);
    } catch (err) {
      setEsito({ tipo: 'err', testo: 'Non riuscito, riprova.' });
    }
    setSalvando(false);
  };

  return (
    <div>
      {!aperto ? (
        <button
          onClick={() => { setAperto(true); setEsito(null); }}
          className="w-full border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
        >
          <CalendarIcon className="w-4 h-4" />
          Aggiungi a Google Calendar
        </button>
      ) : (
        <div className="app-card p-4 space-y-3">
          <p className="text-sm font-semibold text-slate-900">Quando?</p>
          <div className="flex gap-2">
            <input
              type="date"
              value={data}
              onChange={(e) => setData(e.target.value)}
              className="flex-1 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30"
            />
            <input
              type="time"
              value={ora}
              onChange={(e) => setOra(e.target.value)}
              className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30"
            />
          </div>
          <div className="flex gap-2">
            <button
              onClick={conferma}
              disabled={salvando}
              className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors disabled:opacity-60"
            >
              {salvando ? 'Aggiungo...' : 'Conferma'}
            </button>
            <button onClick={() => setAperto(false)} className="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-700">
              Annulla
            </button>
          </div>
        </div>
      )}
      {esito && (
        <p className={`text-[11px] mt-1.5 ${esito.tipo === 'ok' ? 'text-emerald-600' : 'text-red-500'}`}>{esito.testo}</p>
      )}
    </div>
  );
}

  const [indirizzoResidenza, setIndirizzoResidenza] = useState('');
  const [telefono, setTelefono] = useState('');
  const [email, setEmail] = useState(''); // R4 #7: mancavano anche qui
  const [codiceFiscale, setCodiceFiscale] = useState('');

  const [salvando, setSalvando] = useState(false);
  const [errore, setErrore] = useState('');

  const salva = async () => {
    if (!nome.trim()) return;
    setSalvando(true);
    setErrore('');

      nome: nome.trim(),
      indirizzo: indirizzo.trim() || 'Indirizzo da definire',
      indirizzoResidenza: indirizzoResidenza.trim(),
      telefono: telefono.trim(),
      email: email.trim(),
      codiceFiscale: codiceFiscale.trim(),
      ...(gps || {}),

    setSalvando(false);
    if (error) {
      setErrore('Errore nel salvare il cliente: ' + error.message);
      return;

    onSalva(clienteFromRow(data));
    setNome(''); setIndirizzo(''); setIndirizzoResidenza(''); setTelefono(''); setEmail(''); setCodiceFiscale(''); setGps(null);
    setAperto(false);

  if (!aperto) {

      <button
        onClick={() => setAperto(true)}
        className="w-full flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 hover:border-orange-400 hover:bg-orange-50/50 text-slate-500 hover:text-orange-600 text-sm font-semibold py-4 rounded-xl transition-colors"

      <div className="space-y-3">

          <input
            type="text"
            value={nome}
            onChange={e => setNome(e.target.value)}

        </button>

    </div>
  );
}

/* ============================================================ */
/* R3 #6: lista voci trascinabile — riordina il documento cliente */
/* con drag & drop (mouse e touch, via Pointer Events)            */
/* ============================================================ */
// R4 #2: il drag col dito era inaffidabile su telefono reale (segnalato da
// Denis) — sostituito con due frecce su/giù per riga, molto più affidabili
// al tocco. Lo scambio avviene sull'array reale del carrello, non solo su
// questo elenco derivato, così l'ordine resta coerente ovunque.
// R4 #14: "filtro" opzionale sposta la voce dentro il suo sottoinsieme
// (es. solo tra i materiali, o solo tra le voci di lavoro) invece che
// nell'intero carrello — serve per riordinare dentro le due sezioni
// separate del documento senza mescolarle tra loro.
// "comando" è -1/1 per un passo solo, oppure 'inizio'/'fine' per saltare
// subito in cima o in fondo (tenendo premuta la freccia) — evita di dover
// cliccare tante volte per spostare una voce da un capo all'altro.
function spostaVoce(carrello, id, comando, filtro) {
  const ambito = filtro ? carrello.filter(filtro) : carrello;
  const indice = ambito.findIndex(i => i.id === id);
  if (indice === -1) return carrello;
  const nuovoIndice = comando === 'inizio' ? 0 : comando === 'fine' ? ambito.length - 1 : indice + comando;
  if (nuovoIndice < 0 || nuovoIndice >= ambito.length || nuovoIndice === indice) return carrello;

  const nuovoAmbito = [...ambito];
  const [voce] = nuovoAmbito.splice(indice, 1);
  nuovoAmbito.splice(nuovoIndice, 0, voce);

  // ricostruisce il carrello pieno: le voci fuori dall'ambito restano ferme
  // dove sono, quelle nell'ambito si riempiono nel nuovo ordine
  let cursore = 0;
  return carrello.map(item => {
    const dentro = filtro ? filtro(item) : true;
    return dentro ? nuovoAmbito[cursore++] : item;
  });
}

// bottone freccia con doppio comportamento: un tocco breve sposta di un
// passo, tenerlo premuto (~450ms) salta subito all'inizio o alla fine —
// così spostare una voce lontana non richiede tanti tocchi ripetuti
function BottoneRiordino({ onPasso, onSalto, disabled, label, className, children }) {
  const timerRef = useRef(null);
  const saltatoRef = useRef(false);
  const avviaPressione = (e) => {
    e.preventDefault();
    saltatoRef.current = false;
    timerRef.current = setTimeout(() => {
      saltatoRef.current = true;
      onSalto();
    }, 450);
  };
  const fineTocco = () => {
    clearTimeout(timerRef.current);
    if (!saltatoRef.current) onPasso();
  };
  const annullaPressione = () => clearTimeout(timerRef.current);
  return (
    <button
      type="button"
      disabled={disabled}
      onPointerDown={avviaPressione}
      onPointerUp={fineTocco}
      onPointerLeave={annullaPressione}
      onPointerCancel={annullaPressione}
      className={className}
      aria-label={label}
    >
      {children}
    </button>
  );
}

// R4 (variante "I" scelta da RF): il riordino ora avviene in una schermata
// dedicata (SchermataRiordino), aperta con un bottone "Riordina" — qui
// restano solo i testi modificabili, niente frecce che affollano ogni riga
function ListaVociOrdinabile({ carrello, diciture, onTestoChange, filtro }) {
  const righe = elencoOrdinato(carrello, diciture).filter(filtro ? ({ item }) => filtro(item) : () => true);

  return (
    <ul className="space-y-2">
      {righe.map(({ item, testo }) => (
        <li key={item.id}>
          <textarea
            value={testo}
            onChange={(e) => onTestoChange(item.id, e.target.value)}
            rows={2}
            className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 text-[11.5px] text-slate-700 outline-none focus:ring-2 focus:ring-blue-500/30 resize-none"
          />
        </li>
      ))}
    </ul>
  );
}

// versione sola-lettura della lista qui sopra, per l'anteprima di un
// preventivo già salvato (schermata "dettaglio"): niente textarea editabili,
// perché lì non si sta modificando nulla, solo controllando prima di inviare
function ListaVociSoloLettura({ carrello, diciture, filtro }) {
  const righe = elencoOrdinato(carrello, diciture).filter(filtro ? ({ item }) => filtro(item) : () => true);
  return (
    <ul className="space-y-2">
      {righe.map(({ item, testo }) => (
        <li key={item.id} className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 text-[11.5px] text-slate-700 whitespace-pre-wrap">
          {testo}
        </li>
      ))}
    </ul>
  );
}

// schermata a schermo intero dedicata solo al riordino — via libera dai
// campi di testo e dagli altri controlli, così tenere premuto o toccare le
// frecce non rischia di confondersi con nient'altro sullo schermo
function SchermataRiordino({ titolo, carrello, filtro, onReorder, onChiudi }) {
  const righe = filtro ? carrello.filter(filtro) : carrello;
  return (
    <div className="fixed inset-0 z-[60] bg-white flex flex-col">
      <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between shrink-0" style={{ paddingTop: 'max(1rem, env(safe-area-inset-top))' }}>
        <p className="text-sm font-semibold text-slate-900">Riordina — {titolo}</p>
        <button type="button" onClick={onChiudi} className="text-slate-400 hover:text-slate-600">
          <X className="w-5 h-5" />
        </button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-2">
        {righe.map((item, index) => (
          <div key={item.id} className="flex items-center gap-3 bg-slate-50 rounded-xl px-3 py-3">
            <span className="text-sm text-slate-800 flex-1 min-w-0 truncate">{item.nome}</span>
            <div className="flex items-center gap-1 shrink-0">
              <BottoneRiordino
                onPasso={() => onReorder(spostaVoce(carrello, item.id, -1, filtro))}
                onSalto={() => onReorder(spostaVoce(carrello, item.id, 'inizio', filtro))}
                disabled={index === 0}
                label="Sposta su (tieni premuto per andare in cima)"
                className="app-ripple w-10 h-10 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-20"
              >
                <ChevronUp className="w-5 h-5" />
              </BottoneRiordino>
              <BottoneRiordino
                onPasso={() => onReorder(spostaVoce(carrello, item.id, 1, filtro))}
                onSalto={() => onReorder(spostaVoce(carrello, item.id, 'fine', filtro))}
                disabled={index === righe.length - 1}
                label="Sposta giù (tieni premuto per andare in fondo)"
                className="app-ripple w-10 h-10 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-20"
              >
                <ChevronDown className="w-5 h-5" />
              </BottoneRiordino>
            </div>
          </div>
        ))}
        {righe.length === 0 && <p className="text-sm text-slate-400 text-center py-10">Nessuna voce da riordinare.</p>}
      </div>
      <div className="px-4 shrink-0" style={{ paddingBottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
        <p className="text-[11px] text-slate-400 text-center pb-3">Tieni premuto ↑ o ↓ per andare subito in cima o in fondo.</p>
      </div>
    </div>
  );
}

/* ============================================================ */
/* R4 #1 (+ round successivo): bozze persistenti per preventivo   */
/* in corso — se Denis esce dalla schermata (cambia sezione,      */
/* chiude l'app, l'app viene uccisa in background su Android) il  */
/* lavoro non deve sparire. UNA bozza per ogni cliente (non più   */
/* un solo slot): se lo chiama un altro cliente mentre ne sta     */
/* facendo uno, può iniziare quello nuovo senza perdere il primo. */
/* ============================================================ */
const BOZZE_PREVENTIVI_KEY = 'ferari_bozze_preventivi';
const BOZZA_PREVENTIVO_KEY_VECCHIA = 'ferari_bozza_preventivo'; // formato precedente, un solo slot

// legge tutte le bozze salvate; se trova ancora
// il vecchio formato a slot singolo lo migra automaticamente (una volta
// sola) così non si perde il lavoro di chi lo aveva già salvato prima
function leggiTutteLeBozze() {
  let mappa = {};
  try {
    const raw = localStorage.getItem(BOZZE_PREVENTIVI_KEY);
    if (raw) mappa = JSON.parse(raw) || {};
  } catch (err) { mappa = {}; }
  try {
    const vecchia = localStorage.getItem(BOZZA_PREVENTIVO_KEY_VECCHIA);
    if (vecchia) {
      const bozza = JSON.parse(vecchia);
      if (bozza && bozza.clienteId && !mappa[bozza.clienteId]) mappa[bozza.clienteId] = bozza;
      localStorage.removeItem(BOZZA_PREVENTIVO_KEY_VECCHIA);
      localStorage.setItem(BOZZE_PREVENTIVI_KEY, JSON.stringify(mappa));
    }
  } catch (err) { /* niente */ }
  // niente scadenza: una bozza resta finché non viene salvata come
  // preventivo vero o scartata a mano — Denis non vuole perdere lavoro
  // solo perché è passata una settimana
  return mappa;
}

function leggiBozzaCliente(clienteId) {
  if (!clienteId) return null;
  return leggiTutteLeBozze()[clienteId] || null;
}

function salvaBozzaCliente(clienteId, bozza) {
  if (!clienteId) return;
  try {
    const mappa = leggiTutteLeBozze();
    mappa[clienteId] = { ...bozza, salvataIl: Date.now() };
    localStorage.setItem(BOZZE_PREVENTIVI_KEY, JSON.stringify(mappa));
  } catch (err) { /* storage pieno o non disponibile: pazienza, non blocchiamo l'app */ }
}

function cancellaBozzaCliente(clienteId) {
  if (!clienteId) return;
  try {
    const mappa = leggiTutteLeBozze();
    delete mappa[clienteId];
    localStorage.setItem(BOZZE_PREVENTIVI_KEY, JSON.stringify(mappa));
  } catch (err) { /* niente */ }
}

  // Due modalità: Ultra (default demo — moderna/rapida) + Completa (tutto il resto).

  const [fotoDettaglio, setFotoDettaglio] = useState([]);
  const [diciture, setDiciture] = useState({}); // { [itemId]: { categoria, testo } } — Fase 4
  // BUG DI SICUREZZA (segnalato da Denis su PV-0154 Dario Franchini): la

  const [showPreviewDett, setShowPreviewDett] = useState(false);
  const [previewViewDett, setPreviewViewDett] = useState('cliente'); // 'cliente' | 'interno'
  // R7: scelta esplicita "Scarica" / "Invia direttamente" per il PDF cliente
  // (prima decideva da sola l'app in base al dispositivo, e non andava bene)
  const [pdfClienteDati, setPdfClienteDati] = useState(null);
  const scegliPdfCliente = async (modalita) => {
    const dati = pdfClienteDati;
    setPdfClienteDati(null);

  };

  const setTestoVoce = (itemId, testo) => setDiciture(prev => ({ ...prev, [itemId]: { ...prev[itemId], testo } }));

  // R4 #1: rimette in piedi il costruttore esattamente com'era rimasto
  const ripristinaBozza = (bozza) => {
    setModificaId(bozza.modificaId || null);
    setModificaDbId(bozza.modificaDbId || null);
    setClienteId(bozza.clienteId || null);
    setCarrello(bozza.carrello || []);
    setKmTrasferta(bozza.kmTrasferta || '');

    setRincaroTariffa(bozza.rincaroTariffa || '35');
    setZonaAttiva(bozza.zonaAttiva || 'generico');
    setDiciture(bozza.diciture || {});
    setFotoCantiere(bozza.fotoCantiere || []);
    setClienteSearch('');
    setModoRapido(true);
    setRapidoExtra(null);
    setWizardStep((bozza.carrello || []).length > 0 ? 2 : 2);
    setMode('nuovo');
    mostraToast('Bozza ripristinata: hai continuato da dove avevi lasciato.', 'info');
  };

  // carica le foto del preventivo aperto in dettaglio
  React.useEffect(() => {
    if (mode !== 'dettaglio' || !dettaglioId) { setFotoDettaglio([]); return; }
    const p = preventivi.find(pv => pv.id === dettaglioId);
    if (!p || !p.dbId) { setFotoDettaglio([]); return; }
    let annullato = false;
    sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setFotoDettaglio(data.map(fotoFromRow));
    });
    return () => { annullato = true; };
  }, [mode, dettaglioId]);

  // apre direttamente il flusso "nuovo" se arriviamo da una scheda cliente —
  // se c'è già una bozza non salvata per QUESTO cliente, la ripristiniamo
  // invece di ripartire da zero (R4 #1)
  React.useEffect(() => {
    if (presetClienteId) {
      const bozza = leggiBozzaCliente(presetClienteId);
      if (bozza) {
        ripristinaBozza(bozza);
      } else {
        setClienteId(presetClienteId);

        setModoRapido(true);
        setRapidoExtra(null);
        setWizardStep(2);
        setMode('nuovo');
      }
      onConsumePreset();
    }
  }, [presetClienteId]);

  // R4 #1: salva la bozza in corso ad ogni modifica (non solo al logout),
  // così se Denis esce dalla schermata — cambia sezione, chiude l'app,
  // Android la uccide in background — il preventivo non si perde più
  React.useEffect(() => {
    if (mode !== 'nuovo' || !clienteId) return;
    salvaBozzaCliente(clienteId, {
      modificaId, modificaDbId, clienteId, carrello, kmTrasferta,
      rincaroMode, rincaroPercent, rincaroOre, rincaroTariffa,
      zonaAttiva, diciture, fotoCantiere,
    });
  }, [mode, clienteId, carrello, kmTrasferta, rincaroMode, rincaroPercent, rincaroOre, rincaroTariffa, zonaAttiva, diciture, fotoCantiere, modificaId, modificaDbId]);

  // R4 #1 (rete di sicurezza): se non c'è una bozza da ripristinare ma questo
  // cliente ha già foto "orfane" (scattate in un tentativo precedente andato
  // perso prima di questo fix), le ritroviamo invece di farle rifare a Denis
  // — evita i duplicati segnalati
  React.useEffect(() => {
    if (mode !== 'nuovo' || !clienteId || modificaId) return;
    if (carrello.length > 0 || fotoCantiere.length > 0) return;
    let annullato = false;
    sb.from('foto').select('*').eq('cliente_id', clienteId).is('preventivo_id', null)
      .order('creato_il', { ascending: true }).then(({ data, error }) => {
        if (annullato || error || !data || data.length === 0) return;
        setFotoCantiere(data.map(fotoFromRow));
        mostraToast(`Ritrovate ${data.length} foto già scattate per questo cliente.`, 'info');
      });
    return () => { annullato = true; };
  }, [mode, clienteId, modificaId]);

  // apre direttamente il dettaglio se arriviamo dallo storico di un cliente
  React.useEffect(() => {
    if (presetDettaglioId) {
      setDettaglioId(presetDettaglioId);
      setMode('dettaglio');
      onConsumePresetDettaglio();
    }
  }, [presetDettaglioId]);

  const cliente = clienti.find(c => c.id === clienteId);

  // Nasconde la bottom nav durante il costruttore (come un'app nativa a schermo intero)
  // e lascia spazio al footer Totale/Anteprima quando c'è un cliente selezionato.
  React.useEffect(() => {
    if (!onLayoutChange) return;
    onLayoutChange({
      hideNav: mode === 'nuovo',
      hideTopbar: true,
      padComposer: mode === 'nuovo' && !!clienteId,
