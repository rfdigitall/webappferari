  const [statoEditDettaglio, setStatoEditDettaglio] = useState(false);
  const [caricandoFoto, setCaricandoFoto] = useState(false);
  const [clienteSearch, setClienteSearch] = useState('');

  // helper per aggiornare clienti dal form inline
  const setClientiEsterni = setClienti;
  const [carrello, setCarrello] = useState([]); // { id, nome, meta, prezzoUnitario, qty, kind }
  const [showNuovoMateriale, setShowNuovoMateriale] = useState(false);
  const [nmNome, setNmNome] = useState('');
  const [nmUnita, setNmUnita] = useState('m');
  const [nmPrezzo, setNmPrezzo] = useState('');
  const [nmZona, setNmZona] = useState('');
  const [nmSalvando, setNmSalvando] = useState(false);
  const [nmErrore, setNmErrore] = useState('');
  const [showNuovoLavoro, setShowNuovoLavoro] = useState(false);
  const [lavoroDescrizione, setLavoroDescrizione] = useState('');
  const [lavoroPrezzo, setLavoroPrezzo] = useState('');
  const [lavoroCategoria, setLavoroCategoria] = useState(CATEGORIE_DOCUMENTO_DEFAULT[0]);
  const [queryLavoro, setQueryLavoro] = useState('');
  const [editingLavoroId, setEditingLavoroId] = useState(null);
  const [editLavoroDescrizione, setEditLavoroDescrizione] = useState('');
  const [editLavoroPrezzo, setEditLavoroPrezzo] = useState('');
  const [rincaroMode, setRincaroMode] = useState('percent');
  const [rincaroPercent, setRincaroPercent] = useState('10');
  const [rincaroOre, setRincaroOre] = useState('8');
  const [rincaroTariffa, setRincaroTariffa] = useState('35');
  const [kmTrasferta, setKmTrasferta] = useState('');
  const [activeCat, setActiveCat] = useState(categorieCatalogo[0]);
  const [activeSubCatalogo, setActiveSubCatalogo] = useState('Tutte');
  const [queryCatalogoPreventivo, setQueryCatalogoPreventivo] = useState('');
  const [savedFlashId, setSavedFlashId] = useState(null);
  const [showPreview, setShowPreview] = useState(false);
  const [previewView, setPreviewView] = useState('cliente'); // 'cliente' | 'interno'
  const [showSuccess, setShowSuccess] = useState(false);
  const [zonaAttiva, setZonaAttiva] = useState('generico');
  const [fotoCantiere, setFotoCantiere] = useState([]); // { id, url, tipo: 'prima'|'dopo', zona }
  const [salvandoPreventivo, setSalvandoPreventivo] = useState(false);
  const [errorePreventivo, setErrorePreventivo] = useState('');
  const [fotoDettaglio, setFotoDettaglio] = useState([]);
  const [diciture, setDiciture] = useState({}); // { [itemId]: { categoria, testo } } — Fase 4

  const setTestoVoce = (itemId, testo) => setDiciture(prev => ({ ...prev, [itemId]: { ...prev[itemId], testo } }));

  // carica le foto del preventivo aperto in dettaglio
  React.useEffect(() => {
    if (mode !== 'dettaglio' || !dettaglioId) { setFotoDettaglio([]); return; }
    const p = preventivi.find(pv => pv.id === dettaglioId);
    if (!p || !p.dbId) { setFotoDettaglio([]); return; }
    let annullato = false;
    sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setFotoDettaglio(data.map(fotoFromRow));
    });
    return () => { annullato = true; };
  }, [mode, dettaglioId]);

  // apre direttamente il flusso "nuovo" se arriviamo da una scheda cliente
  React.useEffect(() => {
    if (presetClienteId) {
      setClienteId(presetClienteId);
      setCarrello([]);
      setMode('nuovo');
      onConsumePreset();
    }
  }, [presetClienteId]);

  // apre direttamente il dettaglio se arriviamo dallo storico di un cliente
  React.useEffect(() => {
    if (presetDettaglioId) {
      setDettaglioId(presetDettaglioId);
      setMode('dettaglio');
      onConsumePresetDettaglio();
    }
  }, [presetDettaglioId]);

  const cliente = clienti.find(c => c.id === clienteId);

  const subtotaleMateriali = carrello.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleProdotti = carrello.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleLavoro = carrello.filter(i => i.kind === 'lavoro').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleTrasferta = carrello.filter(i => i.kind === 'trasferta').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const rincaroValore = rincaroMode === 'percent'
    ? subtotaleMateriali * ((parseFloat(rincaroPercent) || 0) / 100)
    : (parseFloat(rincaroOre) || 0) * (parseFloat(rincaroTariffa) || 0);
  const totale = subtotaleMateriali + subtotaleProdotti + subtotaleLavoro + subtotaleTrasferta + rincaroValore;

  // R3 #1: la riga "Trasferta" nel carrello si aggiorna da sola in base ai km
  // e al prezzo al km impostato — un solo item fisso (id 'trasferta'), non se
  // ne accumulano di duplicati cambiando i km
  React.useEffect(() => {
    const km = parseFloat((kmTrasferta || '0').replace(',', '.')) || 0;
    const prezzo = parseFloat((prezzoKm || '0').replace(',', '.')) || 0;
    const costo = Math.round(km * prezzo * 100) / 100;
    setCarrello(prev => {
      const esiste = prev.find(i => i.id === 'trasferta');
      if (km <= 0) {
        return esiste ? prev.filter(i => i.id !== 'trasferta') : prev;
      }
      const voce = {
        id: 'trasferta', kind: 'trasferta', qty: 1, zona: 'generico',
        nome: 'Trasferta',
        meta: `${kmTrasferta} km × ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €/km`,
        prezzoUnitario: costo,
        categoriaDocumento: 'TRASFERTA E ALTRI COSTI',
        km, prezzoKmUsato: prezzo,
      };
      if (esiste && esiste.prezzoUnitario === costo && esiste.meta === voce.meta) return prev;
      return esiste ? prev.map(i => i.id === 'trasferta' ? voce : i) : [...prev, voce];
    });
  }, [kmTrasferta, prezzoKm]);

  // catalogo prodotti nel costruttore preventivo — stessa navigazione a
  // cartelle + ricerca del Catalogo vero e proprio, ma con "+ Aggiungi" invece
  // di modifica inline, e filtrato per la zona attiva
  const prodottiZonaCategoria = prodotti.filter(p => p.categoria === activeCat && visibileInZona(p, zonaAttiva));
  const sottocategorieCatalogoPreventivo = ['Tutte', ...new Set(prodottiZonaCategoria.map(p => p.sottocategoria).filter(Boolean))];
  const ricercaCatalogoAttiva = queryCatalogoPreventivo.trim().length > 0;
  const risultatiRicercaCatalogoPreventivo = ricercaCatalogoAttiva
    ? (() => {
        const q = queryCatalogoPreventivo.trim().toLowerCase();
        return prodotti.filter(p => visibileInZona(p, zonaAttiva) && (
          (p.nome || '').toLowerCase().includes(q) ||
          (p.codice || '').toLowerCase().includes(q) ||
          (p.descrizione || '').toLowerCase().includes(q) ||
          (p.sottocategoria || '').toLowerCase().includes(q)
        ));
      })()
    : [];
  const mostraCartelleCatalogoPreventivo = !ricercaCatalogoAttiva && activeSubCatalogo === 'Tutte' && sottocategorieCatalogoPreventivo.length > 1;
  const conteggioSottocategorieCatalogoPreventivo = sottocategorieCatalogoPreventivo
    .filter(s => s !== 'Tutte')
    .map(sub => ({ nome: sub, count: prodottiZonaCategoria.filter(p => p.sottocategoria === sub).length }));
  const prodottiCatalogoPreventivo = ricercaCatalogoAttiva
    ? risultatiRicercaCatalogoPreventivo
    : prodottiZonaCategoria.filter(p => activeSubCatalogo === 'Tutte' || p.sottocategoria === activeSubCatalogo);
  const prodottiCatalogoTecnici = prodottiCatalogoPreventivo.filter(p => p.categoria !== 'Bagno');
  const prodottiCatalogoBagno = prodottiCatalogoPreventivo.filter(p => p.categoria === 'Bagno');

  const startNuovo = () => {
    setModificaId(null);
    setModificaDbId(null);
    setClienteId(null);
    setCarrello([]);
    setRincaroMode('percent');
    setRincaroPercent('10');
    setRincaroOre('8');
    setRincaroTariffa('35');
    setKmTrasferta('');
    setZonaAttiva('generico');
    setFotoCantiere([]);
    setClienteSearch('');
    setDiciture({});
    setMode('nuovo');
  };

  // apre un preventivo esistente nello stesso costruttore usato per crearne
  // uno nuovo, così si possono cambiare voci/materiali/zone, e ricarica le
  // foto già salvate per questo preventivo
  const iniziaModifica = async (p) => {
    setModificaId(p.id);
    setModificaDbId(p.dbId);
    setClienteId(p.clienteId);
    setCarrello(p.carrelloSnapshot || []);
    // ripristina i km della trasferta salvata, altrimenti l'effetto che la
    // tiene sincronizzata la cancellerebbe subito (km vuoto = nessuna trasferta)
    const trasfertaSalvata = (p.carrelloSnapshot || []).find(i => i.kind === 'trasferta');
    setKmTrasferta(trasfertaSalvata ? String(trasfertaSalvata.km).replace('.', ',') : '');
    setZonaAttiva((p.zone && p.zone[0]) || 'generico');
    setFotoCantiere([]);
    setDiciture(p.diciture || {});
    setMode('nuovo');
    if (p.dbId) {
      const { data, error } = await sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true });
      if (!error && data) setFotoCantiere(data.map(fotoFromRow));
    }
  };

  const aggiornaPrezzoMateriale = async (matId, valoreStr) => {
    const valore = parseFloat(valoreStr.replace(',', '.'));
    if (!isNaN(valore) && valore > 0) {
      const { error } = await sb.from('materiali')
        .update({ prezzo: valore, ultimo_aggiornamento: new Date().toISOString() })
        .eq('id', matId);
      if (error) {
        mostraToast('Errore nel salvare il prezzo: ' + error.message);
        return;
      }
    }
    setMateriali(materiali.map(m => m.id === matId ? { ...m, prezzo: isNaN(valore) ? m.prezzo : valore } : m));
    if (!isNaN(valore) && valore > 0) {
      const mat = materiali.find(m => m.id === matId);
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        const qty = exists ? exists.qty : 1;
        const nuovaVoce = { id: matId, nome: mat.nome, meta: `${qty} ${mat.unita} × ${valore.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`, prezzoUnitario: valore, qty, kind: 'materiale', zona: exists?.zona || zonaAttiva, unita: mat.unita };
        if (exists) return prev.map(i => i.id === matId ? nuovaVoce : i);
        return [...prev, nuovaVoce];
      });
      setSavedFlashId(matId);
      setTimeout(() => setSavedFlashId(null), 1500);
    } else if (valoreStr === '') {
      setCarrello(prev => prev.filter(i => i.id !== matId));
    }
  };

  const aggiornaQtyMateriale = (matId, qty) => {
    const mat = materiali.find(m => m.id === matId);
    if (!mat) return;
    setCarrello(prev => {
      const exists = prev.find(i => i.id === matId);
      const prezzoUnitario = exists ? exists.prezzoUnitario : mat.prezzo;
      const meta = `${qty} ${mat.unita} × ${prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`;
      if (exists) {
        return prev.map(i => i.id === matId ? { ...i, qty, meta } : i);
      }
      if (qty <= 0) return prev;
      return [...prev, { id: mat.id, nome: mat.nome, meta, prezzoUnitario, qty, kind: 'materiale', zona: zonaAttiva, unita: mat.unita }];
    });
  };

  // aggiunge un materiale mai visto prima: lo crea nel listino Supabase e
  // lo mette subito nel carrello di questo preventivo
  const aggiungiMaterialeAlVolo = async () => {
    const nomeDigitato = nmNome.trim();
    if (!nomeDigitato) return;
    // R3 #4: se un materiale con lo stesso nome esiste già nel listino, lo
    // riusiamo invece di creare un duplicato — prima capitava perché non
    // c'era nessun controllo (visto dal vivo: "Raccordo a pressare dritto
    // 1/2\"" salvato due volte)
    const giaEsistente = materiali.find(m => m.nome.trim().toLowerCase() === nomeDigitato.toLowerCase());
    if (giaEsistente) {
      setCarrello(prev => {
        const inCarrello = prev.find(i => i.id === giaEsistente.id);
        const qty = inCarrello ? inCarrello.qty + 1 : 1;
        const nuovaVoce = {
          id: giaEsistente.id, nome: giaEsistente.nome,
          meta: `${qty} ${giaEsistente.unita} × ${giaEsistente.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
          prezzoUnitario: giaEsistente.prezzo, qty, kind: 'materiale', zona: zonaAttiva, unita: giaEsistente.unita,
        };
        return inCarrello ? prev.map(i => i.id === giaEsistente.id ? nuovaVoce : i) : [...prev, nuovaVoce];
      });
      mostraToast(`"${giaEsistente.nome}" era già nel listino — aggiunto da lì.`, 'info');
      setNmNome(''); setNmUnita('m'); setNmPrezzo(''); setNmZona(''); setShowNuovoMateriale(false);
      return;
    }
    setNmSalvando(true);
    setNmErrore('');
    const prezzo = parseFloat((nmPrezzo || '0').replace(',', '.')) || 0;
    const { data, error } = await sb.from('materiali')
      .insert(materialeToRow({ nome: nomeDigitato, unita: nmUnita, prezzo, zona: nmZona }))
      .select().single();
    setNmSalvando(false);
    if (error) {
      setNmErrore('Errore nel salvare il materiale: ' + error.message);
      return;
    }
    const nuovoMat = materialeFromRow(data);
    setMateriali(prev => [...prev, nuovoMat]);
    setCarrello(prev => [...prev, {
      id: nuovoMat.id, nome: nuovoMat.nome,
      meta: `1 ${nuovoMat.unita} × ${nuovoMat.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
      prezzoUnitario: nuovoMat.prezzo, qty: 1, kind: 'materiale', zona: zonaAttiva, unita: nuovoMat.unita,
    }]);
    setNmNome('');
    setNmUnita('m');
    setNmPrezzo('');
    setNmZona('');
    setShowNuovoMateriale(false);
  };

  // R2 #7: voce di lavoro/manodopera libera con categoria — se non esiste già
  // nel mini-catalogo riutilizzabile la salviamo lì (Supabase), così Denis la
  // ritrova scorrendo/cercando la prossima volta invece di riscriverla
  const aggiungiVoceLavoro = async () => {
    const descrizione = lavoroDescrizione.trim();
    if (!descrizione) return;
    const prezzo = parseFloat((lavoroPrezzo || '0').replace(',', '.')) || 0;
    const categoria = lavoroCategoria;
    setCarrello(prev => [...prev, {
      id: 'lavoro-' + Date.now(),
      nome: descrizione,
      meta: prezzo > 0 ? `Lavoro · ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
      prezzoUnitario: prezzo, qty: 1, kind: 'lavoro', zona: zonaAttiva, categoriaDocumento: categoria,
    }]);
    const giaSalvata = vociLavoro.find(v => v.nome.trim().toLowerCase() === descrizione.toLowerCase());
    if (!giaSalvata) {
      const { data, error } = await sb.from('voci_lavoro')
        .insert(voceLavoroToRow({ nome: descrizione, categoria, prezzo }))
        .select().single();
      if (!error && data) setVociLavoro(prev => [...prev, voceLavoroFromRow(data)].sort((a, b) => a.nome.localeCompare(b.nome)));
    }
    setLavoroDescrizione('');
    setLavoroPrezzo('');
    setShowNuovoLavoro(false);
  };

  // R2 #7: riusa una voce già salvata nel mini-catalogo, senza riscriverla
  const aggiungiVoceSalvata = (v) => {
    setCarrello(prev => [...prev, {
      id: 'lavoro-' + Date.now(),
      nome: v.nome,
      meta: v.prezzo > 0 ? `Lavoro · ${v.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
      prezzoUnitario: v.prezzo, qty: 1, kind: 'lavoro', zona: zonaAttiva, categoriaDocumento: v.categoria,
    }]);
    setQueryLavoro('');
  };

  // R2 #4: una voce di lavoro già aggiunta è modificabile (testo e prezzo),
  // non solo eliminabile e da riscrivere da capo
  const startEditLavoro = (item) => {
    setEditingLavoroId(item.id);
    setEditLavoroDescrizione(item.nome);
    setEditLavoroPrezzo(item.prezzoUnitario ? item.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 }) : '');
  };

  const confirmEditLavoro = (id) => {
    const descrizione = editLavoroDescrizione.trim();
    setEditingLavoroId(null);
    if (!descrizione) return;
    const prezzo = parseFloat((editLavoroPrezzo || '0').replace(',', '.')) || 0;
    setCarrello(prev => prev.map(i => i.id === id ? {
      ...i, nome: descrizione, prezzoUnitario: prezzo,
      meta: prezzo > 0 ? `Lavoro · ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
    } : i));
  };

  const toggleProdotto = (p) => {
    const exists = carrello.find(i => i.id === p.id);
    if (exists) {
      setCarrello(carrello.filter(i => i.id !== p.id));
    } else {
      setCarrello([...carrello, {
        id: p.id, nome: p.nome, meta: p.tier, prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto',
        zona: zonaAttiva, tipoInstallazione: 'nuova',
        // portati nel carrello per generare una dicitura ricca nel documento (FASE 4)
        fornitore: p.fornitore, misuraLunghezza: p.misuraLunghezza, misuraProfondita: p.misuraProfondita,
        misuraAltezza: p.misuraAltezza, descrizioneProdotto: p.descrizione,
      }]);
    }
  };

  // P3: quantità multiple per i prodotti già nel carrello
  const aggiornaQtyProdotto = (id, qty) => {
    setCarrello(prev => {
      if (qty <= 0) return prev.filter(i => i.id !== id);
      return prev.map(i => i.id === id ? { ...i, qty } : i);
    });
  };

  // nuova installazione o sostituzione di un prodotto esistente — cambia la
  // descrizione auto-generata nel documento cliente (smontaggio del vecchio)
  const impostaTipoInstallazione = (id, tipo) => {
    setCarrello(prev => prev.map(i => i.id === id ? { ...i, tipoInstallazione: tipo } : i));
  };

  // Applica un template di lavoro — aggiunge automaticamente i materiali tipici,
  // così non si devono cercarli uno per uno per i lavori più comuni
  const applicaTemplate = async (template) => {
    setZonaAttiva(template.zona);
    for (const tm of template.materiali) {
      const matEsistente = materiali.find(m => m.nome === tm.nome);
      let matId = matEsistente?.id;
      if (!matEsistente) {
        const { data, error } = await sb.from('materiali')
          .insert(materialeToRow({ nome: tm.nome, unita: tm.unita, prezzo: tm.prezzo }))
          .select().single();
        if (error) {
          console.error('Errore nel salvare il materiale dal template:', error);
          continue;
        }
        const nuovoMat = materialeFromRow(data);
        setMateriali(prevMat => [...prevMat, nuovoMat]);
        matId = nuovoMat.id;
      }
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        if (exists) {
          // già in carrello (da un altro template o aggiunto a mano): sommiamo
          // la quantità del template invece di ignorarla, altrimenti il
          // materiale resta con una quantità insufficiente per il lavoro
          const nuovaQty = exists.qty + tm.qty;
          return prev.map(i => i.id === matId
            ? { ...i, qty: nuovaQty, meta: `${nuovaQty} ${tm.unita} × ${i.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` }
            : i);
        }
        return [...prev, {
          id: matId, nome: tm.nome,
          meta: `${tm.qty} ${tm.unita} × ${tm.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
          prezzoUnitario: tm.prezzo, qty: tm.qty, kind: 'materiale', zona: template.zona,
        }];
      });
    }
    if (template.prodottoSuggerito) {
      const prod = prodotti.find(p => p.nome === template.prodottoSuggerito);
      if (prod) {
        setCarrello(prev => {
          if (prev.find(i => i.id === prod.id)) return prev;
          return [...prev, { id: prod.id, nome: prod.nome, meta: prod.tier, prezzoUnitario: prod.prezzo, qty: 1, kind: 'prodotto', zona: template.zona }];
        });
      }
    }
  };

  // Gestione foto cantiere — ogni foto viene compressa e caricata subito su
  // Supabase Storage, con una riga in "foto" (senza preventivo_id finché il
  // preventivo non viene salvato: si collega dopo, in salvaPreventivo).
  // L'app richiede almeno 2 foto prima di poter salvare un preventivo nuovo.
  const gestisciFoto = async (fileList, tipo) => {
    setCaricandoFoto(true);
    for (const file of Array.from(fileList)) {
      let blob;
      try {
        blob = await comprimiImmagine(file, 1280, 0.6);
      } catch (err) {
        mostraToast('Errore nel comprimere la foto: ' + err.message);
        continue;
      }
      try {
        if (!navigator.onLine) throw new Error('offline');
        const cartella = cliente?.id || 'senza-cliente';
        const path = `${cartella}/${Date.now()}-${tipo}.jpg`;
        const { error: uploadError } = await sb.storage.from('cantiere-foto').upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;
        const rigaFoto = { preventivoId: modificaId ? modificaDbId : null, clienteId: cliente?.id || null, zona: zonaAttiva, tipo, storagePath: path };
        const { data, error } = await sb.from('foto').insert(fotoToRow(rigaFoto)).select().single();
        if (error) throw error;
        setFotoCantiere(prev => [...prev, fotoFromRow(data)]);
      } catch (err) {
        // niente rete: la foto resta comunque visibile e conta per il
        // minimo di 2 richieste — si carica da sola alla riconnessione
        const localId = 'offline-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        setFotoCantiere(prev => [...prev, { id: localId, url: URL.createObjectURL(blob), tipo, zona: zonaAttiva, pending: true, _blob: blob }]);
      }
    }
    setCaricandoFoto(false);
  };

  const rimuoviFoto = async (id) => {
    const f = fotoCantiere.find(x => x.id === id);
    if (!f) return;
    setFotoCantiere(prev => prev.filter(x => x.id !== id));
    if (f.pending) return;
    if (f.storagePath) sb.storage.from('cantiere-foto').remove([f.storagePath]).catch(() => {});
    sb.from('foto').delete().eq('id', id).then(({ error }) => {
      if (error) console.error('Errore nel rimuovere la foto:', error);
    });
  };

  const rimuoviVoce = (id) => setCarrello(carrello.filter(i => i.id !== id));

  const cambiaStato = async (id, nuovoStato) => {
    const { error } = await sb.from('preventivi').update({ stato: nuovoStato }).eq('numero', id);
    if (error) {
      mostraToast('Errore nel salvare lo stato: ' + error.message);
      return;
    }
    setPreventivi(preventivi.map(p => p.id === id ? { ...p, stato: nuovoStato } : p));
    setStatoEditId(null);
  };

  // R3: elimina preventivo — le foto collegate spariscono in automatico dal db
  // (cascade), ma i file nello storage vanno rimossi a mano
  const eliminaPreventivo = async (p) => {
    if (!window.confirm(`Eliminare definitivamente il preventivo ${p.id}? L'azione non si può annullare.`)) return;
    const { data: fotoDaRimuovere } = await sb.from('foto').select('storage_path').eq('preventivo_id', p.dbId);
    const paths = (fotoDaRimuovere || []).map(f => f.storage_path).filter(Boolean);
    if (paths.length) sb.storage.from('cantiere-foto').remove(paths).catch(() => {});
    const { error } = await sb.from('preventivi').delete().eq('id', p.dbId);
    if (error) { mostraToast('Errore nell’eliminare il preventivo: ' + error.message); return; }
    setPreventivi(prev => prev.filter(x => x.dbId !== p.dbId));
    setMode('lista');
  };

  const maxNum = Math.max(...preventivi.map(p => parseInt(p.id.replace('PV-', '')) || 0), 148);
  const numeroDocumento = 'PV-' + String(maxNum + 1).padStart(4, '0');
  const dataDocumento = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const salvaPreventivo = async () => {
    if (!cliente || carrello.length === 0) return;
    setSalvandoPreventivo(true);
    setErrorePreventivo('');
    const zoneCoinvolte = [...new Set(carrello.map(i => i.zona || 'generico'))];
    // foto scattate mentre non c'era rete: sono già visibili in fotoCantiere
    // ma esistono solo come blob locale, vanno accodate insieme al preventivo
    const fotoPendenti = fotoCantiere.filter(f => f.pending).map(f => ({ blob: f._blob, tipo: f.tipo, zona: f.zona }));

    if (modificaId) {
      const payload = {
        clienteId: cliente.id,
        cliente: cliente.nome,
        cantiere: cliente.indirizzo.split(',').pop().trim(),
        importo: Math.round(totale),
        importoManodopera: Math.round(rincaroValore),
        carrelloSnapshot: carrello,
        diciture: diciture,
      };
      try {
        if (!navigator.onLine) throw new Error('offline');
        const { error } = await sb.from('preventivi').update(preventivoToRow(payload)).eq('numero', modificaId);
        if (error) throw error;
        const fotoCaricate = fotoCantiere.filter(f => !f.pending);
        if (fotoCaricate.length > 0) {
          sb.from('foto').update({ preventivo_id: modificaDbId }).in('id', fotoCaricate.map(f => f.id))
            .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
        }
        if (fotoPendenti.length > 0) {
          await accodaOffline('preventivo_foto', { preventivoId: modificaDbId, clienteId: cliente.id, foto: fotoPendenti });
        }
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length } : p));
      } catch (err) {
        // niente rete: si accoda tutto il preventivo e si mostra comunque
        // il salvataggio come riuscito, così Denis può continuare a lavorare
        await accodaOffline('preventivo', { modificaId, modificaDbId, payload, fotoPendenti });
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true } : p));
      }
      setSalvandoPreventivo(false);
      setShowPreview(false);
      setShowSuccess(true);
      return;
    }

    const payload = {
      id: numeroDocumento,
      clienteId: cliente.id,
      cliente: cliente.nome,
      cantiere: cliente.indirizzo.split(',').pop().trim(),
      dataIso: new Date().toISOString().slice(0, 10),
      importo: Math.round(totale),
      importoManodopera: Math.round(rincaroValore),
      diciture: diciture,
      stato: 'In Attesa',
      carrelloSnapshot: carrello,
    };
    try {
      if (!navigator.onLine) throw new Error('offline');
      const { data, error } = await sb.from('preventivi').insert(preventivoToRow(payload)).select().single();
      if (error) throw error;
      const fotoCaricate = fotoCantiere.filter(f => !f.pending);
      if (fotoCaricate.length > 0) {
        sb.from('foto').update({ preventivo_id: data.id }).in('id', fotoCaricate.map(f => f.id))
          .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
      }
      if (fotoPendenti.length > 0) {
        await accodaOffline('preventivo_foto', { preventivoId: data.id, clienteId: cliente.id, foto: fotoPendenti });
      }
      const nuovo = { ...preventivoFromRow(data), zone: zoneCoinvolte, nFoto: fotoCantiere.length };
      setPreventivi([nuovo, ...preventivi]);
    } catch (err) {
      await accodaOffline('preventivo', { modificaId: null, modificaDbId: null, payload, fotoPendenti });
      const nuovo = { ...payload, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true };
      setPreventivi([nuovo, ...preventivi]);
    }
    setSalvandoPreventivo(false);
    setShowPreview(false);
    setShowSuccess(true);
  };

  const chiudiSuccess = () => {
    setShowSuccess(false);
    setModificaId(null);
    setModificaDbId(null);
    setMode('lista');
  };

  /* ---- vista lista ---- */
  if (mode === 'lista') {
    // P12: lavori attivi ordinati per priorità: i Finito escono dalla lista
    // principale e restano visibili solo nello storico del cliente
    const preventiviAttivi = ordinaPerPriorita(preventivi.filter(p => p.stato !== 'Finito'));
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 relative flex-1 flex flex-col min-h-0">
        <div className="hidden lg:flex items-center justify-end">
          <button
            onClick={startNuovo}
            className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors"
          >
            <Plus className="w-4 h-4" />
            Nuovo Preventivo
          </button>
        </div>

        <div className="app-card overflow-hidden flex-1 flex flex-col">
          <PreventivoMobileList
            items={preventiviAttivi}
            onSelect={(p) => { setDettaglioId(p.id); setMode('dettaglio'); }}
          />

          <div className="hidden md:block overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-slate-100">
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">N. Documento</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Cliente</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Cantiere</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Data</th>
                  <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Importo</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Stato</th>
                </tr>
              </thead>
              <tbody>
                {preventiviAttivi.map((p) => (
                  <tr
                    key={p.id}
                    onClick={() => { setDettaglioId(p.id); setMode('dettaglio'); }}
                    className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors cursor-pointer"
                  >
                    <td className="px-5 py-3.5 font-mono text-xs text-slate-500">{p.id}</td>
                    <td className="px-5 py-3.5 font-medium text-slate-900">{p.cliente}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden md:table-cell">{p.cantiere}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden sm:table-cell">{p.data}</td>
                    <td className="px-5 py-3.5 text-right font-semibold text-slate-900">{fmtEuro(p.importo)}</td>
                    <td className="px-5 py-3.5" onClick={(e) => e.stopPropagation()}>
                      {statoEditId === p.id ? (
                        <div className="flex items-center gap-1 flex-wrap">
                          {['In Corso', 'Accettato', 'Inviato', 'In Attesa', 'Finito', 'Rifiutato'].map(s => (
                            <button
                              key={s}
                              onClick={() => cambiaStato(p.id, s)}
                              className={`px-2 py-1 rounded-full text-[10px] font-semibold border transition-opacity hover:opacity-80 ${statoStyle[s] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                            >
                              {s}
                            </button>
                          ))}
                          <button onClick={() => setStatoEditId(null)} className="text-slate-400 hover:text-slate-600 ml-1">
                            <X className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ) : (
                        <button
                          onClick={() => setStatoEditId(p.id)}
                          className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium hover:opacity-75 transition-opacity ${statoStyle[p.stato] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                        >
                          {p.stato}
                          <Pencil className="w-2.5 h-2.5 opacity-60" />
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
                {preventiviAttivi.length === 0 && (
                  <tr><td colSpan="6" className="px-5 py-10 text-center text-sm text-slate-400">
                    {preventiviLoading ? 'Caricamento preventivi...' : 'Nessun preventivo attivo. I preventivi Finito restano nello storico del cliente.'}
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>

        <button
          type="button"
          onClick={startNuovo}
          className="lg:hidden fixed right-4 z-30 w-14 h-14 rounded-full bg-blue-600 text-white shadow-xl shadow-blue-600/35 flex items-center justify-center active:scale-95 transition-transform bottom-[calc(5.25rem+env(safe-area-inset-bottom))]"
          aria-label="Nuovo preventivo"
        >
          <Plus className="w-6 h-6" />
        </button>
      </div>
    );
  }

  /* ---- vista dettaglio preventivo esistente ---- */
  if (mode === 'dettaglio') {
    const p = preventivi.find(pv => pv.id === dettaglioId);
    const clienteDett = p ? clienti.find(c => c.id === p.clienteId) : null;
    const carrelloDett = p?.carrelloSnapshot || [];
    const rincaroDett = p?.importo && carrelloDett.length
      ? p.importo - carrelloDett.reduce((s, i) => s + i.prezzoUnitario * i.qty, 0)
      : 0;
    if (!p) { setMode('lista'); return null; }
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <div className="flex items-center justify-between">
          <button onClick={() => { setStatoEditDettaglio(false); setMode('lista'); }} className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900">
            <ArrowLeft className="w-3.5 h-3.5" />
            Torna ai preventivi
          </button>
          <div className="flex items-center gap-3">
            <button
              onClick={() => iniziaModifica(p)}
              className="flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:text-blue-800"
            >
              <Pencil className="w-3.5 h-3.5" />
              Modifica preventivo
            </button>
            <button
              onClick={() => eliminaPreventivo(p)}
              className="flex items-center justify-center w-7 h-7 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
              aria-label="Elimina preventivo"
            >
              <Trash2 className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>

        <div className="app-card px-6 py-5 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p className="font-mono text-xs text-slate-400">{p.id}</p>
            <p className="text-lg font-bold text-slate-900 mt-0.5">{clienteDett?.nome || p.cliente}</p>
            <p className="text-sm text-slate-500 mt-0.5">{clienteDett?.indirizzo || p.cantiere} · {p.data}</p>
          </div>
          <div className="text-right">
            <p className="text-2xl font-bold text-slate-900">{fmtEuro(p.importo)}</p>
            {statoEditDettaglio ? (
              <div className="flex items-center gap-1 flex-wrap justify-end mt-1.5 max-w-[220px]">
                {['In Corso', 'Accettato', 'Inviato', 'In Attesa', 'Finito', 'Rifiutato'].map(s => (
                  <button
                    key={s}
                    onClick={() => { cambiaStato(p.id, s); setStatoEditDettaglio(false); }}
                    className={`px-2 py-1 rounded-full text-[10px] font-semibold transition-opacity hover:opacity-80 ${statoStyle[s]}`}
                  >
                    {s}
                  </button>
                ))}
                <button onClick={() => setStatoEditDettaglio(false)} className="text-slate-400 hover:text-slate-600 ml-1">
                  <X className="w-3.5 h-3.5" />
                </button>
              </div>
            ) : (
              <button
                onClick={() => setStatoEditDettaglio(true)}
                className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium mt-1 hover:opacity-75 transition-opacity ${statoStyle[p.stato] || 'bg-red-50 text-red-600'}`}
              >
                {p.stato}
                <Pencil className="w-2.5 h-2.5 opacity-60" />
              </button>
            )}
          </div>
        </div>

        {(p.zone || []).length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Lavorazioni per zona</p>
            </div>
            <div className="p-5 space-y-4">
              {p.zone.map(zonaId => {
                const zonaInfo = ZONE_AMBIENTI.find(z => z.id === zonaId);
                const vociZona = carrelloDett.filter(i => (i.zona || 'generico') === zonaId);
                return (
                  <div key={zonaId}>
                    <p className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-1.5">
                      <ZonaIcon zonaId={zonaInfo?.id || zonaId} className="text-slate-500 shrink-0" size={16} />
                      {zonaInfo?.nome || zonaId}
                    </p>
                    <ul className="space-y-1">
                      {vociZona.map(v => (
                        <li key={v.id} className="text-sm text-slate-600 flex items-center justify-between">
                          <span>{v.nome} <span className="text-slate-400 font-mono text-xs">({v.meta})</span></span>
                          <span className="font-semibold text-slate-900">{fmtEuro(Math.round(v.prezzoUnitario * v.qty))}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {fotoDettaglio.length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Foto cantiere ({fotoDettaglio.length})</p>
            </div>
            <div className="p-5 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
              {fotoDettaglio.map(f => (
                <div key={f.id} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200">
                  <img src={f.url} alt="" className="w-full h-full object-cover" />
                  <span className={`absolute bottom-0 left-0 right-0 text-[9px] font-bold text-center py-0.5 text-white ${f.tipo === 'prima' ? 'bg-amber-500/90' : 'bg-emerald-500/90'}`}>
                    {f.tipo === 'prima' ? 'PRIMA' : 'DOPO'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="flex flex-col sm:flex-row gap-2.5">
          <button
            onClick={async () => {
              if (!clienteDett) return;
              await generaPDFCliente({ cliente: clienteDett, carrello: carrelloDett, diciture: p.diciture || {}, totale: p.importo, nextId: p.id, logoB64: LOGO_TRASPARENTE_BASE64 });
            }}
            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
          >
            <Download className="w-4 h-4" />
            PDF per il Cliente
          </button>
          <button
            onClick={async () => {
              if (!clienteDett) return;
              const subMat = carrelloDett.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              const subProd = carrelloDett.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              const subLavoro = carrelloDett.filter(i => i.kind === 'lavoro').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);

                      subProd: carrello.filter(i=>i.kind==='prodotto').reduce((s,i)=>s+i.prezzoUnitario*i.qty,0),
                      subLavoro: subtotaleLavoro,
                      rincaro: rincaroValore,
                      totale,
                      rincaroMode,
                      rPct: rincaroPercent,
                      rOre: rincaroOre,
                      rTar: rincaroTariffa,

                <Check className="w-4 h-4 text-emerald-500" />

/* PAGINA MATERIALI — listino personale, cresce nel tempo         */
/* ============================================================ */

function MaterialiPage({ materiali, setMateriali, materialiLoading }) {
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newUnita, setNewUnita] = useState('m');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [savedFlashId, setSavedFlashId] = useState(null);
  const [salvandoNuovo, setSalvandoNuovo] = useState(false);
  const [erroreNuovo, setErroreNuovo] = useState('');

  const oggi = () => {
    const d = new Date();
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const startEdit = (m) => {
    setEditingId(m.id);
    setEditValue(String(m.prezzo).replace('.', ','));
  };

  const confirmEdit = async (id) => {
    const val = parseFloat(editValue.replace(',', '.'));
    setEditingId(null);
    if (isNaN(val) || val <= 0) return;
    const { error } = await sb.from('materiali')
      .update({ prezzo: val, ultimo_aggiornamento: new Date().toISOString() })
      .eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare il prezzo: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, prezzo: val, ultimoAggiornamento: oggi() } : m));
    setSavedFlashId(id);
    setTimeout(() => setSavedFlashId(null), 1800);
  };

  const startRename = (m) => {
    setRenamingId(m.id);
    setRenameValue(m.nome);
  };

  const confirmRename = async (id) => {
    const nome = renameValue.trim();
    setRenamingId(null);
    const originale = materiali.find(m => m.id === id)?.nome;
    if (!nome || nome === originale) return;
    const { error } = await sb.from('materiali').update({ nome }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare il nome: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, nome } : m));
  };

  const aggiornaZonaMateriale = async (id, zona) => {
    const { error } = await sb.from('materiali').update({ zona: zona || null }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare la zona: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, zona } : m));
  };

  const deleteMateriale = async (id) => {
    const { error } = await sb.from('materiali').delete().eq('id', id);
    if (error) {
      mostraToast('Errore nell’eliminare il materiale: ' + error.message);
      return;
    }
    setMateriali(materiali.filter(m => m.id !== id));
  };

  const addMateriale = async () => {
    if (!newNome.trim()) return;
    setSalvandoNuovo(true);
    setErroreNuovo('');
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    const { data, error } = await sb.from('materiali')
      .insert(materialeToRow({ nome: newNome.trim(), unita: newUnita, prezzo }))
      .select().single();
    setSalvandoNuovo(false);
    if (error) {
      setErroreNuovo('Errore nel salvare il materiale: ' + error.message);
      return;
    }
    setMateriali([materialeFromRow(data), ...materiali]);
    setNewNome('');
    setNewUnita('m');
    setNewPrezzo('');
    setShowNewForm(false);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 flex-1 flex flex-col min-h-0">

      <div className="app-card overflow-hidden flex-1 flex flex-col">
        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 className="text-sm font-semibold text-slate-900">Materiali grezzi</h2>
            <p className="text-xs text-slate-400 mt-0.5">{materiali.length} voci nel listino</p>
          </div>
          <button
            onClick={() => setShowNewForm(!showNewForm)}
            className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            Nuovo materiale
          </button>
        </div>

        {showNewForm && (
          <div className="px-5 py-4 bg-slate-50 border-b border-slate-100">
            <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto_auto_auto] gap-2.5 items-end">
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome materiale</label>
                <input
                  type="text"
                  value={newNome}
                  onChange={(e) => setNewNome(e.target.value)}
                  placeholder="Es. Tubo in rame 14mm"
                  className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Unità</label>
                <select
                  value={newUnita}
                  onChange={(e) => setNewUnita(e.target.value)}
                  className="px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                >
                  <option value="m">al metro (m)</option>
                  <option value="pz">a pezzo (pz)</option>
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
                <input
                  type="text"
                  inputMode="decimal"
                  value={newPrezzo}
                  onChange={(e) => setNewPrezzo(e.target.value)}
                  placeholder="0,00"
                  className="w-24 px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div className="flex gap-2">
                <button
                  onClick={addMateriale}
                  disabled={salvandoNuovo}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60"
                >
                  {salvandoNuovo ? 'Salvo...' : 'Aggiungi'}
                </button>
                <button
                  onClick={() => setShowNewForm(false)}
                  className="px-3 py-2 text-slate-400 hover:text-slate-600"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            </div>
            {erroreNuovo && <p className="text-[11px] text-red-500 mt-2">{erroreNuovo}</p>}
          </div>
        )}

        {/* lista a card — su telefono una tabella non si sente mai come
            un'app nativa, meglio righe verticali con tocchi larghi */}
        <div className="lg:hidden divide-y divide-slate-50">
          {materiali.map((m) => (
            <div key={m.id} className="px-4 py-3.5 flex items-start justify-between gap-3">
              <div className="min-w-0 flex-1">
                {renamingId === m.id ? (
                  <div className="flex items-center gap-1.5">
                    <input
                      autoFocus
                      type="text"
                      value={renameValue}
                      onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && confirmRename(m.id)}
                      onBlur={() => confirmRename(m.id)}
                      className="w-full px-2 py-1.5 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                    />
                    <button onClick={() => confirmRename(m.id)} className="text-emerald-600 hover:text-emerald-700 shrink-0 p-1">
                      <Check className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button onClick={() => startRename(m)} className="text-left text-sm font-medium text-slate-900 truncate block w-full py-1 -my-1">
                    {m.nome}
                  </button>
                )}
                <p className="text-xs text-slate-400 font-mono mt-1">
                  {m.unita}{m.ultimoAggiornamento ? ` · ${m.ultimoAggiornamento}` : ''}
                </p>
                <select
                  value={m.zona || ''}
                  onChange={(e) => aggiornaZonaMateriale(m.id, e.target.value)}
                  className="mt-2 w-full text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-md px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500/30"
                >
                  <option value="">Tutte le zone</option>
                  {ZONE_AMBIENTI.map(z => <option key={z.id} value={z.id}>{z.nome}</option>)}
                </select>
              </div>
              <div className="flex flex-col items-end gap-2 shrink-0">
                {editingId === m.id ? (
                  <div className="flex items-center gap-1.5">
                    <span className="text-slate-400 text-xs">€</span>
                    <input
                      autoFocus
                      type="text"
                      inputMode="decimal"
                      value={editValue}
                      onChange={(e) => setEditValue(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && confirmEdit(m.id)}
                      className="w-16 px-2 py-1.5 text-sm text-right bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                    />
                    <button onClick={() => confirmEdit(m.id)} className="text-emerald-600 hover:text-emerald-700 p-1">
                      <Check className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => startEdit(m)}
                    className={`font-semibold text-sm rounded-md px-2.5 py-1.5 transition-colors ${
                      savedFlashId === m.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-900 bg-slate-50'
                    }`}
                  >
                    {m.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €
                  </button>
                )}
                <button onClick={() => deleteMateriale(m.id)} className="w-9 h-9 flex items-center justify-center text-slate-400 hover:text-red-500">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            </div>
          ))}
          {materiali.length === 0 && (
            <p className="px-5 py-10 text-center text-sm text-slate-400">
              {materialiLoading ? 'Caricamento materiali...' : 'Nessun materiale ancora. Aggiungine uno per iniziare il tuo listino.'}
            </p>
          )}
        </div>

        <div className="hidden lg:block overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100">
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Materiale</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Unità</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Zona</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Aggiornato</th>
                <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Prezzo</th>
                <th className="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {materiali.map((m) => (
                <tr key={m.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors">
                  <td className="px-5 py-3.5 font-medium text-slate-900">
                    {renamingId === m.id ? (
                      <div className="flex items-center gap-1.5">
                        <input
                          autoFocus
                          type="text"
                          value={renameValue}
                          onChange={(e) => setRenameValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && confirmRename(m.id)}
                          onBlur={() => confirmRename(m.id)}
                          className="w-full min-w-[10rem] px-2 py-1 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                        />
                        <button onClick={() => confirmRename(m.id)} className="text-emerald-600 hover:text-emerald-700 shrink-0">
                          <Check className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <button onClick={() => startRename(m)} className="text-left hover:text-blue-600 transition-colors">
                        {m.nome}
                      </button>
                    )}
                  </td>
                  <td className="px-5 py-3.5 text-slate-500 font-mono text-xs">{m.unita}</td>
                  <td className="px-5 py-3.5 hidden md:table-cell">
                    <select
                      value={m.zona || ''}
                      onChange={(e) => aggiornaZonaMateriale(m.id, e.target.value)}
                      className="text-xs text-slate-500 bg-transparent border border-slate-200 rounded-md px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500/30"
                    >
                      <option value="">Tutte le zone</option>
                      {ZONE_AMBIENTI.map(z => <option key={z.id} value={z.id}>{z.nome}</option>)}
                    </select>
                  </td>
                  <td className="px-5 py-3.5 text-slate-400 text-xs hidden sm:table-cell">{m.ultimoAggiornamento}</td>
                  <td className="px-5 py-3.5 text-right">
                    {editingId === m.id ? (
                      <div className="flex items-center justify-end gap-1.5">
                        <span className="text-slate-400 text-xs">€</span>
                        <input
                          autoFocus
                          type="text"
                          inputMode="decimal"
                          value={editValue}
                          onChange={(e) => setEditValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && confirmEdit(m.id)}
                          className="w-20 px-2 py-1 text-sm text-right bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                        />
                        <button onClick={() => confirmEdit(m.id)} className="text-emerald-600 hover:text-emerald-700">
                          <Check className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => startEdit(m)}
                        className={`font-semibold transition-colors rounded-md px-2 py-1 ${
                          savedFlashId === m.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-900 hover:bg-slate-100'
                        }`}
                      >
                        {m.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €
                      </button>
                    )}
                  </td>
                  <td className="px-5 py-3.5 text-right">
                    <div className="flex items-center justify-end gap-1">
                      <button onClick={() => startEdit(m)} className="text-slate-400 hover:text-slate-600 p-1">
                        <Pencil className="w-3.5 h-3.5" />
                      </button>
                      <button onClick={() => deleteMateriale(m.id)} className="text-slate-400 hover:text-red-500 p-1">
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
              {materiali.length === 0 && (
                <tr>
                  <td colSpan="6" className="px-5 py-10 text-center text-sm text-slate-400">
                    {materialiLoading ? 'Caricamento materiali...' : 'Nessun materiale ancora. Aggiungine uno per iniziare il tuo listino.'}
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
