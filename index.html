<script>
// Se qualcosa va storto, mostra l'errore invece della pagina bianca.
window.addEventListener('error', function (e) {
  var b = document.getElementById('errbox');
  if (b) { b.style.display = 'block'; b.textContent = 'Errore: ' + (e.message || e); }
});
// R9/R11/R12/R13/R14: quattro tentativi precedenti inseguivano la tastiera
// via JS — un body "position:fixed" ricalcolato a mano (transform, poi top,
// poi un'altezza da visualViewport), più uno scrollIntoView forzato ad ogni
// focus. Tre meccanismi che si contendevano la stessa cosa, con risultati
// diversi ma sempre rotti. Confrontato con un'altra app dove la tastiera non
// sposta mai nulla: lì non c'è NESSUNO di questi tre. Qui si fa lo stesso —
// un solo meccanismo (il meta "interactive-widget=resizes-content" in testa
// al file, più "100dvh" nel CSS), zero JS che insegue la tastiera o il
// focus. Il browser sa già come si fa.
(function rippleAndroid() {
  // effetto ripple Material su qualunque elemento con classe "app-ripple" —
  // un listener solo, delegato su document, così funziona anche sui bottoni
  // che React ricrea ad ogni render, senza doverlo ricollegare ogni volta
  document.addEventListener('pointerdown', function (e) {
    const el = e.target.closest('.app-ripple');
    if (!el || el.disabled) return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    const span = document.createElement('span');
    span.className = 'app-ripple-circle';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    el.appendChild(span);
    span.addEventListener('animationend', function () { span.remove(); });
  });
})();
</script>

<script type="text/babel" data-presets="react">

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4bHJma21tb3Fkb3dqenNpcGdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjkyMzUsImV4cCI6MjA5OTk0NTIzNX0.86OHaiTD7vyBkX-SgAlCFf0m4GxWobX26_Rz3oW2Ya8';

/* ============================================================
   GOOGLE CALENDAR (Fase 7) — modulo isolato e opzionale.
   Se GOOGLE_CALENDAR_CLIENT_ID è vuoto, il pulsante "Aggiungi a Google
   Calendar" semplicemente non appare da nessuna parte: il resto
   dell'app funziona esattamente come prima, con o senza questo.
   ============================================================ */
const GOOGLE_CALENDAR_CLIENT_ID = '995993747787-len4utlhpr2lpbtnf2uu3ghhrc2ec136.apps.googleusercontent.com';

let googleTokenClient = null;
let googleAccessToken = null;
let googleAccessTokenScade = 0;

function googleCalendarDisponibile() {
  return !!GOOGLE_CALENDAR_CLIENT_ID && !!(window.google && window.google.accounts && window.google.accounts.oauth2);
}

function inizializzaGoogleTokenClient() {
  if (googleTokenClient || !googleCalendarDisponibile()) return;
  googleTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CALENDAR_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: () => {}, // sovrascritto ad ogni richiesta, vedi sotto
  });
}

// restituisce un token valido, chiedendo il consenso a Denis solo la
// prima volta (o quando il token è scaduto) — non ad ogni utilizzo
function otteniTokenGoogle() {
  return new Promise((resolve, reject) => {
    if (!googleCalendarDisponibile()) { reject(new Error('Google Calendar non configurato')); return; }
    inizializzaGoogleTokenClient();
    if (googleAccessToken && Date.now() < googleAccessTokenScade) {
      resolve(googleAccessToken);
      return;
    }
    googleTokenClient.callback = (risposta) => {
      if (risposta.error) { reject(new Error(risposta.error)); return; }
      googleAccessToken = risposta.access_token;
      googleAccessTokenScade = Date.now() + ((risposta.expires_in || 3600) - 60) * 1000;
      resolve(googleAccessToken);
    };
    // "" = prova prima in silenzio se Denis ha già autorizzato in questa sessione browser
    googleTokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
  });
}

async function creaEventoGoogleCalendar({ titolo, luogo, descrizione, dataOraInizio, durataMinuti = 60 }) {
  const token = await otteniTokenGoogle();
  const inizio = new Date(dataOraInizio);
  const fine = new Date(inizio.getTime() + durataMinuti * 60000);
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      summary: titolo,
      location: luogo || '',
      description: descrizione || '',
      start: { dateTime: inizio.toISOString() },
      end: { dateTime: fine.toISOString() },
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || 'Errore nella creazione dell’evento');
  }
  return res.json();
}

// converte una riga della tabella "clienti" (snake_case) nell'oggetto

    note: row.note || [],

}

// converte (anche parzialmente) un oggetto cliente nelle colonne della

  const row = {};

}

// converte una riga della tabella "preventivi" nell'oggetto usato in tutta

  return {
    id: row.numero,
    dbId: row.id,

}

// R6 (segnalato da Denis/Deborah dopo il test cronometrato: "cavo 6" o
// "centralino 12" davano 0 risultati perché il nome reale ha un ordine o
// un formato diverso) — ricerca "a parole", non a frase intera: ogni
// parola scritta deve trovarsi da qualche parte nel testo, in qualsiasi
// ordine, senza badare ad accenti o maiuscole. Così "cavo 6" trova anche
// "Cavo unipolare FS17 ... 1x6 mmq ..." invece di dare 0 risultati.
function normalizzaRicerca(s) {
  return (s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function corrispondeRicerca(testoRicercabile, query) {
  const hay = normalizzaRicerca(testoRicercabile);
  const parole = normalizzaRicerca(query).split(' ').filter(Boolean);
  return parole.length > 0 && parole.every(p => hay.includes(p));
}

// R9 (chiesto da Denis): un prodotto nuovo creato al volo (da "Scrivi un
// materiale" o dal preventivo) deve finire da solo nella categoria giusta,
// non sempre in quella che si stava sfogliando per caso. Indovina dalle
// parole più tipiche del nome — nessuna IA, solo parole chiave, in ordine
// dal più specifico al più generico per evitare ambiguità (es. "lampada da
// bagno" conta come Bagno, controllato prima di Illuminazione/Elettrico).
function indovinaCategoria(nome, fallback) {
  const n = normalizzaRicerca(nome);
  const gruppi = [
    ['Bagno', ['lavabo', 'sanitari', 'bidet', 'doccia', 'vaso wc', 'miscelatore', 'specchio', 'lavabi', 'piatto doccia']],
    ['Illuminazione', ['lampadina', 'faretto', 'plafoniera', 'lampada', ' led ', 'spot', 'applique']],
    ['Riscaldamento e clima', ['caldaia', 'climatizzatore', 'condizionatore', 'pompa di calore', 'scaldabagno', 'radiatore', 'termosifone', 'stufa', 'camino']],
    ['Elettrico', ['cavo', 'interruttore', 'presa', 'centralino', 'placca', 'magnetotermico', 'differenziale', 'quadro elettrico', 'telecamera', 'videocitofono', 'switch', 'antenna', 'fotocellula', 'cancello', 'modulo', 'sartel', 'gewiss', 'bticino', 'vimar', 'hikvision']],
    ['Idraulica', ['valvola', 'tubo', 'raccordo', 'rubinetto', 'sifone', 'guarnizione', 'scarico', 'tubazione', 'canotto', 'flessibile']],
  ];
  for (const [categoria, parole] of gruppi) {
    if (parole.some(p => n.includes(p))) return categoria;
  }
  return fallback;
}

// R6 "wow, come le app di tutti i giorni": avatar colorato con iniziali per
// ogni cliente, invece di un cerchietto grigio uguale per tutti — stesso
// linguaggio visivo di WhatsApp/Rubrica, aiuta a riconoscere il cliente
// al volo scorrendo la lista, senza dover leggere ogni riga per intero.
function inizialiNome(nome) {
  return (nome || '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}
const AVATAR_COLORI = [
  'bg-blue-100 text-blue-700', 'bg-emerald-100 text-emerald-700', 'bg-amber-100 text-amber-700',
  'bg-rose-100 text-rose-700', 'bg-violet-100 text-violet-700', 'bg-cyan-100 text-cyan-700',
  'bg-orange-100 text-orange-700', 'bg-indigo-100 text-indigo-700',
];
function coloreAvatar(nome) {
  const s = nome || '';
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORI[hash % AVATAR_COLORI.length];
}

// R6 "stile carrello della spesa" (Amazon/Glovo, scelto da Denis/Deborah tra
// 3 esempi): ogni prodotto ha un'iconetta colorata per categoria invece di
// un pallino grigio uguale per tutti — aiuta a distinguere al volo cavi da
// tubi da lampadine scorrendo i risultati di ricerca.
function iconaCategoria(categoria) {
  if (categoria === 'Elettrico') return Zap;
  if (categoria === 'Idraulica') return Droplet;
  if (categoria === 'Illuminazione') return Lightbulb;
  if (categoria === 'Bagno') return Bath;
  if (categoria === 'Riscaldamento e clima') return Flame;
  return Package;
}
function coloreCategoria(categoria) {
  if (categoria === 'Elettrico') return 'bg-amber-50 text-amber-600';
  if (categoria === 'Idraulica') return 'bg-blue-50 text-blue-600';
  if (categoria === 'Illuminazione') return 'bg-yellow-50 text-yellow-600';
  if (categoria === 'Bagno') return 'bg-cyan-50 text-cyan-600';
  if (categoria === 'Riscaldamento e clima') return 'bg-orange-50 text-orange-600';
  return 'bg-slate-100 text-slate-500';
}

// ridimensiona e comprime una foto lato browser prima di caricarla, così
// non si riempie lo storage gratuito con immagini enormi dal telefono
function comprimiImmagine(file, maxLato = 900, qualita = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scala = Math.min(1, maxLato / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scala);
      canvas.height = Math.round(img.height * scala);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        blob ? resolve(blob) : reject(new Error('Compressione immagine fallita'));
      }, 'image/jpeg', qualita);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Immagine non valida')); };
    img.src = url;
  });
}

/* ============================================================ */
/* CODA OFFLINE — Denis lavora spesso in cantieri senza segnale.  */
/* Se una foto/documento/preventivo non riesce a salvarsi per la  */
/* rete, finisce qui (IndexedDB) invece di andare perso, e si     */
/* carica da solo alla riconnessione.                             */
/* ============================================================ */
const DB_OFFLINE_NOME = 'ferari_coda_offline';
const DB_OFFLINE_STORE = 'coda';

function apriDbOffline() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_OFFLINE_NOME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(DB_OFFLINE_STORE, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function accodaOffline(tipo, dati) {
  const db = await apriDbOffline();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readwrite');
    const req = tx.objectStore(DB_OFFLINE_STORE).add({ tipo, dati, creato: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  window.dispatchEvent(new Event('ferari-coda-offline'));
}

function leggiCodaOffline() {
  return apriDbOffline().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readonly');
    const req = tx.objectStore(DB_OFFLINE_STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

async function rimuoviDaCodaOffline(id) {
  const db = await apriDbOffline();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readwrite');
    const req = tx.objectStore(DB_OFFLINE_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
  window.dispatchEvent(new Event('ferari-coda-offline'));
}

// prova a svuotare la coda: si ferma al primo errore vero (rete ancora
// giù) lasciando il resto in coda per il prossimo tentativo
async function sincronizzaCodaOffline() {
  if (!navigator.onLine) return { fatti: 0 };
  let voci;
  try { voci = await leggiCodaOffline(); } catch (e) { return { fatti: 0 }; }
  let fatti = 0;
  for (const voce of voci) {
    try {
      if (voce.tipo === 'documento') {
        const { blob, nome, clienteId } = voce.dati;
        const path = `${clienteId}/${Date.now()}-${nome}`;
        const { error: upErr } = await sb.storage.from('documenti-cliente').upload(path, blob);
        if (upErr) throw upErr;
        const { error: insErr } = await sb.from('documenti').insert(documentoToRow({ clienteId, nome, storagePath: path }));
        if (insErr) throw insErr;
      } else if (voce.tipo === 'preventivo_foto') {
        const { preventivoId, clienteId, foto } = voce.dati;
        for (const f of foto) {
          const path = `${clienteId || 'senza-cliente'}/${Date.now()}-${f.tipo}.jpg`;
          const { error: upErr } = await sb.storage.from('cantiere-foto').upload(path, f.blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          const { error: insErr } = await sb.from('foto').insert(fotoToRow({ preventivoId, clienteId, zona: f.zona, tipo: f.tipo, storagePath: path }));
          if (insErr) throw insErr;
        }
      } else if (voce.tipo === 'preventivo') {
        const { modificaId, modificaDbId, payload, fotoPendenti } = voce.dati;
        let preventivoDbId = modificaDbId || null;
        if (modificaId) {
          const { error } = await sb.from('preventivi').update(preventivoToRow(payload)).eq('numero', modificaId);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from('preventivi').insert(preventivoToRow(payload)).select().single();
          if (error) throw error;
          preventivoDbId = data.id;
        }
        for (const f of (fotoPendenti || [])) {
          const path = `${payload.clienteId || 'senza-cliente'}/${Date.now()}-${f.tipo}.jpg`;
          const { error: upErr } = await sb.storage.from('cantiere-foto').upload(path, f.blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          await sb.from('foto').insert(fotoToRow({ preventivoId: preventivoDbId, clienteId: payload.clienteId, zona: f.zona, tipo: f.tipo, storagePath: path }));
        }
      }
      await rimuoviDaCodaOffline(voce.id);
      fatti++;
    } catch (err) {
      break; // rete caduta di nuovo o errore vero: riprova al prossimo giro
    }
  }
  return { fatti };
}

// hook globale: quanti elementi sono in attesa + stato connessione,
// con sync automatico alla riconnessione
function useCodaOffline() {
  const [count, setCount] = React.useState(0);
  const [online, setOnline] = React.useState(navigator.onLine);
  const [sincronizzando, setSincronizzando] = React.useState(false);
  const aggiorna = React.useCallback(() => {
    leggiCodaOffline().then(v => setCount(v.length)).catch(() => {});
  }, []);
  const sincronizzaOra = React.useCallback(async () => {
    setSincronizzando(true);
    const { fatti } = await sincronizzaCodaOffline();
    setSincronizzando(false);
    aggiorna();
    if (fatti > 0) window.location.reload();
  }, [aggiorna]);
  React.useEffect(() => {
    aggiorna();
    const onCoda = () => aggiorna();
    const onOnline = () => { setOnline(true); sincronizzaOra(); };
    const onOffline = () => setOnline(false);
    window.addEventListener('ferari-coda-offline', onCoda);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => {
      window.removeEventListener('ferari-coda-offline', onCoda);
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
    };
  }, [aggiorna, sincronizzaOra]);
  return { count, online, sincronizzando, sincronizzaOra };
}

function fotoFromRow(row) {
  return {
    id: row.id,
    preventivoId: row.preventivo_id,
    clienteId: row.cliente_id,
    zona: row.zona || 'generico',
    tipo: row.tipo,
    storagePath: row.storage_path,
    url: row.storage_path ? sb.storage.from('cantiere-foto').getPublicUrl(row.storage_path).data.publicUrl : null,
    creatoIl: row.creato_il,
  };
}

function fotoToRow(f) {
  const row = {};
  if (f.preventivoId !== undefined) row.preventivo_id = f.preventivoId;
  if (f.clienteId !== undefined) row.cliente_id = f.clienteId;
  if (f.zona !== undefined) row.zona = f.zona;
  if (f.tipo !== undefined) row.tipo = f.tipo;
  if (f.storagePath !== undefined) row.storage_path = f.storagePath;
  return row;
}

// P16: documenti/certificati allegati a un cliente (o a un preventivo)
function documentoFromRow(row) {
  return {
    id: row.id,
    clienteId: row.cliente_id,
    preventivoId: row.preventivo_id,
    nome: row.nome,
    storagePath: row.storage_path,
    url: row.storage_path ? sb.storage.from('documenti-cliente').getPublicUrl(row.storage_path).data.publicUrl : null,
    creatoIl: row.creato_il,
  };
}

function documentoToRow(d) {
  const row = {};
  if (d.clienteId !== undefined) row.cliente_id = d.clienteId;
  if (d.preventivoId !== undefined) row.preventivo_id = d.preventivoId;
  if (d.nome !== undefined) row.nome = d.nome;
  if (d.storagePath !== undefined) row.storage_path = d.storagePath;
  return row;
}

/* ============================================================
   ICONE SVG INLINE — sostituiscono lucide-react.
   Nessuna dipendenza esterna: cos� la pagina non pu� rompersi
   se un CDN non risponde o cambia il nome della variabile globale.
   ============================================================ */
function makeIcon(name, children) {
  const Icon = function (props) {
    const { className, size, strokeWidth, style, title, ...rest } = props || {};
    return React.createElement(
      'svg',
      Object.assign(
        {
          xmlns: 'http://www.w3.org/2000/svg',
          width: size || 24,
          height: size || 24,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: strokeWidth || 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: className || '',
          style: style,
          'aria-hidden': 'true'
        },
        rest
      ),
      children.map(function (c, i) {
        return React.createElement(c[0], Object.assign({ key: i }, c[1]));
      })
    );
  };
  Icon.displayName = name;
  return Icon;
}

// favicon / icona "aggiungi a schermata Home" -- usa il logo vero invece
// dell'icona blu generica del browser (Android legge il manifest, iOS
// legge apple-touch-icon; il manifest e' generato al volo come Blob per
// restare in un unico file, senza aggiungere un manifest.json separato).
// Il logo originale e' 160x160: Chrome/Android per l'installazione "vera"
// (non la scorciatoia generica) vuole icone dichiarate a 192x192 e 512x512,
// quindi le ridisegniamo al volo su canvas invece di lasciarle sgranate.
function ridisegnaIcona(base64, lato, conMargine) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = lato;
      canvas.height = lato;
      const ctx = canvas.getContext('2d');
      if (conMargine) {
        // Android/adaptive icon ritaglia in cerchio o squircle: senza un
        // margine il logo rischia di finire tagliato ai bordi
        ctx.fillStyle = '#12124E';
        ctx.fillRect(0, 0, lato, lato);
        const dentro = Math.round(lato * 0.7);
        const bordo = Math.round((lato - dentro) / 2);
        ctx.drawImage(img, bordo, bordo, dentro, dentro);
      } else {
        ctx.drawImage(img, 0, 0, lato, lato);
      }
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => resolve(base64);
    img.src = base64;
  });
}

async function iniettaIconaApp() {
  const link = (rel, href, type) => {
    const el = document.createElement('link');
    el.rel = rel;
    el.href = href;
    if (type) el.type = type;
    document.head.appendChild(el);
  };
  link('icon', LOGO_BASE64, 'image/png');
  link('apple-touch-icon', LOGO_BASE64);

  const [icona192, icona512, icona192Mask, icona512Mask] = await Promise.all([
    ridisegnaIcona(LOGO_BASE64, 192, false),
    ridisegnaIcona(LOGO_BASE64, 512, false),
    ridisegnaIcona(LOGO_BASE64, 192, true),
    ridisegnaIcona(LOGO_BASE64, 512, true),
  ]);
  const manifest = {
    id: '/',
    name: 'Ferari Impianti',
    short_name: 'Ferari',
    description: 'Preventivi, clienti e catalogo per il cantiere.',
    start_url: './',
    scope: './',
    display: 'standalone',

    orientation: 'portrait-primary',
    background_color: '#12124E',
    theme_color: '#12124E',
    lang: 'it',
    categories: ['business', 'productivity'],
    icons: [
      { src: icona192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icona512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: icona192Mask, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
      { src: icona512Mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  link('manifest', URL.createObjectURL(blob));
}

    const kmTxt = (item.km || 0).toLocaleString('it-IT');
    const prezzoTxt = (item.prezzoKmUsato || 0).toLocaleString('it-IT', { minimumFractionDigits: 2 });
    const totaleTxt = (item.prezzoUnitario || 0).toLocaleString('it-IT', { minimumFractionDigits: 2 });
    return `Trasferta — ${kmTxt} km × ${prezzoTxt} €/km = ${totaleTxt} €.`;
  }
  if (item.kind === 'lavoro') {
    const testo = item.nome.trim();
    const testoConMaiuscola = testo.charAt(0).toUpperCase() + testo.slice(1);
    return testoConMaiuscola.endsWith('.') ? testoConMaiuscola : testoConMaiuscola + '.';
  }
  if (item.kind === 'prodotto') {
    // FASE 4 raffinata — dicitura ricca come nei preventivi reali di Denis:
    // marca/fornitore, misure e la descrizione tecnica del prodotto.
    // R4 #13: via il "fornitura e posa in opera" davanti — ridondante ora
    // che il documento separa Materiale da Designazione lavori (R4 #14)
    const smontaggio = item.tipoInstallazione === 'sostituzione'
      ? `Smontaggio e smaltimento del vecchio ${item.nome.toLowerCase()}. `
      : '';
    // il fornitore NON entra mai nel nome/titolo mostrato — resta un campo/filtro
    // separato altrove (scheda prodotto, filtri catalogo), non nella dicitura
    let frase = item.nome;
    // quantità/unità in stampa solo per unità diverse da "pezzo" (litri, kg,
    // metri...) — un "1 pz" sottinteso non serve, ma "5 litri" sì (segnalato
    // da Denis: senza, il cliente non sa quanto Sentinel viene fornito)
    if (item.unita && item.unita !== 'pz') {
      frase += ` (${item.qty} ${item.unita})`;
    }
    if (item.misuraLunghezza || item.misuraProfondita || item.misuraAltezza) {
      frase += `, misure ${item.misuraLunghezza || '–'}×${item.misuraProfondita || '–'}×${item.misuraAltezza || '–'} cm`;
    }
    frase += '.';
    if (item.descrizioneProdotto && item.descrizioneProdotto.trim()) {
      const desc = item.descrizioneProdotto.trim();
      frase += ' ' + (desc.endsWith('.') ? desc : desc + '.');
    }
    return smontaggio + frase;
  }
  if (item.kind === 'materiale' && item.unita) {
    const manodopera = manodoperaPerMateriale(item.nome);
    return manodopera
      ? `${manodopera} di ${item.nome.toLowerCase()} (${item.qty} ${item.unita}).`
      : `${item.nome} (${item.qty} ${item.unita}).`;
  }
  return `${item.nome}.`;
}

// R3 #6: elenco nell'ordine scelto da Denis (quello del carrello, che parte
// già dall'ordine in cui ha aggiunto le voci — smontaggio+prodotto+manodopera
// vicini se li ha inseriti in sequenza — e può trascinare per aggiustare).
// Non più raggruppato per categoria: un lavoro reale resta un blocco unico
// invece di essere spezzato su sezioni diverse del documento.
function elencoOrdinato(carrello, diciture) {
  return carrello.map(item => {
    const override = diciture[item.id] || {};
    const testo = override.testo !== undefined ? override.testo : dicituraDefaultVoce(item);
    return { item, testo };
  });
}

function loadJsPDF() {
  return new Promise((resolve, reject) => {
    if (window.jspdf) { resolve(window.jspdf.jsPDF); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => resolve(window.jspdf.jsPDF);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

const MARGINE_BASSO = 262; // oltre questa y si passa a una nuova pagina

async function generaPDFCliente({ cliente, carrello, diciture, totale, nextId, logoB64, modalita = 'scarica' }) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

  addHeaderCliente(doc, logoB64, nextId);

  let y = 74;

  const nuovaPaginaSeServe = (spazioNecessario) => {
    if (y + spazioNecessario > MARGINE_BASSO) {
      doc.addPage();
      y = 20;
    }
  };

  // anteprima cliente — nome e indirizzo vanno a capo se troppo lunghi
  // (es. indirizzo completo preso dall'autocomplete), invece di sconfinare
  // fuori dal riquadro come segnalato dal cliente.
  // R4 #8: se c'è residenza distinta, la mostriamo sotto il nome (CLIENTE),
  // mentre a destra resta sempre il cantiere.
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
  const testoClienteSx = cliente.indirizzoResidenza
    ? `${cliente.nome}\n${cliente.indirizzoResidenza}`
    : cliente.nome;
  const righeNomeCliente = doc.splitTextToSize(testoClienteSx, 78);
  const righeIndirizzoCliente = doc.splitTextToSize(cliente.indirizzo || '', 78);
  const righeMaxCliente = Math.max(righeNomeCliente.length, righeIndirizzoCliente.length, 1);
  const altezzaBoxCliente = Math.max(20, 13 + (righeMaxCliente - 1) * 4.5 + 7);
  doc.setFillColor(243, 244, 246);
  doc.roundedRect(12, y, 186, altezzaBoxCliente, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...SLATE5);
  doc.text('CLIENTE', 20, y+5);
  doc.text('CANTIERE', 110, y+5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...SLATE9);
  doc.text(righeNomeCliente, 20, y+13);
  doc.text(righeIndirizzoCliente, 110, y+13);
  y += altezzaBoxCliente + 6;

  // R4 #14: due sezioni distinte — Materiale e Designazione lavori — invece
  // di un'unica lista mescolata. R4 #12: la trasferta non compare mai qui,
  // resta comunque nel totale (e visibile nel PDF interno).
  const rigaSezione = (titolo) => {
    doc.setFillColor(...NAVY);
    doc.roundedRect(12, y, 186, 8, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
    doc.text(titolo, 20, y+5.5);
    y += 13;
  };
  const righeCorpo = elencoOrdinato(carrello, diciture || {}).filter(({ item }) => item.kind !== 'trasferta');
  const righeMateriale = righeCorpo.filter(({ item }) => item.kind === 'materiale' || item.kind === 'prodotto');
  const righeLavori = righeCorpo.filter(({ item }) => item.kind === 'lavoro');

  // corpo — voci nell'ordine scelto da Denis (frecce su/giù), niente prezzi,
  // niente più sezioni per categoria tecnica: un lavoro reale (smontaggio+
  // prodotto) resta un blocco unico invece di essere spezzato.
  // BUG URGENTE (trovato dal PDF vero scaricato da Denis): "rigaSezione"
  // imposta il testo bianco per scrivere sulla barra blu scura, ma non lo
  // rimetteva mai grigio dopo — le righe sotto restavano bianco su bianco,
  // quindi invisibili nel PDF anche se il contenuto c'era davvero (l'anteprima
  // in-app non usa questi colori jsPDF, per questo sembrava tutto a posto lì).
  const corpoNormale = () => { doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(80, 85, 92); };
  corpoNormale();
  if (righeMateriale.length > 0) {
    rigaSezione('MATERIALE');
    corpoNormale();
    righeMateriale.forEach(({ testo }) => {
      const lines = doc.splitTextToSize(`• ${testo}`, 182);
      nuovaPaginaSeServe(lines.length * 4.5);
      corpoNormale();
      doc.text(lines, 15, y);
      y += lines.length * 4.5;
    });
    y += 3;
  }
  if (righeLavori.length > 0) {
    nuovaPaginaSeServe(13);
    rigaSezione('DESIGNAZIONE LAVORI');
    corpoNormale();
    righeLavori.forEach(({ testo }) => {
      const lines = doc.splitTextToSize(`• ${testo}`, 182);
      nuovaPaginaSeServe(lines.length * 4.5);
      corpoNormale();
      doc.text(lines, 15, y);
      y += lines.length * 4.5;
    });
    y += 3;
  }

  nuovaPaginaSeServe(30);

  // IVA non esposta
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('IVA NON ESPOSTA', 105, y, { align:'center' }); y += 6;

  // box totale
  doc.setFillColor(...NAVY);
  doc.roundedRect(12, y, 186, 16, 3, 3, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...WHITE);
  doc.text('TOTALE', 20, y+10);
  doc.setFontSize(16);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 198, y+10, { align:'right' });
  y += 22;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('IL TOTALE COMPRENDE MATERIALE E MANODOPERA', 105, y, { align:'center' });

  const totalePagine = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalePagine; i++) {
    doc.setPage(i);
    addFooterCliente(doc, i, totalePagine);
  }

  // R7 (chiesto da Denis): scelta esplicita "Scarica" o "Invia direttamente",
  // niente più decisione automatica in base al dispositivo — prima capitava
  // che si aprisse da sola la condivisione anche quando si voleva solo
  // scaricare il file, o viceversa.
  const nomeFile = `Preventivo_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`;
  const blob = doc.output('blob');
  if (modalita === 'condividi') {
    const file = new File([blob], nomeFile, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: `Preventivo ${nextId}`,
          text: `Preventivo per ${cliente.nome} — Ferari Impianti`,
        });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // Denis ha annullato la condivisione
        // altrimenti scarica comunque qui sotto, come ripiego
      }
    } else {
      mostraToast('Condivisione non disponibile su questo dispositivo, ho scaricato il PDF.', 'info');
    }
  }
  doc.save(nomeFile);
}

async function generaPDFInterno({ cliente, carrello, subMat, subProd, subLavoro, rincaro, totale, rincaroMode, rPct, rOre, rTar, nextId }) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

  // Header interno — sfondo grigio scuro
  doc.setFillColor(...SLATE9);
  doc.rect(0, 0, 210, 22, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...WHITE);
  doc.text('LISTA MATERIALI DA ORDINARE', 12, 10);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(180, 185, 190);
  doc.text('USO INTERNO — NON INVIARE AL CLIENTE', 12, 16);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
  doc.text(nextId, 198, 10, { align:'right' });
  doc.text(oggiData(), 198, 16, { align:'right' });

  let y = 30;

  // info cliente
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
  doc.text(`Cliente: ${cliente.nome}`, 12, y);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...SLATE5);
  doc.text(`Cantiere: ${cliente.indirizzo}`, 12, y+5);
  if (cliente.indirizzoResidenza) {
    doc.text(`Residenza: ${cliente.indirizzoResidenza}`, 12, y+10);
    y += 5;
  }
  y += 12;

  const disegnaIntestazioneTabella = () => {
    doc.setFillColor(243, 244, 246);
    doc.rect(12, y, 186, 7, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...SLATE5);
    doc.text('MATERIALE', 15, y+5);
    doc.text('QTÀ / UNITÀ', 105, y+5);
    doc.text('P. UNITARIO', 145, y+5);
    doc.text('TOTALE', 195, y+5, { align:'right' });
    y += 10;
  };
  disegnaIntestazioneTabella();

  // righe materiali — il nome (o la voce di lavoro, che può essere una frase
  // intera scritta da Denis) va spezzato su più righe se non entra nella
  // colonna, altrimenti sconfina sopra QTÀ/UNITÀ e P.UNITARIO
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  carrello.forEach((item, i) => {
    const righeNome = doc.splitTextToSize(item.nome, 86);
    const altezzaRiga = Math.max(7, righeNome.length * 4 + 3);
    if (y + altezzaRiga > MARGINE_BASSO) {
      doc.addPage();
      y = 20;
      disegnaIntestazioneTabella();
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    }
    if (i % 2 === 1) { doc.setFillColor(249,250,251); doc.rect(12, y-4, 186, altezzaRiga, 'F'); }
    doc.setTextColor(...SLATE9);
    doc.text(righeNome, 15, y);
    doc.setTextColor(...SLATE5);
    doc.text(item.meta, 105, y);
    doc.text(fmtEuro2(item.prezzoUnitario), 145, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(...SLATE9);
    doc.text(fmtEuro2(item.prezzoUnitario * item.qty), 195, y, { align:'right' });
    doc.setFont('helvetica','normal');
    y += altezzaRiga;
  });

  if (carrello.length === 0) {
    doc.setTextColor(...SLATE5);
    doc.text('Nessuna voce aggiunta.', 105, y, { align:'center' });
    y += 7;
  }

  // subtotali + box totale: se non entrano più nella pagina corrente
  // (lista lunga, righe spezzate su più righe), si passa a una nuova pagina
  // invece di sconfinare fuori dal foglio
  const rows = [
    ['Subtotale materiali + prodotti', fmtEuro2(subMat + subProd)],
    ...(subLavoro > 0 ? [['Voci di lavoro', fmtEuro2(subLavoro)]] : []),
    [rincaroMode === 'percent' ? `Manodopera (${rPct}% sui materiali)` : `Manodopera (${rOre}h × ${rTar} €/h)`, fmtEuro2(rincaro)],
  ];
  const spazioFinale = 8 + rows.length * 7 + 2 + 14;
  if (y + spazioFinale > MARGINE_BASSO) {
    doc.addPage();
    y = 20;
  } else {
    y += 3;
    // linea separatrice
    doc.setDrawColor(...SLATE3); doc.setLineWidth(0.3);
    doc.line(12, y, 198, y); y += 5;
  }

  rows.forEach(([label, value]) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SLATE5);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...SLATE9);
    doc.text(value, 195, y, { align:'right' });
    y += 7;
  });

  y += 2;
  // box totale reale
  doc.setFillColor(...SLATE9);
  doc.roundedRect(12, y, 186, 14, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...WHITE);
  doc.text('TOTALE REALE', 20, y+9);
  doc.setFontSize(14);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 195, y+9, { align:'right' });

  doc.save(`Interno_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`);
}

function LoginPage() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [accessoInCorso, setAccessoInCorso] = useState(false);
  const [erroreAccesso, setErroreAccesso] = useState('');
  const [modalitaReset, setModalitaReset] = useState(false);
  const [resetEmail, setResetEmail] = useState('');
  const [resetInviato, setResetInviato] = useState(false);
  const [resetInCorso, setResetInCorso] = useState(false);
  const [erroreReset, setErroreReset] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setAccessoInCorso(true);
    setErroreAccesso('');
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setAccessoInCorso(false);
    if (error) {
      setErroreAccesso('Email o password non corrette.');
    }
    // se l'accesso riesce, App si accorge del cambio sessione da solo
  };

  const handleReset = async (e) => {
    e.preventDefault();
    setResetInCorso(true);
    setErroreReset('');
    const { error } = await sb.auth.resetPasswordForEmail(resetEmail.trim(), {
      redirectTo: window.location.href.split('#')[0],
    });
    setResetInCorso(false);
    if (error) {
      setErroreReset('Non sono riuscito a inviare l’email: ' + error.message);
      return;
    }
    setResetInviato(true);
  };

  if (modalitaReset) {
    return (
      <div className="min-h-[100svh] lg:min-h-screen bg-[#10133a] flex flex-col">
        <div className="flex-1 flex flex-col items-center justify-center px-6 pt-[max(2rem,env(safe-area-inset-top))] pb-8 lg:pb-0">
          <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-20 h-20 rounded-2xl shadow-2xl shadow-black/30 mb-5" />
          <h1 className="text-2xl font-bold text-white tracking-tight">Ferari Impianti</h1>
          <p className="text-sm text-white/60 mt-1.5">Gestionale preventivi</p>
        </div>

        <div className="bg-white rounded-t-[1.75rem] lg:rounded-2xl px-6 pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] lg:pb-6 shadow-[0_-8px_40px_rgba(0,0,0,0.18)] lg:shadow-sm w-full max-w-sm mx-auto lg:my-auto lg:mb-8">
          {resetInviato ? (
            <>
              <p className="text-base font-semibold text-slate-900 mb-2">Controlla la tua email</p>
              <p className="text-sm text-slate-500 leading-relaxed">
                Ti abbiamo inviato un link per reimpostare la password a <strong>{resetEmail}</strong>. Aprilo per scegliere una nuova password.
              </p>
              <button
                type="button"
                onClick={() => { setModalitaReset(false); setResetInviato(false); }}
                className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform"
              >
                Torna al login
              </button>
            </>
          ) : (
            <form onSubmit={handleReset}>
              <p className="text-base font-semibold text-slate-900 mb-1">Password dimenticata?</p>
              <p className="text-sm text-slate-500 mb-5">Inserisci la tua email: ti mandiamo un link per sceglierne una nuova.</p>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Email</label>
              <div className="relative">
                <Mail className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                <input
                  type="email"
                  value={resetEmail}
                  onChange={(e) => setResetEmail(e.target.value)}
                  placeholder="nome@ferariimpianti.it"
                  className="app-input w-full pl-10 pr-3 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                  required
                />
              </div>
              {erroreReset && <p className="text-xs text-red-500 font-medium mt-3">{erroreReset}</p>}
              <button
                type="submit"
                disabled={resetInCorso}
                className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform disabled:opacity-60"
              >
                {resetInCorso ? 'Invio...' : 'Invia link di reset'}
              </button>
              <button
                type="button"
                onClick={() => setModalitaReset(false)}
                className="w-full mt-3 text-slate-400 text-sm py-2"
              >
                Torna al login
              </button>
            </form>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-[100svh] lg:min-h-screen bg-[#10133a] flex flex-col">
      <div className="flex-1 flex flex-col items-center justify-center px-6 pt-[max(2rem,env(safe-area-inset-top))] pb-8 lg:pb-0">
        <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-20 h-20 rounded-2xl shadow-2xl shadow-black/30 mb-5" />
        <h1 className="text-2xl font-bold text-white tracking-tight">Ferari Impianti</h1>
        <p className="text-sm text-white/60 mt-1.5">Gestionale preventivi</p>
      </div>

      <form onSubmit={handleSubmit} className="bg-white rounded-t-[1.75rem] lg:rounded-2xl px-6 pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] lg:pb-6 shadow-[0_-8px_40px_rgba(0,0,0,0.18)] lg:shadow-sm w-full max-w-sm mx-auto lg:my-auto lg:mb-8">
        <p className="text-base font-semibold text-slate-900 mb-5">Accedi</p>
        <div className="space-y-4">
          <div>
            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Email</label>
            <div className="relative">
              <Mail className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="nome@ferariimpianti.it"
                className="app-input w-full pl-10 pr-3 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                required
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Password</label>
            <div className="relative">
              <Lock className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
              <input
                type={showPassword ? 'text' : 'password'}
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••"
                className="app-input w-full pl-10 pr-10 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                required
              />
              <button
                type="button"
                onClick={() => setShowPassword(!showPassword)}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 p-1"
              >
                {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
              </button>
            </div>
          </div>

          <div className="flex items-center justify-between text-xs pt-1">
            <label className="flex items-center gap-2 text-slate-500">
              <input type="checkbox" className="rounded border-slate-300 text-blue-600 w-4 h-4" />
              Ricordami
            </label>
            <button type="button" onClick={() => { setModalitaReset(true); setResetEmail(email); }} className="text-blue-600 font-semibold">Password dimenticata?</button>
          </div>

          {erroreAccesso && <p className="text-xs text-red-500 font-medium">{erroreAccesso}</p>}
        </div>

        <button
          type="submit"
          disabled={accessoInCorso}
          className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform flex items-center justify-center gap-2 shadow-lg shadow-[#10133a]/20 disabled:opacity-60"
        >
          {accessoInCorso ? 'Accesso...' : 'Entra nell’app'}
          {!accessoInCorso && <ChevronRight className="w-4 h-4" />}
        </button>

        <p className="text-center text-[11px] text-slate-400 mt-5">v1.0 · Ferari Impianti S.r.l.</p>
      </form>
    </div>
  );
}

function ImpostaNuovaPasswordPage({ onCompletato }) {
  const [password, setPassword] = useState('');
  const [conferma, setConferma] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [errore, setErrore] = useState('');
  const [fatto, setFatto] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setErrore('');
    if (password.length < 6) {
      setErrore('La password deve avere almeno 6 caratteri.');
      return;
    }
    if (password !== conferma) {
      setErrore('Le due password non coincidono.');
      return;
    }
    setSalvando(true);
    const { error } = await sb.auth.updateUser({ password });
    setSalvando(false);
    if (error) {
      setErrore('Non sono riuscito a salvare la password: ' + error.message);
      return;
    }
    setFatto(true);
  };

  return (
    <div className="min-h-[100svh] lg:min-h-screen bg-[#10133a] flex flex-col">
      <div className="flex-1 flex flex-col items-center justify-center px-6 pt-[max(2rem,env(safe-area-inset-top))] pb-8 lg:pb-0">
        <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-20 h-20 rounded-2xl shadow-2xl shadow-black/30 mb-5" />
        <h1 className="text-2xl font-bold text-white tracking-tight">Ferari Impianti</h1>
        <p className="text-sm text-white/60 mt-1.5">Gestionale preventivi</p>
      </div>

      <div className="bg-white rounded-t-[1.75rem] lg:rounded-2xl px-6 pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] lg:pb-6 shadow-[0_-8px_40px_rgba(0,0,0,0.18)] lg:shadow-sm w-full max-w-sm mx-auto lg:my-auto lg:mb-8">
        {fatto ? (
          <>
            <p className="text-base font-semibold text-slate-900 mb-2">Password aggiornata</p>
            <p className="text-sm text-slate-500 leading-relaxed">La tua nuova password è attiva. Ora puoi entrare nell'app.</p>
            <button
              type="button"
              onClick={onCompletato}
              className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform"
            >
              Vai all'app
            </button>
          </>
        ) : (
          <form onSubmit={handleSubmit}>
            <p className="text-base font-semibold text-slate-900 mb-1">Scegli una nuova password</p>
            <p className="text-sm text-slate-500 mb-5">Ultimo passaggio: imposta la password che userai da ora in poi.</p>
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Nuova password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="app-input w-full px-3.5 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Conferma password</label>
                <input
                  type="password"
                  value={conferma}
                  onChange={(e) => setConferma(e.target.value)}
                  placeholder="••••••••"
                  className="app-input w-full px-3.5 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                  required
                />
              </div>
            </div>
            {errore && <p className="text-xs text-red-500 font-medium mt-3">{errore}</p>}
            <button
              type="submit"
              disabled={salvando}
              className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform disabled:opacity-60"
            >
              {salvando ? 'Salvo...' : 'Salva nuova password'}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

/* preventivi in evidenza, il resto (sempre a 0) nascosto sotto   */

function StatoPill({ stato, conteggio, attivo, onClick }) {
  return (
    <button
      type="button"
      onClick={onClick}
      className={`flex items-center gap-1.5 pl-2.5 pr-3 py-1.5 rounded-full text-xs font-semibold transition-all ${statoStyle[stato]} ${
        attivo ? 'outline outline-2 outline-offset-1 outline-blue-500' : ''
      }`}
    >
      <span className="font-bold">{conteggio}</span>
      {stato}
    </button>
  );
}

function StatoBreakdown({ preventivi, statoFiltro, setStatoFiltro }) {
  const [espanso, setEspanso] = useState(false);
  const stati = Object.keys(statoStyle);
  const conteggi = stati.map(stato => ({ stato, conteggio: preventivi.filter(p => p.stato === stato).length }));
  const attivi = conteggi.filter(s => s.conteggio > 0);
  const vuoti = conteggi.filter(s => s.conteggio === 0);

  return (
    <div className="app-card p-4 lg:p-5">
      <div className="flex items-center gap-2 flex-wrap">
        {attivi.length === 0 && <p className="text-xs text-slate-400">Nessun preventivo ancora.</p>}
        {attivi.map(s => (
          <StatoPill key={s.stato} {...s} attivo={statoFiltro === s.stato} onClick={() => setStatoFiltro(statoFiltro === s.stato ? null : s.stato)} />
        ))}
        {vuoti.length > 0 && (
          <button
            type="button"
            onClick={() => setEspanso(!espanso)}
            className="flex items-center gap-1 pl-2.5 pr-2 py-1.5 rounded-full text-xs font-medium text-slate-400 border border-slate-200 hover:bg-slate-50 transition-colors"
          >
            Altri stati ({vuoti.length})
            <ChevronRight className={`w-3 h-3 transition-transform ${espanso ? 'rotate-90' : ''}`} />
          </button>
        )}
      </div>
      {espanso && vuoti.length > 0 && (
        <div className="flex items-center gap-2 flex-wrap mt-2 pt-2 border-t border-slate-100">
          {vuoti.map(s => (
            <StatoPill key={s.stato} {...s} attivo={statoFiltro === s.stato} onClick={() => setStatoFiltro(statoFiltro === s.stato ? null : s.stato)} />
          ))}
        </div>
      )}
    </div>
  );
}

                <td className="px-5 py-3.5 font-mono text-xs text-slate-500">{p.id}</td>
                <td className="px-5 py-3.5 font-medium text-slate-900">{p.cliente}</td>
