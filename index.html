    return () => onLayoutChange({ hideNav: false, hideTopbar: false, padComposer: false });
  }, [mode, clienteId, onLayoutChange]);

  const subtotaleMateriali = carrello.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleProdotti = carrello.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleLavoro = carrello.filter(i => i.kind === 'lavoro').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleTrasferta = carrello.filter(i => i.kind === 'trasferta').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  // % manodopera su materiali+prodotti (dopo unificazione R4: tutto è "prodotto")
  const rincaroValore = rincaroMode === 'percent'
    ? (subtotaleMateriali + subtotaleProdotti) * ((parseFloat(rincaroPercent) || 0) / 100)
    : (parseFloat(rincaroOre) || 0) * (parseFloat(rincaroTariffa) || 0);
  const totale = subtotaleMateriali + subtotaleProdotti + subtotaleLavoro + subtotaleTrasferta + rincaroValore;

  // R3 #1: la riga "Trasferta" nel carrello si aggiorna da sola in base ai km
  // e al prezzo al km impostato — un solo item fisso (id 'trasferta'), non se
  // ne accumulano di duplicati cambiando i km
  React.useEffect(() => {
    const km = parseFloat((kmTrasferta || '0').replace(',', '.')) || 0;
    const prezzo = parseFloat((prezzoKm || '0').replace(',', '.')) || 0;
    const costo = Math.round(km * prezzo * 100) / 100;
    setCarrello(prev => {
      const esiste = prev.find(i => i.id === 'trasferta');
      if (km <= 0) {
        return esiste ? prev.filter(i => i.id !== 'trasferta') : prev;
      }
      const voce = {
        id: 'trasferta', kind: 'trasferta', qty: 1, zona: 'generico',
        nome: 'Trasferta',
        meta: `${kmTrasferta} km × ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €/km`,
        prezzoUnitario: costo,
        categoriaDocumento: 'TRASFERTA E ALTRI COSTI',
        km, prezzoKmUsato: prezzo,
      };
      if (esiste && esiste.prezzoUnitario === costo && esiste.meta === voce.meta) return prev;
      return esiste ? prev.map(i => i.id === 'trasferta' ? voce : i) : [...prev, voce];
    });
  }, [kmTrasferta, prezzoKm]);

  // R6 "ultra rapido/wow": i prodotti più usati nei preventivi reali già
  // fatti — un tocco solo, senza cercare, per quelli che tornano sempre
  // (placche, prese, tubi...). Calcolato dai preventivi veri, non a caso.
  const prodottiPiuUsati = (() => {
    const conteggio = {};
    preventivi.forEach(p => (p.carrelloSnapshot || []).forEach(i => {
      if (i.kind === 'prodotto') conteggio[i.id] = (conteggio[i.id] || 0) + 1;
    }));
    return Object.entries(conteggio)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([id]) => prodotti.find(p => p.id === id))
      .filter(Boolean);
  })();

  // catalogo prodotti nel costruttore preventivo — stessa navigazione a
  // cartelle + ricerca del Catalogo vero e proprio, ma con "+ Aggiungi" invece
  // di modifica inline, e filtrato per la zona attiva
  const prodottiZonaCategoria = prodotti.filter(p => p.categoria === activeCat && visibileInZona(p, zonaAttiva));
  const sottocategorieCatalogoPreventivo = ['Tutte', ...new Set(prodottiZonaCategoria.map(p => p.sottocategoria).filter(Boolean))];
  const ricercaCatalogoAttiva = queryCatalogoPreventivo.trim().length > 0;
  const risultatiRicercaCatalogoPreventivo = ricercaCatalogoAttiva
    ? prodotti.filter(p => visibileInZona(p, zonaAttiva) && corrispondeRicerca(
        [p.nome, p.codice, p.descrizione, p.sottocategoria, p.categoria, p.fornitore].join(' '),
        queryCatalogoPreventivo
      ))
    : [];
  const mostraCartelleCatalogoPreventivo = !ricercaCatalogoAttiva && activeSubCatalogo === 'Tutte' && sottocategorieCatalogoPreventivo.length > 1;
  const conteggioSottocategorieCatalogoPreventivo = sottocategorieCatalogoPreventivo
    .filter(s => s !== 'Tutte')
    .map(sub => ({ nome: sub, count: prodottiZonaCategoria.filter(p => p.sottocategoria === sub).length }));
  const prodottiCatalogoPreventivo = ricercaCatalogoAttiva
    ? risultatiRicercaCatalogoPreventivo
    : prodottiZonaCategoria.filter(p => activeSubCatalogo === 'Tutte' || p.sottocategoria === activeSubCatalogo);
  const prodottiCatalogoTecnici = prodottiCatalogoPreventivo.filter(p => p.categoria !== 'Bagno');
  const prodottiCatalogoBagno = prodottiCatalogoPreventivo.filter(p => p.categoria === 'Bagno');

  // R4: ci possono essere più bozze in corso (una per cliente) — qui non
  // sappiamo ancora quale cliente sceglierà, quindi si riparte dalla
  // schermata di selezione cliente, dove le bozze in sospeso sono elencate
  // e si può riprenderne una con un tocco
  // Nuovo preventivo resta DENTRO Preventivi (picker cliente moderno sotto)
  const startNuovo = () => {
    resetBozzaVuota();
  };

  // sceglie un cliente esistente dalla lista di ricerca — se aveva già una
  // bozza in corso la ripristina, invece di ripartire da zero
  const selezionaCliente = (c) => {
    if (duplicaPendente) {
      setClienteId(c.id);
      setCarrello(duplicaPendente.carrello);
      setDiciture(duplicaPendente.diciture);
      setZonaAttiva(duplicaPendente.zonaAttiva);
      setRincaroMode(duplicaPendente.rincaroMode);
      setRincaroPercent(duplicaPendente.rincaroPercent);
      setRincaroOre(duplicaPendente.rincaroOre);
      setRincaroTariffa(duplicaPendente.rincaroTariffa);
      setDuplicaPendente(null);
      setModoRapido(true);
      setRapidoExtra(null);
      setWizardStep(2);
      return;
    }
    const bozza = leggiBozzaCliente(c.id);
    if (bozza) {
      ripristinaBozza(bozza);
      setModoRapido(true);
      setRapidoExtra(null);
      setWizardStep(2);
      return;
    }
    setClienteId(c.id);
    setModoRapido(true);
    setRapidoExtra(null);
    setWizardStep(2);
  };

  // avvia una nuova bozza vuota ma con dentro le voci di un preventivo già
  // fatto, come punto di partenza — chiede solo il cliente, poi tutto il
  // resto (materiale, lavori, rincaro) è già pronto da aggiustare
  const duplicaPreventivo = (p) => {
    setDuplicaPendente({
      carrello: (p.carrelloSnapshot || []).map(item => ({ ...item })),
      diciture: JSON.parse(JSON.stringify(p.diciture || {})),
      zonaAttiva: (p.zone && p.zone[0]) || 'generico',
      rincaroMode: 'percent',
      rincaroPercent: '10',
      rincaroOre: '8',
      rincaroTariffa: '35',
    });
    setModificaId(null);
    setModificaDbId(null);
    setClienteId(null);
    setFotoCantiere([]);
    setKmTrasferta('');
    setClienteSearch('');
    setWizardStep(1);
    setMode('nuovo');
  };

  const resetBozzaVuota = () => {
    setModificaId(null);
    setModificaDbId(null);
    setClienteId(null);
    setCarrello([]);
    setRincaroMode('percent');
    setRincaroPercent('10');
    setRincaroOre('8');
    setRincaroTariffa('35');
    setKmTrasferta('');
    setZonaAttiva('generico');
    setFotoCantiere([]);
    setClienteSearch('');
    setDiciture({});
    setModoRapido(true);
    setRapidoExtra(null);
    setWizardStep(1);
    setMode('nuovo');
  };

  const scartaBozza = () => {
    if (!window.confirm('Scartare questa bozza non salvata? Non si può annullare.')) return;
    if (clienteId) cancellaBozzaCliente(clienteId);
    resetBozzaVuota();
  };

  // apre un preventivo esistente nello stesso costruttore usato per crearne
  // uno nuovo, così si possono cambiare voci/materiali/zone, e ricarica le
  // foto già salvate per questo preventivo
  const iniziaModifica = async (p) => {
    // R4 #1: se questa stessa modifica era rimasta a metà (bozza più recente
    // di quanto già salvato su Supabase), riprendiamo da lì
    const bozza = leggiBozzaCliente(p.clienteId);
    if (bozza && bozza.modificaId === p.id) {
      ripristinaBozza(bozza);
      return;
    }
    setModificaId(p.id);
    setModificaDbId(p.dbId);
    setClienteId(p.clienteId);
    setCarrello(p.carrelloSnapshot || []);
    // ripristina i km della trasferta salvata, altrimenti l'effetto che la
    // tiene sincronizzata la cancellerebbe subito (km vuoto = nessuna trasferta)
    const trasfertaSalvata = (p.carrelloSnapshot || []).find(i => i.kind === 'trasferta');
    setKmTrasferta(trasfertaSalvata ? String(trasfertaSalvata.km).replace('.', ',') : '');
    setZonaAttiva((p.zone && p.zone[0]) || 'generico');
    setFotoCantiere([]);
    setDiciture(p.diciture || {});
    setModoRapido(true);
    setRapidoExtra(null);
    setWizardStep(2);
    setMode('nuovo');
    if (p.dbId) {
      const { data, error } = await sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true });
      if (!error && data) setFotoCantiere(data.map(fotoFromRow));
    }
  };

  // R2 #7: voce di lavoro/manodopera libera con categoria — se non esiste già
  // nel mini-catalogo riutilizzabile la salviamo lì (Supabase), così Denis la
  // ritrova scorrendo/cercando la prossima volta invece di riscriverla
  const aggiungiVoceLavoro = async () => {
    const descrizione = lavoroDescrizione.trim();
    if (!descrizione) return;
    const prezzo = parseFloat((lavoroPrezzo || '0').replace(',', '.')) || 0;
    const categoria = lavoroCategoria;
    setCarrello(prev => [...prev, {
      id: 'lavoro-' + Date.now(),
      nome: descrizione,
      meta: prezzo > 0 ? `Lavoro · ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
      prezzoUnitario: prezzo, qty: 1, kind: 'lavoro', zona: zonaAttiva, categoriaDocumento: categoria,
    }]);
    const giaSalvata = vociLavoro.find(v => v.nome.trim().toLowerCase() === descrizione.toLowerCase());
    if (!giaSalvata) {
      const { data, error } = await sb.from('voci_lavoro')
        .insert(voceLavoroToRow({ nome: descrizione, categoria, prezzo }))
        .select().single();
      if (!error && data) setVociLavoro(prev => [...prev, voceLavoroFromRow(data)].sort((a, b) => a.nome.localeCompare(b.nome)));
    }
    setLavoroDescrizione('');
    setLavoroPrezzo('');
    setShowNuovoLavoro(false);
  };

  // R2 #7: riusa una voce già salvata nel mini-catalogo, senza riscriverla
  const aggiungiVoceSalvata = (v) => {
    setCarrello(prev => [...prev, {
      id: 'lavoro-' + Date.now(),
      nome: v.nome,
      meta: v.prezzo > 0 ? `Lavoro · ${v.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
      prezzoUnitario: v.prezzo, qty: 1, kind: 'lavoro', zona: zonaAttiva, categoriaDocumento: v.categoria,
    }]);
    setQueryLavoro('');
  };

  // R2 #4: una voce di lavoro già aggiunta è modificabile (testo e prezzo),
  // non solo eliminabile e da riscrivere da capo
  const startEditLavoro = (item) => {
    setEditingLavoroId(item.id);
    setEditLavoroDescrizione(item.nome);
    setEditLavoroPrezzo(item.prezzoUnitario ? item.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 }) : '');
  };

  const confirmEditLavoro = (id) => {
    const descrizione = editLavoroDescrizione.trim();
    setEditingLavoroId(null);
    if (!descrizione) return;
    const prezzo = parseFloat((editLavoroPrezzo || '0').replace(',', '.')) || 0;
    setCarrello(prev => prev.map(i => i.id === id ? {
      ...i, nome: descrizione, prezzoUnitario: prezzo,
      meta: prezzo > 0 ? `Lavoro · ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
    } : i));
  };

  // vale per qualunque unità diversa da "pezzo" (metri, litri, kg...) — non
  // solo per i cavi al metro come all'inizio, stesso meccanismo riusato
  const metaProdotto = (p, qty) => (p.unita && p.unita !== 'pz')
    ? `${qty} ${p.unita} × ${p.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`
    : p.tier;

  const toggleProdotto = (p) => {
    const exists = carrello.find(i => i.id === p.id);
    if (exists) {
      setCarrello(carrello.filter(i => i.id !== p.id));
    } else {
      setCarrello([...carrello, {
        id: p.id, nome: p.nome, meta: metaProdotto(p, 1), prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto',
        unita: p.unita, zona: zonaAttiva, tipoInstallazione: 'nuova',
        // portati nel carrello per generare una dicitura ricca nel documento (FASE 4)
        fornitore: p.fornitore, misuraLunghezza: p.misuraLunghezza, misuraProfondita: p.misuraProfondita,
        misuraAltezza: p.misuraAltezza, descrizioneProdotto: p.descrizione,
      }]);
    }
  };

  // R7: crea un prodotto al volo dal preventivo (senza uscire per andare in
  // Catalogo Prodotti) e lo aggiunge subito al carrello — campi minimi,
  // fornitore/misure/codice si possono completare con calma dopo da Catalogo
  // Prodotti se servono. Misure NON richieste (stessa ragione del Catalogo:
  // non tutti i prodotti hanno dimensioni sensate, es. un prodotto chimico).
  const creaProdottoVeloce = async () => {
    const nome = npvNome.trim();
    if (!nome) return;
    setNpvSalvando(true);
    const prezzo = parseFloat((npvPrezzo || '0').replace(',', '.')) || 0;
    const payload = {
      nome, categoria: indovinaCategoria(nome, activeCat), sottocategoria: 'Generico', tier: 'Standard',
      prezzo, fornitore: 'Generico', unita: npvUnita, descrizione: npvDescrizione.trim(),
    };
    const { data, error } = await sb.from('prodotti').insert(prodottoToRow(payload)).select().single();
    setNpvSalvando(false);
    if (error) {
      mostraToast('Errore nel creare il prodotto: ' + error.message);
      return;
    }
    const nuovoProdotto = prodottoFromRow(data);
    setProdotti(prev => [nuovoProdotto, ...prev]);
    toggleProdotto(nuovoProdotto);
    setNpvNome(''); setNpvPrezzo(''); setNpvUnita('pz'); setNpvDescrizione('');
    setNuovoProdottoVeloceAperto(false);
  };

  // a differenza di toggleProdotto (che TOGLIE se già presente, utile quando
  // tocchi la stessa card due volte per sbaglio), qui riscrivere lo stesso
  // nome una seconda volta nella riga veloce deve sempre voler dire "un
  // altro pezzo uguale" — mai rischiare di cancellare per sbaglio una riga
  // già scritta con fatica
  const aggiungiOIncrementaProdotto = (p) => {
    setCarrello(prev => {
      const esiste = prev.find(i => i.id === p.id);
      if (esiste) {
        const nuovaQty = esiste.qty + 1;
        return prev.map(i => i.id === p.id ? { ...i, qty: nuovaQty, meta: metaProdotto(p, nuovaQty) } : i);
      }
      return [...prev, {
        id: p.id, nome: p.nome, meta: metaProdotto(p, 1), prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto',
        unita: p.unita, zona: zonaAttiva, tipoInstallazione: 'nuova',
        fornitore: p.fornitore, misuraLunghezza: p.misuraLunghezza, misuraProfondita: p.misuraProfondita,
        misuraAltezza: p.misuraAltezza, descrizioneProdotto: p.descrizione,
      }];
    });
  };

  // Ultra: elabora testo → prodotti (1 o N righe / incolla lista). Un solo update carrello.
  const aggiungiRigaChat = async () => {
    const grezzo = chatRigaTesto.trim();
    if (!grezzo || chatSalvando) return;
    const righe = grezzo.split(/\n+/).map(r => r.trim()).filter(Boolean);
    setChatRigaTesto('');
    setChatSalvando(true);
    try {
      let catalogoLocale = [...prodotti];
      const nuoviDaSalvare = [];
      const risolti = [];
      for (const testo of righe) {
        const matchPrezzo = testo.match(/\s[-–—]?\s*(\d+(?:[.,]\d{1,2})?)\s*€?\s*$/);
        let nome = testo;
        let prezzoScritto = null;
        if (matchPrezzo) {
          prezzoScritto = parseFloat(matchPrezzo[1].replace(',', '.'));
          nome = testo.slice(0, matchPrezzo.index).replace(/[-–—]\s*$/, '').trim();
        }
        if (!nome) continue;
        const esistente = catalogoLocale.find(p => normalizzaRicerca(p.nome) === normalizzaRicerca(nome))
          || catalogoLocale.find(p => corrispondeRicerca(p.nome, nome));
        if (esistente) {
          risolti.push({ prodotto: esistente, tipo: 'trovato' });
          continue;
        }
        const payload = {
          nome, categoria: indovinaCategoria(nome, activeCat), sottocategoria: 'Generico', tier: 'Standard',
          prezzo: prezzoScritto || 0, fornitore: 'Generico', unita: 'pz', descrizione: '',
        };
        const { data, error } = await sb.from('prodotti').insert(prodottoToRow(payload)).select().single();
        if (error) throw new Error(error.message);
        const nuovoProdotto = prodottoFromRow(data);
        catalogoLocale = [nuovoProdotto, ...catalogoLocale];
        nuoviDaSalvare.push(nuovoProdotto);
        risolti.push({ prodotto: nuovoProdotto, tipo: 'creato' });
      }
      if (nuoviDaSalvare.length) setProdotti(prev => [...nuoviDaSalvare, ...prev]);
      if (risolti.length === 0) { setChatSalvando(false); return; }
      setCarrello(prev => {
        let next = [...prev];
        risolti.forEach(({ prodotto: p }) => {
          const esiste = next.find(i => i.id === p.id);
          if (esiste) {
            const nuovaQty = esiste.qty + 1;
            next = next.map(i => i.id === p.id ? { ...i, qty: nuovaQty, meta: metaProdotto(p, nuovaQty) } : i);
          } else {
            next.push({
              id: p.id, nome: p.nome, meta: metaProdotto(p, 1), prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto',
              unita: p.unita, zona: zonaAttiva, tipoInstallazione: 'nuova',
              fornitore: p.fornitore, misuraLunghezza: p.misuraLunghezza, misuraProfondita: p.misuraProfondita,
              misuraAltezza: p.misuraAltezza, descrizioneProdotto: p.descrizione,
            });
          }
        });
        return next;
      });
      const ultimo = risolti[risolti.length - 1];
      setChatUltimaAzione(risolti.length > 1
        ? { tipo: 'trovato', nome: `${risolti.length} materiali aggiunti`, prezzo: 0 }
        : { tipo: ultimo.tipo, nome: ultimo.prodotto.nome, prezzo: ultimo.prodotto.prezzo });
    } catch (err) {
      mostraToast('Errore: ' + (err.message || err));
      setChatRigaTesto(grezzo);
    }
    setChatSalvando(false);
  };

  const applicaCarrelloDaPreventivo = (p) => {
    if (!p) return;
    const n = (p.carrelloSnapshot || []).length;
    if (carrello.length > 0) {
      const ok = window.confirm(
        `Sostituire le voci attuali con la copia di ${p.id} (${n} voci)?\nIl preventivo originale NON viene cancellato.`
      );
      if (!ok) return;
    }
    setCarrello((p.carrelloSnapshot || []).map(item => ({ ...item })));
    setChatUltimaAzione({ tipo: 'trovato', nome: `Copia materiali da ${p.id}`, prezzo: p.importo || 0 });
  };

  // P3: quantità multiple per i prodotti già nel carrello
  // R5 (segnalato da Deborah/Denis): per i prodotti venduti al metro (cavi,
  // tubi...) cliccare + una cifra alla volta era impraticabile — stessa
  // soluzione già usata per i vecchi "materiali grezzi": si scrive il numero
  // direttamente. Ora vale per qualunque prodotto, non solo quelli al metro,
  // utile anche per grandi quantità a pezzo (es. 31 placche, 54 moduli ciechi).
  const aggiornaQtyProdotto = (id, qty) => {
    setCarrello(prev => {
      if (qty <= 0) return prev.filter(i => i.id !== id);
      return prev.map(i => i.id === id ? { ...i, qty, meta: (i.unita && i.unita !== 'pz') ? `${qty} ${i.unita} × ${i.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : i.meta } : i);
    });
  };

  // nuova installazione o sostituzione di un prodotto esistente — cambia la
  // descrizione auto-generata nel documento cliente (smontaggio del vecchio)
  const impostaTipoInstallazione = (id, tipo) => {
    setCarrello(prev => prev.map(i => i.id === id ? { ...i, tipoInstallazione: tipo } : i));
  };

  // Applica un template di lavoro — aggiunge automaticamente i materiali tipici,
  // così non si devono cercarli uno per uno per i lavori più comuni
  const applicaTemplate = async (template) => {
    setZonaAttiva(template.zona);
    for (const tm of template.materiali) {
      const prodEsistente = prodotti.find(p => p.nome === tm.nome);
      let prodId = prodEsistente?.id;
      let unitaUsata = prodEsistente?.unita || tm.unita;
      if (!prodEsistente) {
        const { data, error } = await sb.from('prodotti')
          .insert(prodottoToRow({ nome: tm.nome, categoria: tm.categoria, sottocategoria: 'Generico', tier: 'Standard', fornitore: 'Tecnomat', unita: tm.unita, prezzo: tm.prezzo }))
          .select().single();
        if (error) {
          console.error('Errore nel salvare il prodotto dal template:', error);
          continue;
        }
        const nuovoProd = prodottoFromRow(data);
        setProdotti(prevProd => [...prevProd, nuovoProd]);
        prodId = nuovoProd.id;
      }
      setCarrello(prev => {
        const exists = prev.find(i => i.id === prodId);
        if (exists) {
          // già in carrello (da un altro template o aggiunto a mano): sommiamo
          // la quantità del template invece di ignorarla, altrimenti il
          // prodotto resta con una quantità insufficiente per il lavoro
          const nuovaQty = exists.qty + tm.qty;
          return prev.map(i => i.id === prodId
            ? { ...i, qty: nuovaQty, meta: unitaUsata === 'm' ? `${nuovaQty} m × ${i.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : i.meta }
            : i);
        }
        return [...prev, {
          id: prodId, nome: tm.nome,
          meta: unitaUsata === 'm' ? `${tm.qty} m × ${tm.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Standard',
          prezzoUnitario: tm.prezzo, qty: tm.qty, kind: 'prodotto', zona: template.zona, unita: unitaUsata,
        }];
      });
    }
    if (template.prodottoSuggerito) {
      const prod = prodotti.find(p => p.nome === template.prodottoSuggerito);
      if (prod) {
        setCarrello(prev => {
          if (prev.find(i => i.id === prod.id)) return prev;
          return [...prev, { id: prod.id, nome: prod.nome, meta: prod.tier, prezzoUnitario: prod.prezzo, qty: 1, kind: 'prodotto', zona: template.zona }];
        });
      }
    }
    // R6 (richiesto da Denis: "modelli solo per i lavori grandi, non per quelli
    // piccoli, altrimenti si compilano 50 cose") — le voci di lavoro/manodopera
    // del template si riusano dal mini-catalogo se già esistono (probabile,
    // essendo frasi già usate su preventivi reali), altrimenti si creano lì
    // così restano cercabili anche in futuro
    for (const tl of template.lavori || []) {
      if (carrello.find(i => i.kind === 'lavoro' && i.nome === tl.nome)) continue;
      const esistente = vociLavoro.find(v => v.nome === tl.nome);
      if (!esistente) {
        const { data, error } = await sb.from('voci_lavoro')
          .insert(voceLavoroToRow({ nome: tl.nome, categoria: tl.categoria, prezzo: tl.prezzo || 0 }))
          .select().single();
        if (!error && data) setVociLavoro(prev => [...prev, voceLavoroFromRow(data)]);
      }
      setCarrello(prev => [...prev, {
        id: 'lavoro-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        nome: tl.nome,
        meta: tl.prezzo > 0 ? `Lavoro · ${tl.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : 'Lavoro',
        prezzoUnitario: tl.prezzo || 0, qty: 1, kind: 'lavoro', zona: template.zona, categoriaDocumento: tl.categoria,
      }]);
    }
  };

  // Gestione foto cantiere — ogni foto viene compressa e caricata subito su
  // Supabase Storage, con una riga in "foto" (senza preventivo_id finché il
  // preventivo non viene salvato: si collega dopo, in salvaPreventivo).
  // L'app richiede almeno 2 foto prima di poter salvare un preventivo nuovo.
  const gestisciFoto = async (fileList, tipo) => {
    setCaricandoFoto(true);
    for (const file of Array.from(fileList)) {
      let blob;
      try {
        blob = await comprimiImmagine(file, 1280, 0.6);
      } catch (err) {
        mostraToast('Errore nel comprimere la foto: ' + err.message);
        continue;
      }
      try {
        if (!navigator.onLine) throw new Error('offline');
        const cartella = cliente?.id || 'senza-cliente';
        const path = `${cartella}/${Date.now()}-${tipo}.jpg`;
        const { error: uploadError } = await sb.storage.from('cantiere-foto').upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;
        const rigaFoto = { preventivoId: modificaId ? modificaDbId : null, clienteId: cliente?.id || null, zona: zonaAttiva, tipo, storagePath: path };
        const { data, error } = await sb.from('foto').insert(fotoToRow(rigaFoto)).select().single();
        if (error) throw error;
        setFotoCantiere(prev => [...prev, fotoFromRow(data)]);
      } catch (err) {
        // niente rete: la foto resta comunque visibile e conta per il
        // minimo di 2 richieste — si carica da sola alla riconnessione
        const localId = 'offline-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        setFotoCantiere(prev => [...prev, { id: localId, url: URL.createObjectURL(blob), tipo, zona: zonaAttiva, pending: true, _blob: blob }]);
      }
    }
    setCaricandoFoto(false);
  };

  const rimuoviFoto = async (id) => {
    const f = fotoCantiere.find(x => x.id === id);
    if (!f) return;
    setFotoCantiere(prev => prev.filter(x => x.id !== id));
    if (f.pending) return;
    if (f.storagePath) sb.storage.from('cantiere-foto').remove([f.storagePath]).catch(() => {});
    sb.from('foto').delete().eq('id', id).then(({ error }) => {
      if (error) console.error('Errore nel rimuovere la foto:', error);
    });
  };

  const rimuoviVoce = (id) => setCarrello(carrello.filter(i => i.id !== id));

  const cambiaStato = async (id, nuovoStato) => {
    const { error } = await sb.from('preventivi').update({ stato: nuovoStato }).eq('numero', id);
    if (error) {
      mostraToast('Errore nel salvare lo stato: ' + error.message);
      return;
    }
    setPreventivi(preventivi.map(p => p.id === id ? { ...p, stato: nuovoStato } : p));
    setStatoEditId(null);
  };

  // R3: elimina preventivo — le foto collegate spariscono in automatico dal db
  // (cascade), ma i file nello storage vanno rimossi a mano
  const eliminaPreventivo = async (p) => {
    if (!window.confirm(`Eliminare definitivamente il preventivo ${p.id}? L'azione non si può annullare.`)) return;
    const { data: fotoDaRimuovere } = await sb.from('foto').select('storage_path').eq('preventivo_id', p.dbId);
    const paths = (fotoDaRimuovere || []).map(f => f.storage_path).filter(Boolean);
    if (paths.length) sb.storage.from('cantiere-foto').remove(paths).catch(() => {});
    const { error } = await sb.from('preventivi').delete().eq('id', p.dbId);
    if (error) { mostraToast('Errore nell’eliminare il preventivo: ' + error.message); return; }
    setPreventivi(prev => prev.filter(x => x.dbId !== p.dbId));
    setMode('lista');
  };

  const maxNum = Math.max(...preventivi.map(p => parseInt(p.id.replace('PV-', '')) || 0), 148);
  const numeroDocumento = 'PV-' + String(maxNum + 1).padStart(4, '0');
  const dataDocumento = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const salvaPreventivo = async () => {
    if (!cliente || carrello.length === 0) return;
    setSalvandoPreventivo(true);
    setErrorePreventivo('');
    const zoneCoinvolte = [...new Set(carrello.map(i => i.zona || 'generico'))];
    // foto scattate mentre non c'era rete: sono già visibili in fotoCantiere
    // ma esistono solo come blob locale, vanno accodate insieme al preventivo
    const fotoPendenti = fotoCantiere.filter(f => f.pending).map(f => ({ blob: f._blob, tipo: f.tipo, zona: f.zona }));

    if (modificaId) {
      const payload = {
        clienteId: cliente.id,
        cliente: cliente.nome,
        cantiere: cliente.indirizzo.split(',').pop().trim(),
        importo: Math.round(totale),
        importoManodopera: Math.round(rincaroValore),
        carrelloSnapshot: carrello,
        diciture: diciture,
      };
      try {
        if (!navigator.onLine) throw new Error('offline');
        const { error } = await sb.from('preventivi').update(preventivoToRow(payload)).eq('numero', modificaId);
        if (error) throw error;
        const fotoCaricate = fotoCantiere.filter(f => !f.pending);
        if (fotoCaricate.length > 0) {
          sb.from('foto').update({ preventivo_id: modificaDbId }).in('id', fotoCaricate.map(f => f.id))
            .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
        }
        if (fotoPendenti.length > 0) {
          await accodaOffline('preventivo_foto', { preventivoId: modificaDbId, clienteId: cliente.id, foto: fotoPendenti });
        }
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length } : p));
      } catch (err) {
        // niente rete: si accoda tutto il preventivo e si mostra comunque
        // il salvataggio come riuscito, così Denis può continuare a lavorare
        await accodaOffline('preventivo', { modificaId, modificaDbId, payload, fotoPendenti });
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true } : p));
      }
      cancellaBozzaCliente(cliente.id);
      setSalvandoPreventivo(false);
      setShowPreview(false);
      setShowSuccess(true);
      return;
    }

    const payload = {
      id: numeroDocumento,
      clienteId: cliente.id,
      cliente: cliente.nome,
      cantiere: cliente.indirizzo.split(',').pop().trim(),
      dataIso: new Date().toISOString().slice(0, 10),
      importo: Math.round(totale),
      importoManodopera: Math.round(rincaroValore),
      diciture: diciture,
      stato: 'In Attesa',
      carrelloSnapshot: carrello,
    };
    try {
      if (!navigator.onLine) throw new Error('offline');
      const { data, error } = await sb.from('preventivi').insert(preventivoToRow(payload)).select().single();
      if (error) throw error;
      const fotoCaricate = fotoCantiere.filter(f => !f.pending);
      if (fotoCaricate.length > 0) {
        sb.from('foto').update({ preventivo_id: data.id }).in('id', fotoCaricate.map(f => f.id))
          .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
      }
      if (fotoPendenti.length > 0) {
        await accodaOffline('preventivo_foto', { preventivoId: data.id, clienteId: cliente.id, foto: fotoPendenti });
      }
      const nuovo = { ...preventivoFromRow(data), zone: zoneCoinvolte, nFoto: fotoCantiere.length };
      setPreventivi([nuovo, ...preventivi]);
    } catch (err) {
      await accodaOffline('preventivo', { modificaId: null, modificaDbId: null, payload, fotoPendenti });
      const nuovo = { ...payload, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true };
      setPreventivi([nuovo, ...preventivi]);
    }
    cancellaBozzaCliente(cliente.id);
    setSalvandoPreventivo(false);
    setShowPreview(false);
    setShowSuccess(true);
  };

  const chiudiSuccess = () => {
    setShowSuccess(false);
    setModificaId(null);
    setModificaDbId(null);
    setMode('lista');
  };

/* ---- FPV FINAL (macheta Ferari / ProntoPro) — ultima variante ---- */
  /* Hub ≠ Dashboard analytics: coda di lavoro + Nuovo. Design = macheta. */
  if (mode === 'lista') {
    const bozzeHub = Object.entries(leggiTutteLeBozze())
      .map(([id, b]) => ({ id, bozza: b, cliente: clienti.find(c => c.id === id) }))
      .filter(x => x.cliente && ((x.bozza.carrello || []).filter(i => i.kind !== 'trasferta').length > 0 || (x.bozza.fotoCantiere || []).length > 0));
    void bozzeTick; // usato solo per re-render dopo cancellaBozzaCliente
    const aperti = preventivi.filter(p => p.stato !== 'Finito' && p.stato !== 'Rifiutato');
    const valoreAperti = aperti.reduce((s, p) => s + (p.importo || 0), 0);
    const nInCorso = preventivi.filter(p => p.stato === 'In Corso').length;
    const nInviati = preventivi.filter(p => p.stato === 'Inviato' || p.stato === 'In Attesa').length;
    const nAcc = preventivi.filter(p => p.stato === 'Accettato').length;
    const filtri = ['Tutti', 'In Corso', 'Inviato', 'In Attesa', 'Accettato', 'Rifiutato'];
    const q = listaQuery.trim().toLowerCase();
    const coda = ordinaPerPriorita(preventivi.filter(p => {
      if (listaFiltro !== 'Tutti' && p.stato !== listaFiltro) return false;
      if (listaFiltro === 'Tutti' && (p.stato === 'Finito')) return false;
      if (!q) return true;
      return [p.cliente, p.cantiere, p.id, p.stato].join(' ').toLowerCase().includes(q);
    }));
    const badge = (st) => {
      if (st === 'In Corso') return 'fpv-badge-blue';
      if (st === 'Inviato' || st === 'In Attesa') return 'fpv-badge-amber';
      if (st === 'Accettato') return 'fpv-badge-green';
      if (st === 'Rifiutato') return 'fpv-badge-red';
      return 'fpv-badge-gray';
    };

    return (
      <div className="fpv pb-32">
        <div className="max-w-lg mx-auto px-4 pt-5 fpv-hub-enter">
          <div className="flex items-center justify-between mb-1">
            <div>
              <p className="text-[14px] font-medium text-[#62648A]">Ciao Denis</p>
              <h1 className="text-[34px] font-bold text-[#12124E] tracking-[-0.03em] leading-none mt-0.5">Preventivi</h1>
            </div>
            <div className="w-11 h-11 rounded-[14px] bg-[#12124E] text-white flex items-center justify-center text-[15px] font-bold">FI</div>
          </div>

          <div className="mt-4 rounded-[28px] bg-[#12124E] text-white px-5 py-5">
            <p className="text-[13px] font-medium text-[#B9BBE3]">Preventivi aperti</p>
            <p className="text-[40px] font-bold tracking-[-0.03em] leading-none mt-1 tabular-nums">{fmtEuro2(valoreAperti)}</p>
            <div className="mt-4 grid grid-cols-3 gap-2">
              <div className="rounded-2xl bg-white/10 px-3 py-2.5">
                <p className="text-[20px] font-semibold tabular-nums leading-none">{nInCorso}</p>
                <p className="text-[12px] text-[#B9BBE3] mt-1">In corso</p>
              </div>
              <div className="rounded-2xl bg-white/10 px-3 py-2.5">
                <p className="text-[20px] font-semibold tabular-nums leading-none">{nInviati}</p>
                <p className="text-[12px] text-[#B9BBE3] mt-1">Inviati</p>
              </div>
              <div className="rounded-2xl bg-white/10 px-3 py-2.5">
                <p className="text-[20px] font-semibold tabular-nums leading-none">{nAcc}</p>
                <p className="text-[12px] text-[#B9BBE3] mt-1">Accettati</p>
              </div>
            </div>
          </div>

          {bozzeHub.length > 0 && (
            <div className="mt-4 space-y-2">
              <p className="text-[13px] font-semibold text-[#8A5A00] px-1">Bozze da finire</p>
              {bozzeHub.map(({ id, bozza, cliente: c }) => (
                <div key={id} className="flex items-stretch gap-2">
                  <button type="button"
                    onClick={() => { ripristinaBozza(bozza); setWizardStep(2); setRapidoExtra(null); }}
                    className="app-ripple flex-1 flex items-center gap-3 px-4 py-3.5 rounded-[22px] bg-[#FDF0D6] text-left">
                    <div className="w-10 h-10 rounded-full bg-white text-[#8A5A00] flex items-center justify-center shrink-0">
                      <Clock className="w-5 h-5" />
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className="text-[16px] font-semibold text-[#12124E] truncate">{c.nome}</p>
                      <p className="text-[13px] text-[#8A5A00]">{(bozza.carrello || []).filter(i => i.kind !== 'trasferta').length} voci · riprendi subito</p>
                    </div>
                    <ChevronRight className="w-5 h-5 text-[#8A5A00]" />
                  </button>
                  <button type="button" title="Scarta bozza"
                    onClick={() => { cancellaBozzaCliente(id); setBozzeTick(t => t + 1); }}
                    className="w-12 rounded-[22px] bg-[#FDE8E8] text-[#B42318] flex items-center justify-center shrink-0">
                    <X className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
          )}

          <div className="mt-4 flex items-center gap-2.5 h-12 px-4 bg-white border border-[#E6E8F1] rounded-[18px]">
            <Search className="w-4 h-4 text-[#62648A] shrink-0" />
            <input type="search" value={listaQuery} onChange={(e) => setListaQuery(e.target.value)}
              placeholder="Cerca cliente, numero, cantiere…"
              className="flex-1 border-0 outline-none bg-transparent text-[15px] text-[#12124E] placeholder:text-[#9A9CBA]" />
          </div>

          <div className="mt-3 flex gap-2 overflow-x-auto pb-0.5 chips-scroll">
            {filtri.map(f => (
              <button key={f} type="button" onClick={() => setListaFiltro(f)}
                className={'shrink-0 h-[38px] px-4 rounded-full text-[14px] font-semibold ' + (listaFiltro === f ? 'bg-[#12124E] text-white' : 'bg-white border border-[#E6E8F1] text-[#12124E]')}>
                {f}
              </button>
            ))}
          </div>

          <div className="mt-3.5 space-y-2.5 pb-4">
            {coda.map(p => (
              <button key={p.id} type="button"
                onClick={() => { setDettaglioId(p.id); setMode('dettaglio'); }}
                className="app-ripple w-full flex items-center gap-3 px-4 py-3.5 bg-white border border-[#E6E8F1] rounded-[22px] text-left active:bg-[#F4F5FA]">
                <div className="min-w-0 flex-1">
                  <p className="text-[16px] font-semibold text-[#12124E] truncate">{p.cliente}</p>
                  <p className="text-[13px] text-[#62648A] mt-0.5 truncate">{p.id} · {p.cantiere || p.data}</p>
                </div>
                <div className="text-right shrink-0">
                  <p className="text-[16px] font-semibold tabular-nums text-[#12124E]">{fmtEuro2(p.importo || 0)}</p>
                  <span className={'inline-block mt-1 px-2.5 py-0.5 rounded-[10px] text-[12px] font-semibold ' + badge(p.stato)}>{p.stato}</span>
                </div>
              </button>
            ))}
            {coda.length === 0 && (
              <p className="text-center text-[14px] text-[#62648A] py-10">
                {preventiviLoading ? 'Caricamento…' : 'Nessun preventivo aperto. Tocca Nuovo.'}
              </p>
            )}
          </div>
        </div>

        <div className="fixed left-0 right-0 z-30 px-4 pointer-events-none" style={{ bottom: 'calc(var(--nav-h) + 0.75rem)' }}>
          <div className="max-w-lg mx-auto pointer-events-auto">
            <button type="button" onClick={startNuovo}
              className="app-ripple w-full h-[60px] rounded-full bg-[#F7A823] text-[#12124E] text-[18px] font-semibold shadow-[0_12px_28px_rgba(18,18,78,0.22)] flex items-center justify-center gap-2.5 active:scale-[0.99]">
              <Plus className="w-5 h-5" strokeWidth={2.6} />
              Nuovo preventivo
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---- Composer 3 passi: Cliente → Lavori → Rivedi (macheta) ---- */
  if (mode === 'nuovo' && modoRapido) {
    const nVoci = carrello.filter(i => i.kind !== 'trasferta').length;
    const step = !cliente ? 1 : (wizardStep === 3 ? 3 : 2);
    const clientiFiltrati = clienti
      .filter(c => {
        const q = clienteSearch.trim().toLowerCase();
        if (!q) return true;
        return c.nome.toLowerCase().includes(q) || (c.indirizzo || '').toLowerCase().includes(q) || (c.telefono || '').includes(clienteSearch.trim());
      })
      .sort((a, b) => a.nome.localeCompare(b.nome));
    const qCat = (queryCatalogoPreventivo || queryLavoro || '').trim();
    const risultatiAdd = qCat
      ? [
          ...prodotti
            .filter(p => visibileInZona(p, zonaAttiva) && corrispondeRicerca([p.nome, p.codice, p.descrizione, p.sottocategoria, p.categoria, p.fornitore].join(' '), qCat))
            .slice(0, 40)
            .map(p => ({ tipo: 'prodotto', p })),
          ...vociLavoro.filter(v => corrispondeRicerca(v.nome, qCat)).slice(0, 12).map(v => ({ tipo: 'voce', v })),
        ]
      : [];
    const vociLista = carrello.filter(i => i.kind !== 'trasferta');
    const puoSalvare = nVoci > 0 && (modificaId || fotoCantiere.length >= 2);
    const zonaNome = (ZONE_AMBIENTI.find(z => z.id === zonaAttiva) || {}).nome || 'Impianto';
    const sheet = rapidoExtra;
    const kmNum = parseFloat((kmTrasferta || '0').replace(',', '.')) || 0;
    const prezzoKmN = parseFloat((prezzoKm || '0').replace(',', '.')) || 0;

    const goBack = () => {
      if (sheet) { setRapidoExtra(null); return; }
      if (step === 3) { setWizardStep(2); return; }
      if (step === 2 && cliente) { setClienteId(null); setWizardStep(1); return; }
      setModificaId(null); setModificaDbId(null); setMode('lista');
    };

    const Progress = () => (
      <div className="flex gap-1.5 flex-1">
        <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 1 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
        <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 2 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
        <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 3 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
      </div>
    );

    const ToolSheet = ({ title, onClose, children }) => (
      <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center">
        <div className="absolute inset-0 bg-[#12124E]/40" onClick={onClose} />
        <div className="relative w-full max-w-lg sm:mx-4 bg-[#F4F5FA] rounded-t-[28px] sm:rounded-[28px] max-h-[88vh] flex flex-col ui-sheet-enter shadow-[0_-12px_40px_rgba(18,18,78,0.22)]">
          <div className="flex justify-center pt-2.5 sm:hidden">
            <div className="w-10 h-1 rounded-full bg-[#D8DAE8]" />
          </div>
          <div className="flex items-center justify-between px-5 pt-3 pb-3 shrink-0">
            <p className="text-[18px] font-semibold text-[#12124E]">{title}</p>
            <button type="button" onClick={onClose} className="w-10 h-10 rounded-full bg-white border border-[#E6E8F1] flex items-center justify-center active:bg-[#EEF0FB]">
              <X className="w-4 h-4 text-[#62648A]" />
            </button>
          </div>
          <div className="overflow-y-auto flex-1 px-4 fpv-sheet-body">{children}</div>
        </div>
      </div>
    );

    return (
      <div className="fpv pb-28">
        <div className="max-w-lg mx-auto px-4 pt-3">
          <div className="flex items-center gap-3 mb-1">
            <button type="button" onClick={goBack} aria-label="Indietro"
              className="app-ripple w-[42px] h-[42px] rounded-full bg-white border border-[#E6E8F1] flex items-center justify-center text-[#12124E] shrink-0">
              <ArrowLeft className="w-5 h-5" />
            </button>
            {step === 1 ? <Progress /> : (
              <div className="flex-1 min-w-0">
                <p className="text-[18px] font-semibold text-[#12124E] truncate leading-tight">
                  {step === 2 ? (cliente?.nome || 'Lavori') : 'Rivedi e invia'}
                </p>
                <p className="text-[12.5px] font-medium text-[#14704D] flex items-center gap-1 mt-0.5">
                  <Check className="w-3 h-3" strokeWidth={3} /> Bozza salvata
                </p>
              </div>
            )}
            <p className="text-[13px] font-semibold text-[#62648A] shrink-0">{step} di 3</p>
          </div>
          {step > 1 && (
            <div className="flex gap-1.5 mt-2 mb-1">
              <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 1 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
              <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 2 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
              <div className={'h-[5px] flex-1 rounded-[3px] ' + (step >= 3 ? 'bg-[#12124E]' : 'bg-[#D8DAE8]')} />
            </div>
          )}

          {/* 1 — CLIENTE */}
          {step === 1 && (
            <div className="ui-sheet-enter">
              <h2 className="text-[32px] font-bold text-[#12124E] tracking-[-0.03em] leading-[1.08] mt-5 px-1">
                Per chi è<br />il preventivo?
              </h2>

              {duplicaPendente && (
                <div className="mt-4 mx-0 rounded-[18px] bg-[#EEF0FB] px-4 py-3 flex items-center justify-between gap-2">
                  <p className="text-[14px] font-semibold text-[#12124E]"><Copy className="w-3.5 h-3.5 inline mr-1" />Duplica pronta — scegli cliente</p>
                  <button type="button" onClick={() => setDuplicaPendente(null)}><X className="w-4 h-4" /></button>
                </div>
              )}

              <div className="mt-4 flex items-center gap-2.5 h-[52px] px-[18px] bg-white border border-[#E6E8F1] rounded-[18px]">
                <Search className="w-5 h-5 text-[#62648A]" />
                <input type="search" value={clienteSearch} onChange={(e) => setClienteSearch(e.target.value)}
                  placeholder="Cerca per nome o telefono" autoFocus
                  className="flex-1 border-0 outline-none bg-transparent text-[16px] text-[#12124E] placeholder:text-[#62648A]" />
              </div>

              <div className="mt-3.5 bg-white border border-[#E6E8F1] rounded-[22px] overflow-hidden max-h-[42vh] overflow-y-auto">
                {clientiFiltrati.map((c, idx) => (
                  <button key={c.id} type="button" onClick={() => selezionaCliente(c)}
                    className={'w-full flex items-center gap-3.5 px-4 py-3.5 text-left active:bg-[#EEF0FB] ' + (idx ? 'border-t border-[#ECEEF5]' : '')}>
                    <div className={`w-[42px] h-[42px] rounded-full flex items-center justify-center text-[15px] font-semibold shrink-0 ${coloreAvatar(c.nome)}`}>
                      {inizialiNome(c.nome)}
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className="text-[16px] font-semibold text-[#12124E] truncate">{c.nome}</p>
                      <p className="text-[13px] text-[#62648A] mt-0.5 truncate">{c.indirizzo}</p>
                    </div>
                  </button>
                ))}
                {clientiFiltrati.length === 0 && (
                  <p className="px-4 py-10 text-center text-[14px] text-[#62648A]">{clientiLoading ? 'Caricamento…' : 'Nessun cliente'}</p>
                )}
              </div>

              <div className="mt-2.5">
                <NuovoClienteInline onSalva={(nuovoCliente) => {
                  setClientiEsterni(prev => [nuovoCliente, ...prev]);
                  setClienteId(nuovoCliente.id);
                  setModoRapido(true);
                  setWizardStep(2);
                }} />
              </div>
            </div>
          )}

          {/* 2 — LAVORI */}
          {step === 2 && cliente && (
            <div className="ui-sheet-enter space-y-3 mt-3">
              <div className="flex items-center gap-2 h-12 px-4 bg-white border border-[#E6E8F1] rounded-[18px]">
                <Search className="w-5 h-5 text-[#62648A]" />
                <input type="search" value={queryCatalogoPreventivo}
                  onChange={(e) => { setQueryCatalogoPreventivo(e.target.value); setQueryLavoro(e.target.value); }}
                  placeholder="Cerca prodotto, lavoro o kit"
                  className="flex-1 border-0 outline-none bg-transparent text-[16px] text-[#12124E] placeholder:text-[#62648A]" />
              </div>

              {/* Tool dock — tutto a portata */}
              <div className="flex gap-2 overflow-x-auto chips-scroll pb-0.5">
                {[
                  { id: 'catalogo', label: 'Catalogo', bg: 'bg-[#E4EEFB]', fg: 'text-[#1D5AA6]', Icon: Package },
                  { id: 'voci', label: 'Voci', bg: 'bg-[#DDF3E8]', fg: 'text-[#14704D]', Icon: Wrench },
                  { id: 'zona', label: zonaNome.length > 10 ? 'Zona' : zonaNome, bg: 'bg-[#FDF0D6]', fg: 'text-[#8A5A00]', Icon: MapPin },
                  { id: 'nuovo', label: 'Prodotto nuovo', bg: 'bg-[#12124E]', fg: 'text-white', Icon: Plus, solid: true },
                ].map(t => (
                  <button key={t.id} type="button"
                    onClick={() => {
                      if (t.id === 'nuovo') { setNuovoProdottoVeloceAperto(true); setRapidoExtra(null); return; }
                      setRapidoExtra(t.id);
                    }}
                    className={'shrink-0 h-10 pl-2.5 pr-3.5 rounded-full border border-[#E6E8F1] flex items-center gap-2 text-[14px] font-semibold ' + (t.solid ? 'bg-[#12124E] text-white border-transparent' : 'bg-white text-[#12124E]')}>
                    <span className={'w-6 h-6 rounded-full flex items-center justify-center ' + (t.solid ? 'bg-white/15 text-white' : t.bg + ' ' + t.fg)}>
                      <t.Icon className="w-3.5 h-3.5" />
                    </span>
                    {t.label}
                  </button>
                ))}
              </div>

              {risultatiAdd.length > 0 && (
                <div className="bg-white border border-[#E6E8F1] rounded-[18px] overflow-hidden divide-y divide-[#ECEEF5] max-h-52 overflow-y-auto">
                  {risultatiAdd.map(r => r.tipo === 'prodotto' ? (
                    <button key={'p' + r.p.id} type="button"
                      onClick={() => {
                        const gia = carrello.find(i => i.id === r.p.id);
                        if (gia) {
                          aggiungiOIncrementaProdotto(r.p);
                          mostraToast('Già nel preventivo — quantità +1', 'info');
                        } else {

                            </div>

                      })}
                      {prodottiCatalogoPreventivo.length === 0 && (
                        <p className="px-4 py-10 text-center text-[14px] text-[#62648A]">Nessun prodotto in questa cartella.</p>

        {sheet === 'voci' && (
          <ToolSheet title="Voci di lavoro" onClose={() => setRapidoExtra(null)}>

              <div className="bg-white border border-[#E6E8F1] rounded-[18px] p-4 space-y-2">

                <input value={lavoroPrezzo} onChange={(e) => setLavoroPrezzo(e.target.value)} placeholder="Prezzo €" inputMode="decimal" className="w-full h-11 px-3 rounded-xl bg-[#F4F5FA] outline-none" />

                  <button type="button" onClick={() => setShowNuovoLavoro(false)} className="flex-1 h-11 rounded-full bg-[#E6E8F1] font-semibold">Annulla</button>

                </div>
              </div>

          </ToolSheet>
        )}

        {sheet === 'zona' && (
          <ToolSheet title="Zona cantiere" onClose={() => setRapidoExtra(null)}>
            <div className="grid grid-cols-2 gap-2">
              {ZONE_AMBIENTI.map(z => {
                const active = zonaAttiva === z.id;
                const Icon = z.Icon;
                return (
                  <button key={z.id} type="button" onClick={() => { setZonaAttiva(z.id); setRapidoExtra(null); }}
                    className={'bg-white border rounded-[18px] px-3 py-4 flex flex-col items-center gap-2 ' + (active ? 'border-[#12124E] ring-2 ring-[#12124E]/20' : 'border-[#E6E8F1]')}>
                    <div className={'w-11 h-11 rounded-2xl flex items-center justify-center ' + (active ? 'bg-[#12124E] text-white' : 'bg-[#F4F5FA] text-[#62648A]')}>
                      <Icon className="w-5 h-5" />
                    </div>
                    <span className="text-[13px] font-semibold text-center leading-tight">{z.nome}</span>
                  </button>

              <div className="mt-4 space-y-2">
                <p className="text-[13px] font-semibold text-[#62648A] px-1">Template rapido</p>
                {TEMPLATE_LAVORI.filter(t => t.zona === zonaAttiva).map(t => (
                  <button key={t.id} type="button" onClick={() => { applicaTemplate(t); setRapidoExtra(null); }}
                    className="w-full bg-white border border-[#E6E8F1] rounded-[18px] px-4 py-3.5 text-left">
                    <p className="text-[15px] font-semibold">{t.nome}</p>
                    <p className="text-[12px] text-[#62648A] mt-0.5">Aggiunge voci tipiche</p>
                  </button>
                ))}
              </div>
            )}
          </ToolSheet>
        )}

        {cliente && !showSuccess && ReactDOM.createPortal(
          <div className="app-composer-footer fpv-bar">
            <div className="px-3 py-2.5">
              <div className="max-w-lg mx-auto flex items-center gap-3 px-4 py-2.5 rounded-[30px] bg-white/90 border border-[rgba(18,18,78,0.08)] shadow-[0_12px_32px_rgba(18,18,78,0.16)] backdrop-blur-xl">
                <div className="min-w-0 flex-1">
                  <p className="text-[12.5px] text-[#62648A] font-medium">Totale · {nVoci} {nVoci === 1 ? 'voce' : 'voci'}</p>

                  <button type="button" onClick={() => { setRapidoExtra(null); setWizardStep(3); }} disabled={nVoci === 0}

                  <button type="button" onClick={salvaPreventivo}

                    className="app-ripple shrink-0 h-[54px] px-6 rounded-[22px] bg-[#F7A823] text-[#12124E] text-[17px] font-semibold disabled:opacity-35">
                    {salvandoPreventivo ? 'Salvo…' : 'Salva'}
                  </button>
                )}
              </div>
            </div>
          </div>, document.body)}

        {showSuccess && (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
            <div className="absolute inset-0 bg-[#12124E]/40" onClick={chiudiSuccess} />
            <div className="relative bg-white rounded-[28px] p-6 max-w-sm w-full shadow-2xl ui-sheet-enter">

                <Check className="w-7 h-7" strokeWidth={2.5} />

              <p className="text-[24px] font-bold tracking-tight text-[#12124E]">{modificaId ? 'Salvato' : 'Preventivo creato'}</p>
              <p className="text-[15px] text-[#62648A] mt-1">{cliente?.nome} · {fmtEuro2(Math.round(totale))}</p>
              <button type="button" onClick={chiudiSuccess}
                className="mt-6 w-full h-14 rounded-[22px] bg-[#F7A823] text-[#12124E] text-[17px] font-semibold">

              </button>
            </div>
          </div>
        )}
        <PdfClienteSceltaModal dati={pdfClienteDati} onScegli={scegliPdfCliente} onChiudi={() => setPdfClienteDati(null)} />
      </div>
    );
  }


  /* ---- vista creazione/modifica preventivo ---- */
  return (
    <div className={`pb-4 min-h-full ${!cliente || modoRapido ? 'pv26' : 'px-4 sm:px-6 lg:px-8 py-4 sm:py-6'}`}>

        <div className="max-w-xl mx-auto px-4 pt-4 flex items-center justify-between">
          <button
            type="button"
            onClick={() => {

            className="app-ripple inline-flex items-center gap-2 h-10 px-3 rounded-full pv26-glass text-[13px] font-semibold text-white/90 active:scale-95 transition-transform"

          {!modificaId && (cliente || carrello.length > 0) && (

        <div className="flex items-center justify-between mb-5">

            <ArrowLeft className="w-3.5 h-3.5" />

            <button onClick={scartaBozza} className="text-xs font-semibold text-red-400 hover:text-red-600">

      {modificaId && (
        <p className={`text-xs font-semibold mb-3 max-w-xl mx-auto px-4 ${modoRapido || !cliente ? 'text-sky-300' : 'text-blue-600'}`}>Stai modificando {modificaId}</p>

        <div className="max-w-xl mx-auto px-4 pt-5 pb-10 space-y-4">

          {duplicaPendente && (

              <p className="text-[13px] text-white/80 font-medium">

              <button type="button" onClick={() => setDuplicaPendente(null)} className="text-white/50 hover:text-white">
                <X className="w-4 h-4" />
              </button>
            </div>

          {(() => {
            if (duplicaPendente) return null;
            const bozzePendenti = Object.entries(leggiTutteLeBozze())
              .map(([id, b]) => ({ id, bozza: b, cliente: clienti.find(c => c.id === id) }))
              .filter(x => x.cliente);
            if (bozzePendenti.length === 0) return null;
            return (
              <div className="space-y-2">
                <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-amber-300/80">Bozze aperte</p>
                {bozzePendenti.map(({ id, bozza, cliente: c }) => (
                  <button
                    key={id}
                    type="button"
                    onClick={() => ripristinaBozza(bozza)}
                    className="app-ripple w-full pv26-glass rounded-2xl px-4 py-3.5 flex items-center justify-between gap-2 text-left active:scale-[0.99] transition-transform"
                  >
                    <span className="text-[15px] font-semibold text-white truncate">{c.nome}</span>
                    <span className="text-[12px] font-semibold text-amber-200 shrink-0">
                      {(bozza.carrello || []).length} voci
                    </span>
                  </button>
                ))}
              </div>
            );
          })()}

          <div className="flex items-center gap-2.5 h-12 px-3.5 rounded-2xl pv26-glass">
            <Search className="w-4 h-4 text-white/40 shrink-0" />
            <input
              type="search"
              value={clienteSearch}
              onChange={(e) => setClienteSearch(e.target.value)}
              placeholder="Cerca nella lista clienti…"
              autoFocus
              className="flex-1 bg-transparent border-0 outline-none text-[15px] font-medium text-white placeholder:text-white/35"
            />
          </div>

          <div className="space-y-2 max-h-[52vh] overflow-y-auto">
            {clienti
              .filter(c => c.nome.toLowerCase().includes(clienteSearch.toLowerCase()) || c.indirizzo.toLowerCase().includes(clienteSearch.toLowerCase()))
              .sort((a, b) => a.nome.localeCompare(b.nome))
              .map(c => (
                <button
                  key={c.id}
                  type="button"
                  onClick={() => selezionaCliente(c)}
                  className="app-ripple w-full pv26-glass pv26-row rounded-2xl px-4 py-3.5 text-left active:scale-[0.99] transition-transform"
                >
                  <p className="text-[15px] font-semibold text-white tracking-tight truncate">{c.nome}</p>
                  <p className="text-[12px] text-white/40 mt-0.5 truncate font-medium">{c.indirizzo}</p>
                </button>
              ))}
            {clienti.filter(c => c.nome.toLowerCase().includes(clienteSearch.toLowerCase()) || c.indirizzo.toLowerCase().includes(clienteSearch.toLowerCase())).length === 0 && (
              <p className="text-[13px] text-white/40 text-center py-10 font-medium">
                {clientiLoading ? 'Caricamento…' : 'Nessun cliente — creane uno sotto'}
              </p>
            )}
          </div>

          <NuovoClienteInline
            onSalva={(nuovoCliente) => {
              setClientiEsterni(prev => [nuovoCliente, ...prev]);
              setClienteId(nuovoCliente.id);
              setModoRapido(true);
            }}
          />
        </div>
      ) : false && modoRapido ? (
        <div className="max-w-xl mx-auto px-4 pt-3 space-y-3 pb-2">
          <div className="pv26-glass rounded-[1.5rem] px-4 py-4">
            <div className="min-w-0">
              <p className="text-[11px] font-semibold uppercase tracking-[0.16em] text-white/40">Preventivo rapido</p>
              <p className="text-[1.35rem] font-semibold tracking-tight text-white truncate leading-tight mt-1">{cliente.nome}</p>
              <p className="text-[12px] font-medium text-white/45 truncate mt-0.5">{cliente.indirizzo}</p>
            </div>
            <div className="mt-3.5 grid grid-cols-3 gap-2">
              {[
                { ok: carrello.filter(i => i.kind !== 'trasferta').length > 0, label: `${carrello.filter(i => i.kind !== 'trasferta').length} voci` },
                { ok: fotoCantiere.length >= 2, label: `${fotoCantiere.length}/2 foto` },
                { ok: !!String(kmTrasferta || '').trim(), label: kmTrasferta ? `${kmTrasferta} km` : 'Km' },
              ].map((s, i) => (
                <div
                  key={i}
                  className={`rounded-xl px-2 py-2 text-center text-[11px] font-semibold ${s.ok ? 'bg-emerald-400/15 text-emerald-300 border border-emerald-400/20' : 'bg-white/5 text-white/40 border border-white/5'}`}
                >
                  {s.label}
                </div>
              ))}
            </div>
            <button
              type="button"
              onClick={() => { setModoRapido(false); setRapidoExtra(null); }}
              className="mt-3 w-full text-center text-[12px] font-medium text-white/35 hover:text-white/70 transition-colors"
            >
              Modalità completa

          </div>

          {preventivi.filter(p => (p.carrelloSnapshot || []).length > 0).slice(0, 6).length > 0 && (
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-white/35 mb-2 px-0.5">Copia da</p>
              <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                {preventivi.filter(p => (p.carrelloSnapshot || []).length > 0).slice(0, 6).map(p => (
                  <button
                    key={p.id}
                    type="button"
                    onClick={() => applicaCarrelloDaPreventivo(p)}
                    className="app-ripple shrink-0 px-3.5 py-2.5 rounded-2xl pv26-glass text-left active:scale-[0.98] transition-transform"
                  >
                    <p className="text-[13px] font-semibold text-white truncate max-w-[140px]">{p.cliente || 'Preventivo'}</p>
                    <p className="text-[11px] text-white/40 mt-0.5 font-medium">{(p.carrelloSnapshot || []).length} voci · {fmtEuro(p.importo)}</p>
                  </button>
                ))}
              </div>
            </div>
          )}

          {TEMPLATE_LAVORI.length > 0 && (
            <div className="flex gap-2 overflow-x-auto pb-0.5 -mx-1 px-1">
              {TEMPLATE_LAVORI.slice(0, 5).map(t => (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => { setZonaAttiva(t.zona); applicaTemplate(t); }}
                  className="app-ripple shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-[12px] font-semibold bg-white text-[#07070a] active:scale-[0.97] transition-transform"
                >
                  <Zap className="w-3 h-3" /> {t.nome}
                </button>
              ))}
            </div>
          )}

          <div className="pv26-glass rounded-[1.5rem] overflow-hidden">
            <div className="px-4 pt-4 pb-2">
              <p className="text-[15px] font-semibold tracking-tight text-white">Materiali</p>
              <p className="text-[12px] text-white/40 mt-0.5 font-medium">Una riga · o incolla tutta la lista</p>
            </div>
            <div className="px-4 pb-4">
              <textarea
                value={chatRigaTesto}
                onChange={(e) => setChatRigaTesto(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    aggiungiRigaChat();
                  }
                }}
                placeholder={"Valvola 1/2 - 18\nTubo rame 16 - 4,50"}
                disabled={chatSalvando}
                rows={3}
                className="w-full px-4 py-3 text-[15px] leading-relaxed font-medium bg-black/30 border border-white/10 rounded-2xl outline-none text-white placeholder:text-white/30 focus:border-white/25 resize-none disabled:opacity-60"
              />
              <button
                type="button"
                onClick={aggiungiRigaChat}
                disabled={!chatRigaTesto.trim() || chatSalvando}
                className="app-ripple mt-2.5 w-full h-12 rounded-2xl bg-white text-[#07070a] disabled:opacity-35 text-[15px] font-semibold flex items-center justify-center gap-2 active:scale-[0.985] transition-transform"
              >
                <Plus className="w-4 h-4" />
                {chatSalvando ? 'Aggiungo…' : 'Aggiungi'}
              </button>
              {chatUltimaAzione && (
                <p className={`text-[12px] font-semibold mt-2 ${chatUltimaAzione.tipo === 'trovato' ? 'text-emerald-300' : 'text-sky-300'}`}>
                  ✓ {chatUltimaAzione.nome}{chatUltimaAzione.prezzo ? ` · ${chatUltimaAzione.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` : ''}
                </p>
              )}
            </div>
            {prodottiPiuUsati.length > 0 && (
              <div className="px-4 pb-4 border-t border-white/10 pt-3">
                <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-white/35 mb-2">Più usati</p>
                <div className="flex gap-2 overflow-x-auto -mx-1 px-1">
                  {prodottiPiuUsati.map(p => {
                    const isAdded = !!carrello.find(i => i.id === p.id);
                    return (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => toggleProdotto(p)}
                        className={`app-ripple shrink-0 flex items-center gap-1 px-3 py-2 rounded-full text-[12px] font-semibold transition-all active:scale-95 ${isAdded ? 'bg-white text-[#07070a]' : 'bg-white/10 text-white/80'}`}
                      >
                        {isAdded ? <Check className="w-3 h-3" /> : <Plus className="w-3 h-3" />}
                        {p.nome.length > 20 ? p.nome.slice(0, 20) + '…' : p.nome}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          <div className="grid grid-cols-2 gap-2.5">
            <div className="pv26-glass rounded-2xl px-3.5 py-3">
              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-white/35 mb-1.5">Km A/R</p>
              <div className="flex items-center gap-1.5">
                <input
                  type="text"
                  inputMode="decimal"
                  value={kmTrasferta}
                  onChange={(e) => setKmTrasferta(e.target.value)}
                  placeholder="0"
                  className="w-full text-[17px] font-semibold tracking-tight bg-transparent border-0 outline-none text-white placeholder:text-white/25"
                />
                <span className="text-[12px] text-white/40 shrink-0 font-medium">km</span>
              </div>
            </div>
            <div className="pv26-glass rounded-2xl px-3.5 py-3">
              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-white/35 mb-1.5">Manodopera</p>
              <div className="flex items-center gap-1.5">
                <input
                  type="text"
                  inputMode="decimal"
                  value={rincaroPercent}
                  onChange={(e) => { setRincaroMode('percent'); setRincaroPercent(e.target.value); }}
                  className="w-full text-[17px] font-semibold tracking-tight bg-transparent border-0 outline-none text-white"
                />
                <span className="text-[12px] text-white/40 shrink-0 font-medium">%</span>
              </div>
            </div>
          </div>

          <div className="pv26-glass rounded-[1.5rem] overflow-hidden">
            <div className="px-4 py-3 border-b border-white/10 flex items-center justify-between">
              <p className="text-[15px] font-semibold tracking-tight text-white">Foto</p>
              <span className={`text-[11px] font-semibold px-2.5 py-1 rounded-full ${fotoCantiere.length >= 2 ? 'bg-emerald-400/15 text-emerald-300' : 'bg-white/10 text-white/50'}`}>
                {fotoCantiere.length}/2
              </span>
            </div>
            <div className="p-3 space-y-3">
              <div className="flex gap-2">
                <label className={`flex-1 flex items-center justify-center gap-1.5 border border-dashed border-white/20 text-white/70 text-[12px] font-semibold py-3.5 rounded-2xl cursor-pointer active:scale-[0.98] transition-transform ${caricandoFoto ? 'opacity-60 pointer-events-none' : ''}`}>
                  <ImagePlus className="w-4 h-4" /> Prima
                  <input type="file" accept="image/*" multiple disabled={caricandoFoto} className="hidden" onChange={(e) => { if (e.target.files.length) gestisciFoto(e.target.files, 'prima'); e.target.value = ''; }} />
                </label>
                <label className={`flex-1 flex items-center justify-center gap-1.5 border border-dashed border-white/20 text-white/70 text-[12px] font-semibold py-3.5 rounded-2xl cursor-pointer active:scale-[0.98] transition-transform ${caricandoFoto ? 'opacity-60 pointer-events-none' : ''}`}>
                  <ImagePlus className="w-4 h-4" /> Dopo
                  <input type="file" accept="image/*" multiple disabled={caricandoFoto} className="hidden" onChange={(e) => { if (e.target.files.length) gestisciFoto(e.target.files, 'dopo'); e.target.value = ''; }} />
                </label>

/* IMPOSTAZIONI — R3 #1: prezzo al km per il calcolo trasferta    */
/* ============================================================ */
function ImpostazioniPage({ impostazioni, setImpostazioni }) {
  const [prezzoKm, setPrezzoKm] = useState((impostazioni.prezzo_km || '0.45').toString().replace('.', ','));
  const [salvando, setSalvando] = useState(false);
  const [salvato, setSalvato] = useState(false);

  const salva = async () => {
    const valore = parseFloat((prezzoKm || '0').replace(',', '.'));
    if (isNaN(valore) || valore < 0) {
      mostraToast('Inserisci un prezzo al km valido.');
      return;
    }
    setSalvando(true);
    const { error } = await sb.from('impostazioni')
      .upsert({ chiave: 'prezzo_km', valore: String(valore) });
    setSalvando(false);
    if (error) {
      mostraToast('Errore nel salvare: ' + error.message);
      return;
    }
    setImpostazioni(prev => ({ ...prev, prezzo_km: String(valore) }));
    setSalvato(true);
    setTimeout(() => setSalvato(false), 2000);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
      <div className="app-card p-5 max-w-md">
        <p className="text-sm font-semibold text-slate-900 mb-1">Trasferta</p>
        <p className="text-xs text-slate-400 mb-4">Usato per calcolare in automatico il costo del viaggio nei preventivi, in base ai km percorsi.</p>
        <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo al km (€)</label>
        <div className="flex items-center gap-2">
          <input
            type="text"
            inputMode="decimal"
            value={prezzoKm}
            onChange={(e) => setPrezzoKm(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && salva()}
            placeholder="0,45"
            className="w-32 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
          <button
            onClick={salva}
            disabled={salvando}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60"
          >
            {salvando ? 'Salvo...' : salvato ? '✓ Salvato' : 'Salva'}
          </button>
        </div>
      </div>
    </div>
  );
}
